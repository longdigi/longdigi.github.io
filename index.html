":"A","body":"Quy định trách nhiệm của cơ quan, tổ chức có liên quan trong việc thực hiện biện pháp bảo đảm an toàn hàng không.","yellow":[]},{"letter":"B","body":"Quy định trách nhiệm của cơ quan, tổ chức, cá nhân có liên quan trong việc thực hiện quy trình, thủ tục, biện pháp bảo đảm an ninh hàng không.","yellow":[[96,122]]},{"letter":"C","body":"Quy định trách nhiệm của tổ chức, cá nhân có liên quan trong việc thực hiện quy trình kiểm soát chất lượng an ninh hàng không.","yellow":[]},{"letter":"D","body":"Quy định trách nhiệm của cảng hàng không trong việc thực hiện biện pháp bảo đảm an ninh hàng không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-85","number":85,"text":"Câu 85: Hệ thống thẻ, giấy phép kiểm soát an ninh hàng không, bao gồm những loại nào dưới đây?","options":[{"letter":"A","body":"Thẻ, giấy phép kiểm soát an ninh cảng hàng không, sân bay loại có giá trị sử dụng dài hạn và loại có giá trị sử dụng ngắn hạn cấp cho người, phương tiện được phép vào và hoạt động tại các khu vực hạn chế của cảng hàng không, sân bay.","yellow":[]},{"letter":"B","body":"Thẻ, giấy phép kiểm soát an ninh nội bộ loại có giá trị sử dụng dài hạn và loại có giá trị sử dụng ngắn hạn được phép vào và hoạt động tại các khu vực hạn chế riêng của doanh nghiệp.","yellow":[]},{"letter":"C","body":"Thẻ nhận dạng tổ bay của hãng hàng không được phép vào và hoạt động tại các khu vực hạn chế có liên quan đến nhiệm vụ của tổ bay.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-86","number":86,"text":"Câu 86: Thời hạn, hiệu lực của thẻ kiểm soát an ninh cảng hàng không, sân bay có giá trị sử dụng ngắn hạn tối đa bao lâu?","options":[{"letter":"A","body":"7 ngày kể từ thời điểm thẻ được cấp có hiệu lực.","yellow":[]},{"letter":"B","body":"10 ngày kể từ thời điểm thẻ được cấp có hiệu lực.","yellow":[]},{"letter":"C","body":"15 ngày kể từ thời điểm thẻ được cấp có hiệu lực.","yellow":[]},{"letter":"D","body":"30 ngày kể từ thời điểm thẻ được cấp có hiệu lực.","yellow":[[0,27]]}],"answer":3,"explanation":""},{"id":"p1-87","number":87,"text":"Câu 87: Thẻ kiểm soát an ninh cảng hàng không, sân bay có giá trị sử dụng dài hạn có các thông tin cơ bản nào sau đây?","options":[{"letter":"A","body":"Số thẻ; ký hiệu cảng hàng không, sân bay được phép vào và hoạt động; thời hạn hiệu lực của thẻ; họ và tên của người được cấp thẻ, chức danh của người được cấp thẻ.","yellow":[]},{"letter":"B","body":"Tên cơ quan, đơn vị của người được cấp thẻ; ảnh của người được cấp thẻ; khu vực hạn chế được phép vào và hoạt động; quy định về sử dụng thẻ.","yellow":[]},{"letter":"C","body":"Số thẻ; ký hiệu cảng hàng không, sân bay được phép vào và hoạt động; thời hạn hiệu lực của thẻ; họ và tên của người được cấp thẻ, chức danh của người được cấp thẻ; số chứng minh thư nhân dân, thẻ căn cước công dân.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]}],"answer":3,"explanation":""},{"id":"p1-88","number":88,"text":"Câu 88: Thẻ, giấy phép kiểm soát an ninh hàng không bị mất giá trị sử dụng trong các trường hợp nào?","options":[{"letter":"A","body":"Thẻ, giấy phép bị hỏng; nội dung trên thẻ, giấy phép bị mờ; không còn dấu hiệu bảo mật","yellow":[]},{"letter":"B","body":"Người được cấp thẻ không còn đáp ứng về đối tượng, điều kiện cấp thẻ","yellow":[]},{"letter":"C","body":"Phương tiện được cấp giấy phép không còn đáp ứng đối tượng, điều kiện cấp giấy phép","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p1-89","number":89,"text":"Câu 89: Lực lượng kiểm soát an ninh hàng không bao gồm những lực lượng nào dưới đây?","options":[{"letter":"A","body":"Lực lượng kiểm soát an ninh hàng không của đơn vị cung cấp dịch vụ bảo đảm an ninh hàng không.","yellow":[]},{"letter":"B","body":"Lực lượng kiểm soát an ninh hàng không của doanh nghiệp cung cấp dịch vụ không lưu; doanh nghiệp sản xuất, bảo dưỡng, sửa chữa tàu bay, thiết bị tàu bay; doanh nghiệp cung cấp dịch vụ xăng dầu hàng không, doanh nghiệp cung cấp dịch vụ suất ăn hàng không.","yellow":[]},{"letter":"C","body":"Lực lượng kiểm soát an ninh hàng không của hãng hàng không Việt Nam, doanh nghiệp kinh doanh hàng không chung.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p1-90","number":90,"text":"Câu 90: Việc kiểm tra, giám sát việc tuân thủ các quy định của pháp luật về bảo đảm an ninh hàng không; các chương trình, quy chế an ninh hàng không dân dụng tại cảng hàng không, sân bay thuộc trách nhiệm của cơ quan, đơn vị nào?","options":[{"letter":"A","body":"Cục Hàng không Việt Nam.","yellow":[]},{"letter":"B","body":"Bộ Giao thông vận tải.","yellow":[]},{"letter":"C","body":"Cảng vụ hàng không.","yellow":[[0,18]]},{"letter":"D","body":"Lực lượng kiểm soát an ninh hàng không","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-91","number":91,"text":"Câu 91: Đối tượng áp dụng của Thông tư 13/2019/TT-BGTVT quy định chi tiết Chương trình an ninh hàng không và kiểm soát chất lượng an ninh hàng không Việt Nam, bao gồm?","options":[{"letter":"A","body":"Tổ chức, cá nhân Việt Nam và tổ chức, cá nhân nước ngoài hoạt động hàng không dân dụng tại Việt Nam hoặc hoạt động hàng không dân dụng trong vùng thông báo bay do Việt Nam quản lý.","yellow":[]},{"letter":"B","body":"Tổ chức, cá nhân Việt Nam hoạt động hàng không dân dụng ở nước ngoài nếu pháp luật của nước ngoài không có quy định khác.","yellow":[]},{"letter":"C","body":"Tổ chức, cá nhân Việt Nam và tổ chức, cá nhân nước ngoài sử dụng tàu bay công vụ nhằm mục đích dân dụng.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-92","number":92,"text":"Câu 92: Việc vận chuyển hàng nguy hiểm bằng đường hàng không phải tuân thủ các quy định nào?","options":[{"letter":"A","body":"Hàng nguy hiểm phải được đóng gói, dán nhãn đúng quy định và khai báo trước khi chấp nhận để vận chuyển","yellow":[]},{"letter":"B","body":"Hãng hàng không chịu trách nhiệm kiểm tra, xác định sự tuân thủ các quy định về vận chuyển hàng nguy hiểm bằng đường hàng không trước khi chấp nhận vận chuyển hàng nguy hiểm","yellow":[]},{"letter":"C","body":"Hàng nguy hiểm phải được đóng gói, dán nhãn đúng quy định và khai báo trước khi chấp nhận để vận chuyển. Hãng hàng không chịu trách nhiệm kiểm tra, xác định sự tuân thủ các quy định về vận chuyển hàng nguy hiểm bằng đường hàng không trước khi chấp nhận vận chuyển hàng nguy hiểm.","yellow":[[61,146]]},{"letter":"D","body":"Đáp án A và C đúng.","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-93","number":93,"text":"Câu 93: Hành khách không làm chủ được hành vi bao gồm những trường hợp nào sau đây?","options":[{"letter":"A","body":"Mất khả năng nhận thức hoặc mất khả năng điều khiển làm chủ hành vi của mình do bị bệnh tâm thần.","yellow":[]},{"letter":"B","body":"Mất khả năng nhận thức hoặc mất khả năng điều khiển làm chủ hành vi của mình do sử dụng rượu bia hoặc chất kích thích.","yellow":[]},{"letter":"C","body":"Hành khách là người khuyết tật.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-94","number":94,"text":"Câu 94: Lực lượng nào chịu trách nhiệm kiểm tra, giám sát an ninh đối với người, phương tiện, đồ vật đưa vào, ra và hoạt động tại khu vực hạn chế của cảng hàng không, sân bay?","options":[{"letter":"A","body":"Lực lượng kiểm soát an ninh hàng không.","yellow":[[0,14],[15,38]]},{"letter":"B","body":"Lực lượng bảo vệ của doanh nghiệp.","yellow":[]},{"letter":"C","body":"Cảng vụ hàng không khu vực.","yellow":[]},{"letter":"D","body":"Công an địa phương.","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-95","number":95,"text":"Câu 95: Cơ quan nào thực hiện kiểm tra, đánh giá, thử nghiệm công khai, bí mật, điều tra tại tất cả các cảng hàng không, sân bay, cơ sở cung cấp dịch vụ hàng không, hãng hàng không và các phương tiện, trang bị, thiết bị hoạt động hàng không dân dụng trong cả nước?","options":[{"letter":"A","body":"Bộ Giao thông vận tải","yellow":[]},{"letter":"B","body":"Cục hàng không Việt Nam","yellow":[[0,23]]},{"letter":"C","body":"Cảng Vụ hàng không","yellow":[]},{"letter":"D","body":"Người khai thác Cảng hàng không, sân bay","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-96","number":96,"text":"Câu 96: Giám sát viên an ninh hàng không là người thuộc cơ quan, đơn vị nào dưới đây?","options":[{"letter":"A","body":"Cảng vụ hàng không và Cục Hàng không Việt Nam","yellow":[[5,36]]},{"letter":"B","body":"Cảng vụ hàng không và Người khai thác Cảng","yellow":[]},{"letter":"C","body":"Cục Hàng không Việt Nam và Người khai thác Cảng","yellow":[]},{"letter":"D","body":"Người khai thác Cảng và Hãng hàng không","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-97","number":97,"text":"Câu 97: Xử lý vụ việc vi phạm an ninh hàng không dựa trên nguyên tắc nào sau đây?","options":[{"letter":"A","body":"Báo cáo lãnh đạo các cấp xin ý kiến chỉ đạo và tiến hành các biện pháp xử lý tiếp theo.","yellow":[]},{"letter":"B","body":"Không để vi phạm lan rộng và hạn chế tới mức thấp nhất hậu quả xảy ra.","yellow":[]},{"letter":"C","body":"Kịp thời, nhanh chóng, không để vi phạm lan rộng và hạn chế tới mức thấp nhất hậu quả xảy ra.","yellow":[[10,43]]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-98","number":98,"text":"Câu 98: Lực lượng nào chịu trách nhiệm xử lý ban đầu các vụ việc vi phạm an ninh hàng không, trật tự công cộng xảy ra tại cảng hàng không sân bay thuộc quyền quản lý?","options":[{"letter":"A","body":"Cảng vụ hàng không","yellow":[]},{"letter":"B","body":"Lực lượng kiểm soát an ninh hàng không.","yellow":[[10,38]]},{"letter":"C","body":"Công an, chính quyền địa phương nơi có cảng hàng không sân bay.","yellow":[]},{"letter":"D","body":"Người khai thác cảng hàng không sân bay","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-99","number":99,"text":"Câu 99: Khi nhận được thông tin về một hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng, người khai thác cảng hàng không sân bay, hãng hàng không, đơn vị cung cấp dịch vụ bảo đảm an ninh hàng không, doanh nghiệp cung cấp dịch vụ không lưu có liên quan phải làm gì?","options":[{"letter":"A","body":"Phân tích, đánh giá sơ bộ về tính chất của thông tin để xem xét triển khai phương án khẩn nguy thích hợp.","yellow":[]},{"letter":"B","body":"Báo cáo ngay thông tin, kết quả đánh giá và kiến nghị biện pháp đối phó đến cơ quan có thẩm quyền theo quy định.","yellow":[]},{"letter":"C","body":"Huy động lực lượng, phương tiện của đơn vị mình tổ chức đối phó ban đầu theo quy định.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p1-100","number":100,"text":"Câu 100: Cơ quan nào phê duyệt Kế hoạch khẩn nguy đối phó ban đầu với hành vi can thiệp bất hợp pháp của cảng hàng không, sân bay xây dựng?","options":[{"letter":"A","body":"Cục Hàng không Việt Nam","yellow":[[0,23]]},{"letter":"B","body":"Bộ giao thông vận tải","yellow":[]},{"letter":"C","body":"Tổng công ty Cảng hàng không Việt Nam","yellow":[]},{"letter":"D","body":"Cảng vụ hàng không","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-101","number":101,"text":"Câu 101: Cục Hàng không Việt Nam phối hợp với những cơ quan, đơn vị nào để thu thập, đánh giá thông tin về tình hình an ninh chính trị, trật tự an toàn xã hội; âm mưu, phương thức, thủ đoạn hoạt động của khủng bố, các tổ chức phản động và các loại tội phạm, âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng để quyết định áp dụng biện pháp kiểm soát an ninh hàng không tăng cường cho từng cấp độ theo quy định của pháp luật?","options":[{"letter":"A","body":"Cơ quan thuộc Bộ Công an, Bộ Quốc phòng và các bộ nghành có liên quan.","yellow":[[26,69]]},{"letter":"B","body":"Cơ quan thuộc Bộ Công an, Bộ Giao thông vận tải và các bộ nghành có liên quan.","yellow":[]},{"letter":"C","body":"Cơ quan thuộc Bộ Công an, Bộ Quốc phòng và Bộ Giao thông vận tải","yellow":[]},{"letter":"D","body":"Cơ quan thuộc Bộ Công an, Bộ Quốc phòng, Bộ Giao thông vận tải, Bộ Ngoại giao","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-102","number":102,"text":"Câu 102: Luật số 14/2017/QH14 ngày 20/06/2017 quy định về vấn đề gì?","options":[{"letter":"A","body":"Quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ","yellow":[[9,33]]},{"letter":"B","body":"Hàng không dân dụng","yellow":[]},{"letter":"C","body":"Luật tương trợ tư pháp","yellow":[]},{"letter":"D","body":"Luật dân sự","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-103","number":103,"text":"Câu 103: Luật quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ số 14/2017/QH14 ngày 20/06/2017 có hiệu lực thi hành từ ngày, tháng, năm nào?","options":[{"letter":"A","body":"Ngày 11/07/2017","yellow":[]},{"letter":"B","body":"Ngày 01/01/2018","yellow":[]},{"letter":"C","body":"Ngày 01/07/2018","yellow":[[0,15]]},{"letter":"D","body":"Ngày 11/07/2018","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-104","number":104,"text":"Câu 104: Theo quy định tại Luật quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ, công cụ hỗ trợ được sử dụng để làm gì?","options":[{"letter":"A","body":"Hạn chế, ngăn chặn người có hành vi vi phạm pháp luật chống trả, trốn chạy","yellow":[]},{"letter":"B","body":"Bảo vệ người thi hành công vụ, người thực hiện nhiệm vụ bảo vệ","yellow":[]},{"letter":"C","body":"Báo hiệu khẩn cấp","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-105","number":105,"text":"Câu 105: Theo quy định tại Luật quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ, lực lượng An ninh hàng không được trang bị những loại vũ khí nào?","options":[{"letter":"A","body":"Vũ khí thô sơ và vũ khí thể thao","yellow":[]},{"letter":"B","body":"Vũ khí thô sơ và vũ khí quân dụng","yellow":[[0,33]]},{"letter":"C","body":"Vũ khí thể thao và vũ khí quân dụng","yellow":[]},{"letter":"D","body":"Vũ khí thô sơ, vũ khí thể thao và vũ khí quân dụng","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-106","number":106,"text":"Câu 106: Theo quy định tại Luật quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ, loại vũ khí quân dụng nào được trang bị cho lực lượng An ninh hàng không?","options":[{"letter":"A","body":"Súng ngắn, súng tiểu liên và đạn sử dụng cho các loại súng này","yellow":[]},{"letter":"B","body":"Súng trung liên, súng đại liên và đạn sử dụng cho các loại súng này","yellow":[]},{"letter":"C","body":"Súng ngắn và đạn sử dụng cho loại súng này","yellow":[[5,38]]},{"letter":"D","body":"Súng máy có cỡ nòng đến 14,5 mm và đạn sử dụng cho loại súng này","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-107","number":107,"text":"Câu 107: Theo Luật quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ, cá nhân được giao, sử dụng vũ khí, vật liệu nổ, công cụ hỗ trợ phải đáp ứng điều kiện nào sau đây?","options":[{"letter":"A","body":"Có năng lực hành vi dân sự đầy đủ; có phẩm chất đạo đức tốt, đủ sức khoẻ phù hợp với công việc được giao.","yellow":[]},{"letter":"B","body":"Không đang trong thời gian bị áp dụng biện pháp xử lý hành chính, bị truy cứu trách nhiệm hình sự; đã được xóa án tích trong trường hợp bị kết tội theo bản án, quyết định của Tòa án;","yellow":[]},{"letter":"C","body":"Đã qua đào tạo, huấn luyện và được cấp giấy chứng nhận về sử dụng vũ khí, vật liệu nổ, công cụ hỗ trợ.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p1-108","number":108,"text":"Câu 108: Nghị định số 96/2021/NĐ-CP của Thủ tướng Chính phủ quy định về vấn đề gì?","options":[{"letter":"A","body":"Công tác quản lý vũ khí, công cụ hỗ trợ, vật liệu nổ.","yellow":[]},{"letter":"B","body":"Quy định về an ninh hàng không.","yellow":[]},{"letter":"C","body":"Quy định về xử phạt hành chính trong lĩnh vực hàng không dân dụng.","yellow":[]},{"letter":"D","body":"Công tác đảm bảo chuyến bay chuyên cơ, chuyên khoang.","yellow":[[17,53]]}],"answer":3,"explanation":""},{"id":"p1-109","number":109,"text":"Câu 109: Đơn vị nào sau đây có trách nhiệm chỉ đạo, giám sát các cơ quan, đơn vị trong ngành hàng không thực hiện và phục vụ chuyến bay chuyên cơ, chuyên khoang theo tiêu chuẩn an ninh, an toàn?","options":[{"letter":"A","body":"Cục Hàng không Việt Nam","yellow":[[0,23]]},{"letter":"B","body":"Cảng Vụ hàng không, sân bay","yellow":[]},{"letter":"C","body":"Người khai thác cảng hàng không, sân bay","yellow":[]},{"letter":"D","body":"Hãng hàng không phục vụ chuyến bay chuyên cơ","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-110","number":110,"text":"Câu 110: Những đối tượng nào sau đây được trang bị công cụ hỗ trợ?","options":[{"letter":"A","body":"Quân đội nhân dân; Dân quân tự vệ; Cảnh sát biển; Công an nhân dân; Cơ yếu; Cơ quan điều tra của Viện kiểm sát nhân dân tối cao; Cơ quan thi hành án dân sự.","yellow":[]},{"letter":"B","body":"Kiểm lâm, lực lượng bảo vệ rừng chuyên trách, Kiểm ngư, lực lượng trực tiếp thực hiện nhiệm vụ thanh tra chuyên ngành thủy sản; Hải quan cửa khẩu, lực lượng chuyên trách chống buôn lậu của Hải quan; Đội kiểm tra của lực lượng Quản lý thị trường.","yellow":[]},{"letter":"C","body":"An ninh hàng không, lực lượng trực tiếp thực hiện nhiệm vụ thanh tra chuyên ngành giao thông vận tải; Lực lượng bảo vệ cơ quan, tổ chức, doanh nghiệp; doanh nghiệp kinh doanh dịch vụ bảo vệ; Ban Bảo vệ dân phố; Câu lạc bộ, cơ sở đào tạo, huấn luyện thể thao có giấy phép hoạt động; Cơ sở cai nghiện ma túy; Các đối tượng khác có nhu cầu trang bị công cụ hỗ trợ thì căn cứ vào tính chất, yêu cầu, nhiệm vụ, Bộ trưởng Bộ Công an quyết định.","yellow":[]},{"letter":"D","body":"Đáp án A và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p1-111","number":111,"text":"Câu 111: Khi thực hiện nhiệm vụ bảo đảm an ninh, trật tự, an toàn xã hội, việc sử dụng vũ khí quân dụng phải tuân theo nguyên tắc nào sau đây?","options":[{"letter":"A","body":"Phải căn cứ vào tình huống, tính chất, mức độ nguy hiểm của hành vi mà đối tượng thực hiện để quyết định việc sử dụng vũ khí quân dụng.","yellow":[]},{"letter":"B","body":"Chỉ sử dụng vũ khí quân dụng khi không còn biện pháp nào khác để ngăn chặn hành vi của đối tượng và sau khi đã cảnh báo mà đối tượng không tuân theo. Nếu việc sử dụng vũ khí quân dụng không kịp thời sẽ đe dọa trực tiếp đến tính mạng, sức khỏe của người thi hành công vụ, người khác hoặc có thể gây ra những hậu quả đặc biệt nghiêm trọng khác thì được sử dụng ngay.","yellow":[]},{"letter":"C","body":"Không sử dụng vũ khí quân dụng khi biết rõ đối tượng là phụ nữ, người khuyết tật, trẻ em, người cao tuổi, trừ trường hợp những người này sử dụng vũ khí, vật liệu nổ tấn công hoặc chống trả, đe dọa tính mạng, sức khỏe của người thi hành công vụ hoặc người khác.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p1-112","number":112,"text":"Câu 112: Trách nhiệm của Bộ Giao thông vận trong Luật phòng chống khủng bố là gì?","options":[{"letter":"A","body":"Chỉ đạo cơ quan, đơn vị thuộc quyền sẵn sàng tham gia phòng, chống khủng bố theo quyết định huy động của người có thẩm quyền.","yellow":[]},{"letter":"B","body":"Phối hợp với Bộ Công an, Bộ Quốc phòng, các bộ, ngành liên quan và Ủy ban nhân dân địa phương xây dựng, huấn luyện, diễn tập, tổ chức thực hiện các phương án phòng, chống cướp tàu bay, tàu biển, bắt cóc con tin, gây nổ trên tàu bay, tàu biển, tàu hỏa và các phương tiện giao thông công cộng khác, bảo vệ an toàn các sân bay, bến cảng, nhà ga, bến xe","yellow":[]},{"letter":"C","body":"Phối hợp với Bộ Công an, Bộ Quốc phòng và Ủy ban nhân dân địa phương bảo vệ an ninh, trật tự tại các khu vực sân bay, nhà ga, bến tàu, bến xe, cảng biển, cầu, hầm đường bộ quan trọng; kiểm soát người điều khiển, hành khách và phương tiện giao thông vận tải để phát hiện, ngăn chặn và xử lý các hoạt động khủng bố.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p1-113","number":113,"text":"Câu 113: Theo Luật Phòng, chống khủng bố số 28/2013/QH13 ngày 12/06/2013, thông tin, tuyên truyền, giáo dục về phòng, chống khủng bố gồm những nội dung nào?","options":[{"letter":"A","body":"Nguy cơ, diễn biến, tình hình khủng bố; thủ đoạn, phương thức hoạt động, tính chất nguy hiểm, tác hại của khủng bố.","yellow":[]},{"letter":"B","body":"Biện pháp, kinh nghiệm, chính sách, pháp luật về phòng, chống khủng bố.","yellow":[]},{"letter":"C","body":"Trách nhiệm của cơ quan, tổ chức, cá nhân trong phòng, chống khủng bố.","yellow":[]},{"letter":"D","body":"Các nội dung cần thiết khác phục vụ cho yêu cầu phòng, chống khủng bố.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]},{"letter":"F","body":"Đáp án A, B, C và D đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p1-114","number":114,"text":"Câu 114: Theo Quyết định 16/2017/QĐ-TTg ngày 16/5/2017 của Thủ tướng Chính phủ về Phương án khẩn nguy tổng thể đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng, người khai thác cảng hàng không, sân bay tổ chức diễn tập phương án đối phó tình huống khẩn nguy cấp cơ sở theo đáp án nào sau đây?","options":[{"letter":"A","body":"Tổ chức đối với các tình huống cấp độ 1.","yellow":[]},{"letter":"B","body":"Tổ chức đối với các tình huống cấp độ 1 hoặc một phần của tình huống cấp độ 2.","yellow":[[31,53],[54,77]]},{"letter":"C","body":"Tổ chức đối với các tình huống cấp độ 1 hoặc cấp độ 2.","yellow":[]},{"letter":"D","body":"Tổ chức đối với các tình huống cấp độ 2 hoặc cấp độ 3.","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-115","number":115,"text":"Câu 115: Bảo đảm an ninh hàng không được thực hiện bằng các biện pháp nào sau đây?","options":[{"letter":"A","body":"Chọn người có năng lực hành vi dân sự đầy đủ; có phẩm chất đạo đức tốt, đủ sức khoẻ phù hợp.","yellow":[]},{"letter":"B","body":"Thiết lập khu vực hạn chế tại cảng hàng không, sân bay và nơi có công trình, trang bị, thiết bị hàng không để bảo vệ tàu bay và công trình, trang bị, thiết bị tại khu vực đó.","yellow":[]},{"letter":"C","body":"Kiểm tra, soi chiếu, giám sát an ninh hàng không đối với tàu bay, phương tiện, người, hành lý, hàng hoá, việc ra, vào và hoạt động trong khu vực hạn chế theo quy định; lục soát đối với tàu bay, phương tiện, người, hành lý, hàng hoá khi có dấu hiệu uy hiếp an ninh hàng không.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[[0,18]]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-116","number":116,"text":"Câu 116: Quyết định nào sửa đổi, bổ sung một số điều của Quyết định số 16/2017/QĐ-TTg ngày 16/5/2017 của Thủ tướng Chính phủ về Phương án khẩn nguy tổng thể đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng?","options":[{"letter":"A","body":"Nghị định số 81/2010/NĐ-CP.","yellow":[]},{"letter":"B","body":"Quyết định số 01/2019/QĐ-TTg.","yellow":[[6,28]]},{"letter":"C","body":"Nghị định số 92/2015/NĐ-CP.","yellow":[]},{"letter":"D","body":"Thông tư 01/2016/TT-BGTVT","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-117","number":117,"text":"Câu 117: Cơ quan đơn vị nào là Ban chỉ đạo khẩn nguy hàng không quốc gia khi chỉ đạo đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng?","options":[{"letter":"A","body":"Uỷ ban an ninh hàng không dân dụng quốc gia","yellow":[[3,29]]},{"letter":"B","body":"Bộ Công An","yellow":[]},{"letter":"C","body":"Bộ Giao thông vận tải","yellow":[]},{"letter":"D","body":"Bộ Quốc phòng","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-118","number":118,"text":"Câu 118: Cơ quan, đơn vị nào ban hành quyết định cấm vận chuyển bằng đường hàng không có thời hạn hoặc vĩnh viễn đối với hành khách có các hành vi vi phạm theo quy định của pháp luật?","options":[{"letter":"A","body":"Cục hàng không Việt Nam","yellow":[[0,23]]},{"letter":"B","body":"Lực lượng kiểm soát an ninh hàng không","yellow":[]},{"letter":"C","body":"Công an địa phương","yellow":[]},{"letter":"D","body":"Cảng vụ hàng không","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-119","number":119,"text":"Câu 119: Biện pháp kiểm tra, giám sát an ninh hàng không khu vực cách ly?","options":[{"letter":"A","body":"Khu vực cách ly phải được kiểm tra an ninh hàng không trước khi đưa vào khai thác hàng ngày và giám sát an ninh chặt chẽ, liên tục trong suốt thời gian khai thác.","yellow":[]},{"letter":"B","body":"Khi không hoạt động, tất cả cửa vào, cửa ra của khu vực cách ly phải được khoá hoặc có nhân viên kiểm soát an ninh hàng không canh gác, bảo vệ.","yellow":[]},{"letter":"C","body":"Trình tự, thủ tục kiểm tra, giám sát an ninh hàng không đối với khu vực cách ly phải được quy định cụ thể, chi tiết tại quy chế an ninh hàng không của đơn vị cung cấp dịch vụ bảo đảm an ninh hàng không","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""}]},{"id":"p2","title":"II. PHẦN 2: Lý thuyết kiểm soát an ninh hàng không","questions":[{"id":"p2-1","number":1,"text":"Câu 1: Những trường hợp vi phạm nào sau đây thì bị cấm vận chuyển bằng đường hàng không từ 03 đến 12 tháng?","options":[{"letter":"A","body":"Hành khách gây rối.","yellow":[]},{"letter":"B","body":"Không thực hiện các quyết định xử phạt vi phạm hành chính trong lĩnh vực hàng không dân dụng.","yellow":[]},{"letter":"C","body":"Sử dụng giấy tờ giả để đi tàu bay.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-2","number":2,"text":"Câu 2: Trường hợp vi phạm nào sau đây thì bị cấm vận chuyển bằng đường hàng không trên 12 tháng đến 24 tháng?","options":[{"letter":"A","body":"Hành khách gây rối.","yellow":[]},{"letter":"B","body":"Có hành vi vi phạm trật tự công cộng, kỷ luật tại cảng hàng không, sân bay, trên tàu bay.","yellow":[]},{"letter":"C","body":"Đối tượng đã bị xử lý cấm vận chuyển mà vẫn tái phạm.","yellow":[[22,52]]},{"letter":"D","body":"Phát ngôn mang tính đe dọa sử dụng bom, mìn, chất nổ, vật liệu nổ, chất phóng xạ, vũ khí sinh học trong khu vực làm thủ tục vận chuyển, khu vực cách ly, sân bay, trên tàu bay.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-3","number":3,"text":"Câu 3: Ai là người có thẩm quyền quyết định việc lục soát an ninh hàng không tại cảng hàng không, sân bay?","options":[{"letter":"A","body":"Người đứng đầu lực lượng kiểm soát an ninh hàng không tại cảng hàng không, sân bay.","yellow":[]},{"letter":"B","body":"Người đứng đầu bộ phận kiểm tra, soi chiếu an ninh hàng không tại cảng hàng không, sân bay.","yellow":[]},{"letter":"C","body":"Người đứng đầu bộ phận an ninh kiểm soát, an ninh cơ động tại cảng hàng không, sân bay.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p2-4","number":4,"text":"Câu 4: Hành lý thất lạc, nhầm địa chỉ trước khi đưa vào khu vực lưu giữ và đưa lại lên tàu bay phải được thực hiện biện pháp kiểm tra an ninh nào?","options":[{"letter":"A","body":"Kiểm tra trực quan.","yellow":[]},{"letter":"B","body":"Kiểm tra, soi chiếu an ninh hàng không.","yellow":[[10,38]]},{"letter":"C","body":"Thông báo cho Hãng hàng không.","yellow":[]},{"letter":"D","body":"Thông báo cho Cảng vụ hàng không khu vực.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-5","number":5,"text":"Câu 5: Biện pháp tăng cường an ninh cấp độ 1 được áp dụng trong trường hợp nào sau đây?","options":[{"letter":"A","body":"Có tình hình mất an ninh chính trị tại địa phương.","yellow":[]},{"letter":"B","body":"Có sự kiện chính trị, xã hội trọng đại của đất nước.","yellow":[[3,28],[29,51]]},{"letter":"C","body":"Có tình hình mất trật tự xã hội tại địa phương.","yellow":[]},{"letter":"D","body":"Có tình hình mất an ninh chính trị, trật tự xã hội đặc biệt nghiêm trọng.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-6","number":6,"text":"Câu 6: Biện pháp tăng cường an ninh cấp độ 2 được áp dụng trong trường hợp nào sau đây?","options":[{"letter":"A","body":"Có sự kiện chính trị, xã hội trọng đại của đất nước.","yellow":[]},{"letter":"B","body":"Có tình hình mất an ninh chính trị, trật tự xã hội nghiêm trọng tại địa phương.","yellow":[[36,63],[64,79]]},{"letter":"C","body":"Có tình hình an ninh chính trị, trật tự xã hội phức tạp.","yellow":[]},{"letter":"D","body":"Có thông tin xác thực về một âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng có địa điểm, mục tiêu, thời gian cụ thể.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-7","number":7,"text":"Câu 7: Lục soát an ninh hàng không là gì?","options":[{"letter":"A","body":"Là việc sử dụng riêng lẻ hoặc kết hợp biện pháp soi chiếu, kiểm tra trực quan và các biện pháp khác để nhận biết, phát hiện, ngăn chặn các hành vi vi phạm hoặc có dấu hiệu vi phạm về an ninh hàng không.","yellow":[]},{"letter":"B","body":"Là việc sử dụng riêng lẻ hoặc kết hợp con người, động vật, trang bị, thiết bị kỹ thuật để quản lý, theo dõi nhằm phát hiện, ngăn chặn các hành vi vi phạm hoặc có dấu hiệu vi phạm về an ninh hàng không.","yellow":[]},{"letter":"C","body":"Là việc kiểm tra chi tiết từng đồ vật, vị trí của đối tượng, người bị lục soát nhằm phát hiện, ngăn chặn vũ khí, chất nổ hoặc thiết bị, vật phẩm nguy hiểm khác để loại trừ yếu tố gây uy hiếp an ninh hàng không. Việc lục soát an ninh hàng không do người có thẩm quyền quyết định.","yellow":[[61,93]]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-8","number":8,"text":"Câu 8: Hành lý ký gửi bị rách, vỡ, bung khóa không còn nguyên vẹn trước khi chất xếp lên tàu bay hoặc có dấu hiệu bị can thiệp trái phép phải được xử lý như thế nào?","options":[{"letter":"A","body":"Đóng gói lại rồi cho chất xếp lên tàu bay.","yellow":[]},{"letter":"B","body":"Tái kiểm tra an ninh hàng không.","yellow":[[4,31]]},{"letter":"C","body":"Từ chối hoàn thành thủ tục an ninh hàng không.","yellow":[]},{"letter":"D","body":"Thông báo cho Cảng vụ hàng không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-9","number":9,"text":"Câu 9: Trường hợp có dấu hiệu hoặc có thông tin đe dọa liên quan đến an ninh, an toàn của chuyến bay thì hành lý thất lạc, hành lý không có người nhận phải được thực hiện bằng biện pháp kiểm tra nào sau đây?","options":[{"letter":"A","body":"Kiểm tra bằng máy soi tia X.","yellow":[]},{"letter":"B","body":"Kiểm tra bằng thiết bị phát hiện kim loại cầm tay.","yellow":[]},{"letter":"C","body":"Lục soát an ninh hàng không.","yellow":[[0,27]]},{"letter":"D","body":"Kiểm tra bằng thiết bị phát hiện chất nổ.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-10","number":10,"text":"Câu 10: Kiểm tra bổ sung ngẫu nhiên tối thiểu 10% sau kiểm tra an ninh hàng không lần đầu đối với hành khách, hành lý xách tay được thực hiện bằng biện pháp nào sau đây?","options":[{"letter":"A","body":"Kiểm tra bằng cổng từ kết hợp thiết bị phát hiện kim loại cầm tay.","yellow":[]},{"letter":"B","body":"Kiểm tra bằng máy soi ở nhiều tư thế khác nhau.","yellow":[]},{"letter":"C","body":"Kiểm tra trực quan hoặc kiểm tra bằng dụng cụ, thiết bị, động vật phát hiện chất nổ.","yellow":[[57,83]]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-11","number":11,"text":"Câu 11: Biện pháp tăng cường an ninh cấp độ 3 được áp dụng trong trường hợp nào sau đây?","options":[{"letter":"A","body":"Có thông tin xác thực về một âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng có địa điểm, mục tiêu, thời gian cụ thể.","yellow":[]},{"letter":"B","body":"Có tình hình mất an ninh chính trị, trật tự xã hội đặc biệt nghiêm trọng tại địa phương.","yellow":[]},{"letter":"C","body":"Có thông tin xác thực về một âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p2-12","number":12,"text":"Câu 12: Ngoại trừ túi ngoại giao, túi lãnh sự, hành lý ký gửi vận chuyển không cùng với hành khách trên chuyến bay theo quy định của Luật Hàng không dân dụng Việt Nam phải áp dụng các biện pháp kiểm tra an ninh hàng không bổ sung nào sau đây?","options":[{"letter":"A","body":"Soi chiếu bằng máy soi tia X đối với đồ vật ở các tư thế khác nhau.","yellow":[]},{"letter":"B","body":"Kiểm tra bằng dụng cụ, thiết bị phát hiện chất nổ.","yellow":[]},{"letter":"C","body":"Phải được lập biên bản kiểm tra.","yellow":[]},{"letter":"D","body":"Kiểm tra như hành lý của khách bình thường.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-13","number":13,"text":"Câu 13: Việc kiểm tra túi ngoại giao, túi lãnh sự được nhân viên kiểm soát an ninh hàng không thực hiện như thế nào?","options":[{"letter":"A","body":"Kiểm tra niêm phong, những dấu hiệu nhận biết bên ngoài của túi ngoại giao, túi lãnh sự theo quy định của pháp luật về ngoại giao và lãnh sự.","yellow":[]},{"letter":"B","body":"Kiểm tra hộ chiếu, giấy ủy quyền mang túi ngoại giao, túi lãnh sự, văn bản của cơ quan đại diện ngoại giao, cơ quan lãnh sự xác nhận số kiện của túi ngoại giao, túi lãnh sự.","yellow":[]},{"letter":"C","body":"Kiểm tra như hành lý của khách bình thường.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p2-14","number":14,"text":"Câu 14: Hành khách nối chuyến, quá cảnh, tạm dừng nội địa và hành lý xách tay phải được kiểm tra an ninh hàng không bằng biện pháp soi chiếu như hành khách xuất phát trước khi lên lại tàu bay, trừ những trường hợp đáp ứng các yêu cầu nào sau đây?","options":[{"letter":"A","body":"Hành khách được dán thẻ hành khách tạm dừng, nối chuyến, quá cảnh.","yellow":[]},{"letter":"B","body":"Hành khách không ra khỏi khu vực hạn chế hoặc được giám sát an ninh liên tục.","yellow":[]},{"letter":"C","body":"Hành khách được dán thẻ hành khách tạm dừng, nối chuyến, quá cảnh và từ lúc xuống khỏi tàu bay, hành khách không ra khỏi khu vực hạn chế hoặc được giám sát an ninh liên tục.","yellow":[[57,94]]},{"letter":"D","body":"Hành khách có biểu hiện nghi vấn.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-15","number":15,"text":"Câu 15: Không được phép chuyên chở trên tàu bay hành lý không có người đi cùng khi đang áp dụng biện pháp tăng cường an ninh cấp độ mấy?","options":[{"letter":"A","body":"Tăng cường an ninh cấp độ 1.","yellow":[]},{"letter":"B","body":"Tăng cường an ninh cấp độ 2.","yellow":[]},{"letter":"C","body":"Tăng cường an ninh cấp độ 3.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[[0,18]]}],"answer":3,"explanation":""},{"id":"p2-16","number":16,"text":"Câu 16: Túi ngoại giao, túi lãnh sự được soi chiếu tia X trong trường hợp nào?","options":[{"letter":"A","body":"Hãng hàng không trực tiếp vận chuyển có yêu cầu bằng văn bản gửi người đứng đầu lực lượng kiểm soát an ninh hàng không tại cảng hàng không, sân bay và được sự đồng thuận của giao thông viên ngoại giao hoặc giao thông viên lãnh sự.","yellow":[]},{"letter":"B","body":"Việc soi chiếu tia X phải được ghi nhận bằng văn bản có sự xác nhận của hãng hàng không, giao thông viên ngoại giao hoặc giao thông viên lãnh sự, nhân viên kiểm soát an ninh hàng không và Cảng vụ hàng không; biên bản phải được gửi cho cơ quan đại diện ngoại giao, cơ quan đại diện lãnh sự.","yellow":[]},{"letter":"C","body":"Tất cả các túi ngoại giao, túi lãnh sự phải được soi chiếu tia X trong mọi trường hợp.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p2-17","number":17,"text":"Câu 17: Việc lục soát an ninh hàng không đối với tàu bay phải được thông báo cho cơ quan, đơn vị nào?","options":[{"letter":"A","body":"Người khai thác tàu bay.","yellow":[]},{"letter":"B","body":"Cảng vụ hàng không liên quan và Cục Hàng không Việt Nam.","yellow":[]},{"letter":"C","body":"Người khai thác tàu bay, Cảng vụ hàng không liên quan và chịu sự giám sát của Cảng vụ hàng không.","yellow":[[65,96]]},{"letter":"D","body":"Người khai thác tàu bay và Cục Hàng không Việt Nam.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-18","number":18,"text":"Câu 18: Người chỉ huy tàu bay phải được thông báo những thông tin gì của người được phép mang vũ khí, công cụ hỗ trợ trên chuyến bay?","options":[{"letter":"A","body":"Tên, chỗ ngồi người được phép mang vũ khí, công cụ hỗ trợ.","yellow":[]},{"letter":"B","body":"Loại vũ khí, công cụ hỗ trợ được phép mang trên chuyến bay.","yellow":[]},{"letter":"C","body":"Tên, chỗ ngồi, loại vũ khí, công cụ hỗ trợ được phép mang trên chuyến bay.","yellow":[[5,32]]},{"letter":"D","body":"Loại vũ khí, chỗ ngồi người được phép mang vũ khí, công cụ hỗ trợ.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-19","number":19,"text":"Câu 19: Nghị định 92/2015/NĐ-CP quy định việc lục soát an ninh hàng không đối với tàu bay như thế nào?","options":[{"letter":"A","body":"Việc lục soát an ninh hàng không đối với tàu bay phải được thông báo người khai thác tàu bay, cảng vụ hàng không kiên quan và chịu sự giám sát của Cảng vụ hàng không.","yellow":[]},{"letter":"B","body":"Lực lượng kiểm soát an ninh hàng không tại cảng hàng không, sân bay trực tiếp thực hiện lục soát an ninh hàng không. Hãng hàng không liên quan có trách nhiệm cử nhân viên thợ kỹ thuật tàu bay tham gia, tư vấn trong quá trình lục soát an ninh tàu bay.","yellow":[]},{"letter":"C","body":"Việc lục soát an ninh hàng không phải được lập biên bản lục soát.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-20","number":20,"text":"Câu 20: Khi qua điểm kiểm tra soi chiếu an ninh hàng không, hành khách phải tuân thủ những quy định nào?","options":[{"letter":"A","body":"Hành khách cởi bỏ áo khoác, mũ, giầy, dép, thắt lưng, vật dụng cá nhân và các đồ vật khác mang theo người; đặt các đồ vật, chất lỏng, thiết bị điện tử vào khay đưa qua máy soi tia X trước khi đi qua cổng từ.","yellow":[]},{"letter":"B","body":"Hành khách đi qua cổng từ hoặc thiết bị soi chiếu cơ thể (nếu có), nếu cổng từ hoặc thiết bị soi chiếu cơ thể báo động hoặc hành khách có biểu hiện nghi vấn thì nhân viên kiểm soát an ninh hàng không sử dụng kết hợp thiết bị phát hiện kim loại cầm tay và kiểm tra trực quan.","yellow":[]},{"letter":"C","body":"Hành khách đặt hành lý xách tay lên băng truyền đưa qua máy soi tia X; Khi hành lý có nghi vấn, nhân viên kiểm soát an ninh hàng không phải tiến hành kiểm tra trực quan hoặc lục soát an ninh hàng không theo qui định.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-21","number":21,"text":"Câu 21: Tối thiểu mấy năm một lần Cục Hàng không Việt Nam chủ trì phối hợp với cơ quan, đơn vị liên quan trong và ngoài ngành hàng không tổ chức diễn tập đối phó với hành vi can thiệp bất hợp pháp cấp ngành tại 01 cảng hàng không hoặc 01 cơ sở cung cấp dịch vụ không lưu?","options":[{"letter":"A","body":"01 năm một lần.","yellow":[]},{"letter":"B","body":"02 năm một lần.","yellow":[]},{"letter":"C","body":"03 năm một lần.","yellow":[[0,14]]},{"letter":"D","body":"04 năm một lần.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-22","number":22,"text":"Câu 22: Thời gian tối đa giám sát màn hình máy soi tia X và thời gian tối thiểu để quay trở lại thực hiện đối với nhân viên soi chiếu hành lý ký gửi, hàng hóa, bưu kiện là bao lâu?","options":[{"letter":"A","body":"30 phút - 20 phút.","yellow":[]},{"letter":"B","body":"30 phút - 15 phút.","yellow":[[0,17]]},{"letter":"C","body":"30 phút - 30 phút.","yellow":[]},{"letter":"D","body":"20 phút - 15 phút.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-23","number":23,"text":"Câu 23: Thời gian tối đa giám sát màn hình máy soi tia X và thời gian tối thiểu để quay trở lại thực hiện đối với nhân viên soi chiếu hành lý xách tay là bao lâu?","options":[{"letter":"A","body":"30 phút - 15 phút.","yellow":[]},{"letter":"B","body":"30 phút - 30 phút.","yellow":[[0,17]]},{"letter":"C","body":"20 phút - 20 phút.","yellow":[]},{"letter":"D","body":"20 phút - 15 phút.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-24","number":24,"text":"Câu 24: Khi phát hiện hành lý, đồ vật không xác định được chủ sở hữu hoặc người quản lý, sử dụng tại cảng hàng không, sân bay và các khu vực hạn chế khác thì lực lượng kiểm soát an ninh hàng không phải thực hiện biện pháp gì?","options":[{"letter":"A","body":"Thực hiện ngay việc lục soát an ninh hàng không đối với hành lý, đồ vật đó.","yellow":[[32,63]]},{"letter":"B","body":"Thông báo cho Hãng hàng không và lục soát hành lý, đồ vật đó.","yellow":[]},{"letter":"C","body":"Thông báo cho Cảng vụ hàng không và lục soát hành lý, đồ vật đó.","yellow":[]},{"letter":"D","body":"Thông báo cho Công an địa phương.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-25","number":25,"text":"Câu 25: Cán bộ áp giải bị can, bị cáo, phạm nhân, người bị trục xuất, dẫn độ, người bị bắt theo quyết định truy nã, người bị từ chối nhập cảnh được phép mang theo người lên tàu bay loại công cụ hỗ trợ nào?","options":[{"letter":"A","body":"Vũ khí thô sơ.","yellow":[]},{"letter":"B","body":"Công cụ hỗ trợ thích hợp.","yellow":[[0,24]]},{"letter":"C","body":"Vũ khí quân dụng.","yellow":[]},{"letter":"D","body":"Súng cầm tay hạng nhỏ.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-26","number":26,"text":"Câu 26: Người sử dụng thẻ, người sử dụng phương tiện được cấp giấy phép sẽ bị thu hồi thẻ, giấy phép trong trường hợp nào sau đây?","options":[{"letter":"A","body":"Vi phạm quy định về an ninh, an toàn hàng không; Vi phạm qui định về sử dụng thẻ, giấy phép.","yellow":[]},{"letter":"B","body":"Gây rối trật tự tại cảng hàng không, sân bay.","yellow":[]},{"letter":"C","body":"Không còn đáp ứng điều kiện cấp thẻ, giấy phép.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p2-27","number":27,"text":"Câu 27: Cơ quan nào chịu trách nhiệm kiểm tra để bảo đảm đồ vật cá nhân, hành lý xách tay của hành khách nối chuyến, quá cảnh, tạm dừng nội địa xuống khỏi tàu bay, không để lại trên tàu bay?","options":[{"letter":"A","body":"Người khai thác cảng hàng không.","yellow":[]},{"letter":"B","body":"Người khai thác tàu bay.","yellow":[[0,23]]},{"letter":"C","body":"Doanh nghiệp cung cấp dịch vụ hàng không.","yellow":[]},{"letter":"D","body":"Cảng vụ hàng không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-28","number":28,"text":"Câu 28: Giấy phép nhân viên kiểm soát an ninh hàng không sẽ bị thu hồi trong trường hợp nào sau đây?","options":[{"letter":"A","body":"Khi người được cấp giấy phép không còn đủ điều kiện để được cấp giấy phép theo quy định.","yellow":[]},{"letter":"B","body":"Có sai phạm về chuyên môn nghiệp vụ gây ra hậu quả mất an toàn, an ninh hàng không tại cảng hàng không, sân bay.","yellow":[]},{"letter":"C","body":"Có hành vi che dấu lỗi vi phạm quy định về an toàn, an ninh hàng không.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p2-29","number":29,"text":"Câu 29: Thẻ, giấy phép kiểm soát an ninh cảng hàng không, sân bay có giá trị sử dụng dài hạn có thời hạn hiệu lực tối đa là bao lâu kể từ thời điểm thẻ, giấy phép được cấp có hiệu lực?","options":[{"letter":"A","body":"Không quá 2 năm.","yellow":[[0,15]]},{"letter":"B","body":"Không quá 3 năm.","yellow":[]},{"letter":"C","body":"Không quá 4 năm.","yellow":[]},{"letter":"D","body":"Không quá 5 năm.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-30","number":30,"text":"Câu 30: Vũ khí thô sơ là gì?","options":[{"letter":"A","body":"Đạn, vỏ đạn, thuốc đạn, súng bắn đạn cao su, giáo, mác, lưỡi lê, đinh ba, đao, mã tấu.","yellow":[]},{"letter":"B","body":"Súng săn, súng trường, súng liên thanh, bom, mìn, lựu đạn, đạn, ngư lôi, thuỷ lôi và hoả cụ.","yellow":[]},{"letter":"C","body":"Vũ khí có cấu tạo, nguyên lý hoạt động đơn giản và được chế tạo, sản xuất thủ công hoặc công nghiệp, bao gồm: dao găm, kiếm, giáo, mác, thương, lưỡi lê, đao, mã tấu, côn, quả đấm, quả chùy, cung, nỏ, phi tiêu.","yellow":[[101,134]]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-31","number":31,"text":"Câu 31: Hàng hóa, bưu gửi trung chuyển được quy định như thế nào?","options":[{"letter":"A","body":"Hàng hóa, bưu gửi được vận chuyển tiếp nối trên 02 chuyến bay khác nhau trở lên hoặc bằng 02 loại hình vận chuyển khác nhau trở lên, trong đó có loại hình vận chuyển bằng đường hàng không.","yellow":[[155,187]]},{"letter":"B","body":"Hàng hóa, bưu gửi được vận chuyển tiếp nối trên 02 chuyến bay khác nhau trở lên hoặc bằng 01 loại hình vận chuyển khác nhau trở lên.","yellow":[]},{"letter":"C","body":"Hàng hóa, bưu gửi lên lại cùng một chuyến bay tại một cảng hàng không mà hàng hóa, bưu gửi đã đến trước đó.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-32","number":32,"text":"Câu 32: Việc đánh giá chất lượng nhân viên kiểm soát an ninh hàng không hàng năm dựa trên các nội dung nào sau đây?","options":[{"letter":"A","body":"Năng lực chuyên môn nghiệp vụ.","yellow":[]},{"letter":"B","body":"Chấp hành nội quy, quy định của cơ quan, đơn vị.","yellow":[]},{"letter":"C","body":"Trách nhiệm, thái độ phục vụ trong công việc.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p2-33","number":33,"text":"Câu 33: Cơ quan, đơn vị nào có thẩm quyền chấp thuận vận chuyển đối với vật phẩm nguy hiểm là hàng nguy hiểm theo đúng quy định của pháp luật về vận chuyển hàng nguy hiểm?","options":[{"letter":"A","body":"Cục Hàng không Việt Nam.","yellow":[]},{"letter":"B","body":"Cảng vụ hàng không.","yellow":[]},{"letter":"C","body":"Đại diện hãng hàng không","yellow":[[0,24]]},{"letter":"D","body":"Lực lượng kiểm soát an ninh hàng không","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-34","number":34,"text":"Câu 34: Hàng hóa, bưu gửi quá cảnh, trung chuyển không phải kiểm tra an ninh hàng không trong các trường hợp nào sau đây?","options":[{"letter":"A","body":"Hàng hóa, bưu gửi quá cảnh, trung chuyển không rời khỏi tàu bay, sân đỗ tàu bay hoặc không rời khỏi khu vực hạn chế và có sự giám sát an ninh hàng không thích hợp liên tục.","yellow":[]},{"letter":"B","body":"Hàng hóa, bưu gửi quá cảnh, trung chuyển được vận chuyển từ sân đỗ tàu bay vào khu vực lưu giữ hàng hóa qua khu vực không phải khu vực hạn chế và ngược lại được niêm phong an ninh và có biện pháp giám sát an ninh thích hợp liên tục trong quá trình vận chuyển để ngăn ngừa việc đưa trái phép vật phẩm nguy hiểm vào hàng hóa, bưu gửi.","yellow":[]},{"letter":"C","body":"Có tờ khai an ninh chứng minh việc kiểm tra an ninh hàng không đã được thực hiện 100% đối với hàng hóa, bưu gửi tại điểm xuất
