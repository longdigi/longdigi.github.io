y":"Người đứng đầu lực lượng kiểm soát an ninh hàng không.","yellow":[]},{"letter":"D","body":"Không chấp nhận vận chuyển.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-38","number":38,"text":"Câu 38: Tổ chức, cá nhân nào có trách nhiệm phối hợp với người áp giải quản lý, giám sát chặt chẽ quá trình đưa người bị áp giải lên, xuống tàu bay?","options":[{"letter":"A","body":"Nhân viên kiểm soát an ninh hàng không.","yellow":[[10,38]]},{"letter":"B","body":"Đại diện hãng hàng không.","yellow":[]},{"letter":"C","body":"Cảng vụ hàng không.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-39","number":39,"text":"Câu 39: Trường hợp nào sau đây phải tiến hành kiểm tra an ninh hàng không bằng soi chiếu tia X hoặc trực quan trước khi đưa vào khu vực hạn chế tại cảng hàng không và phải được giám sát an ninh hàng không liên tục?","options":[{"letter":"A","body":"Tủ, túi đựng suất ăn không có niêm phong an ninh.","yellow":[]},{"letter":"B","body":"Niêm phong an ninh của tủ, túi đựng suất ăn không còn nguyên vẹn.","yellow":[]},{"letter":"C","body":"Tủ, túi đựng suất ăn không còn nguyên vẹn","yellow":[]},{"letter":"D","body":"Đáp án A và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-40","number":40,"text":"Câu 40: Việc kiểm tra an ninh hàng không đối với hài cốt, tro cốt được thực hiện như thế nào?","options":[{"letter":"A","body":"Kiểm tra an ninh như đối với hàng hóa, hành lý thông thường, trừ trường hợp có đề nghị miễn soi chiếu tia X của cơ quan nhà nước có thẩm quyền, cơ quan đại diện ngoại giao của nước ngoài và phải được người đứng đầu bộ phận kiểm soát an ninh hàng không tại cảng hàng không, sân bay chấp nhận.","yellow":[[39,71]]},{"letter":"B","body":"Kiểm tra soi chiếu tia X, không kiểm tra trực quan","yellow":[]},{"letter":"C","body":"Kiểm tra trực quan kết hợp thiết bị phát hiện chất nổ","yellow":[]},{"letter":"D","body":"Kiểm tra niêm phong hòm kẽm phải được cơ quan y tế có thẩm quyền giám sát và thể hiện bằng văn bản.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-41","number":41,"text":"Câu 41: Khi kiểm tra an ninh hàng không phát hiện hàng nguy hiểm, lực lượng kiểm soát an ninh hàng không xử lý như thế nào?","options":[{"letter":"A","body":"Tiến hành kiểm tra trực quan, xác định loại hàng hóa nguy hiểm.","yellow":[]},{"letter":"B","body":"Từ chối kiểm tra an ninh vì khách hàng không khai báo.","yellow":[]},{"letter":"C","body":"Yêu cầu khách khai báo lại và giải quyết cho đi.","yellow":[]},{"letter":"D","body":"Thông báo cho hãng vận chuyển xem xét quyết định.","yellow":[[19,48]]}],"answer":3,"explanation":""},{"id":"p2-42","number":42,"text":"Câu 42: Việc bố trí người áp giải, người bị áp giải lên và rời khỏi tàu bay được quy định như thế nào?","options":[{"letter":"A","body":"Hãng hàng không phải bố trí cho người áp giải và người bị áp giải lên trước và rời khỏi tàu bay sau cùng so với các hành khách khác.","yellow":[[92,131]]},{"letter":"B","body":"Hãng hàng không phải bố trí cho người áp giải và người bị áp giải lên sau cùng và rời khỏi tàu bay trước so với các hành khách khác.","yellow":[]},{"letter":"C","body":"Hãng hàng không phải bố trí cho người áp giải và người bị áp giải lên và rời khỏi tàu bay cùng lúc với các hành khách khác.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-43","number":43,"text":"Câu 43: Tổ chức, cá nhân nào có trách nhiệm phối hợp với người áp giải đánh giá nguy cơ trong việc vận chuyển hành khách bị áp giải và quyết định các biện pháp bảo đảm an ninh, an toàn phù hợp?","options":[{"letter":"A","body":"Cục hàng không Việt Nam.","yellow":[]},{"letter":"B","body":"Đại diện hãng hàng không.","yellow":[[0,24]]},{"letter":"C","body":"Cảng vụ hàng không.","yellow":[]},{"letter":"D","body":"Lực lượng kiểm soát an ninh hàng không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-44","number":44,"text":"Câu 44: Hành lý ký gửi quá cảnh, nối chuyến, đi chuyến bay tạm dừng nội địa đã đưa xuống khỏi tàu bay, không phải kiểm tra an ninh khi đáp ứng các yêu cầu nào sau đây?","options":[{"letter":"A","body":"Hành lý không dán thẻ quá cảnh, nối chuyến, tạm dừng nội địa.","yellow":[]},{"letter":"B","body":"Hành lý không rời khỏi sân đỗ tàu bay hoặc có sự giám sát an ninh hàng không liên tục từ khi đưa xuống khỏi tàu bay cho đến khi được đưa lại lên tàu bay. Hành lý có dán thẻ quá cảnh, nối chuyến, tạm dừng nội địa.","yellow":[[154,181]]},{"letter":"C","body":"Hành lý không có sự giám sát an ninh hàng không liên tục.","yellow":[]},{"letter":"D","body":"Hành lý đã rời khỏi sân đỗ tàu bay.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-45","number":45,"text":"Câu 45: Giấy tờ tùy thân của hành khách sử dụng khi đi tàu bay phải đảm bảo những yêu cầu nào sau đây?","options":[{"letter":"A","body":"Là bản chính và còn giá trị sử dụng.","yellow":[]},{"letter":"B","body":"Đối với giấy khai sinh, giấy chứng sinh phải là bản chính hoặc bản sao có chứng thực theo quy định của pháp luật.","yellow":[]},{"letter":"C","body":"Không chấp nhận giấy tờ nếu giấy tờ không có ảnh hoặc ảnh không theo quy định của pháp luật, trừ giấy khai sinh, giấy chứng sinh, giấy tờ của cơ quan có thẩm quyền chứng minh việc áp giải.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p2-46","number":46,"text":"Câu 46: Thời gian lưu giữ sổ theo dõi và bảng kiểm tra của máy soi tia X kể từ ngày nộp lưu là bao lâu?","options":[{"letter":"A","body":"1 năm.","yellow":[]},{"letter":"B","body":"2 năm.","yellow":[[0,5]]},{"letter":"C","body":"3 năm.","yellow":[]},{"letter":"D","body":"4 năm.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-47","number":47,"text":"Câu 47: Quy trình kiểm tra người vào khu vực hạn chế mà không phải hành khách được thực hiện như thế nào?","options":[{"letter":"A","body":"Kiểm tra thẻ kiểm soát an ninh hàng không, quan sát đối chiếu thực tế.","yellow":[]},{"letter":"B","body":"Kiểm tra người bằng cổng từ, thiết bị phát hiện kim loại cầm tay. Khi cổng từ, thiết bị phát hiện kim loại cầm tay báo động thì phải tiếp tục kiểm tra trực quan. Kiểm tra trực quan ngẫu nhiên tối thiểu 5% trong trường hợp cổng từ, thiết bị phát hiện kim loại cầm tay không có báo động. Việc kiểm tra trực quan bảo đảm tỷ lệ kiểm tra được phân đều, liên tục trong thời gian hoạt động của điểm kiểm tra an ninh trong ngày","yellow":[]},{"letter":"C","body":"Kiểm tra trực quan tại những điểm không có cổng từ, thiết bị phát hiện kim loại cầm tay.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p2-48","number":48,"text":"Câu 48: Những khu vực nào sau đây là khu vực hạn chế?","options":[{"letter":"A","body":"Khu vực hành khách sau khi đã kiểm tra soi chiếu người và hành lý chờ để đi tàu bay (khu vực cách ly), khu vực từ điểm kiểm tra an ninh đối với nhân viên nội bộ trước khi vào khu vực hạn chế vào bên trong nhà ga.","yellow":[]},{"letter":"B","body":"Khu vực phục vụ hành lý ký gửi sau khi đã được kiểm tra an ninh hàng không để đưa lên tàu bay (khu vực phân loại hành lý); Khu vực phục vụ hàng hóa, bưu gửi sau khi đã kiểm tra soi chiếu để đưa lên tàu bay (khu vực phân loại, lưu giữ, chất xếp hàng hóa, bưu gửi).","yellow":[]},{"letter":"C","body":"Nhà khách phục vụ chuyến bay chuyên cơ, chuyến bay ưu tiên.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p2-49","number":49,"text":"Câu 49: Quy trình kiểm tra đồ vật mang vào khu vực hạn chế được thực hiện như thế nào?","options":[{"letter":"A","body":"Đưa đồ vật qua máy soi tia X ở những nơi có máy soi tia X.","yellow":[]},{"letter":"B","body":"Khi qua máy soi tia X có nghi ngờ thì tiếp tục tiến hành kiểm tra trực quan.","yellow":[]},{"letter":"C","body":"Kiểm tra trực quan đồ vật tại những điểm không có máy soi tia X;","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p2-50","number":50,"text":"Câu 50: Theo quy định thì mỗi ngày 01 lần và khi bị mất điện phải sử dụng bộ mẫu thử để kiểm tra tính năng nào của máy soi trước khi sử dụng?","options":[{"letter":"A","body":"Tính năng cảnh báo.","yellow":[[0,18]]},{"letter":"B","body":"Độ phân giải.","yellow":[]},{"letter":"C","body":"Độ xuyên thấu hữu ích.","yellow":[]},{"letter":"D","body":"Phân biệt chất liệu.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-51","number":51,"text":"Câu 51: Quy trình kiểm tra đối với thiết bị phát hiện kim loại cầm tay được thực hiện như thế nào?","options":[{"letter":"A","body":"Bật công tắc kiểm tra nguồn điện, đảm bảo nguồn điện của thiết bị phát hiện kim loại cầm tay đủ và ổn định.","yellow":[]},{"letter":"B","body":"Đưa thiết bị phát hiện kim loại cầm tay lên nắp hộp nhựa đựng mẫu thử: nếu máy phát tín hiệu báo động, điều chỉnh độ nhạy, tín hiệu báo động cho phù hợp và sử dụng kiểm tra hành khách; nếu máy không phát tín hiệu báo động dừng sử dụng.","yellow":[]},{"letter":"C","body":"Ghi chép kết quả vào sổ kiểm tra thiết bị phát hiện kim loại cầm tay.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p2-52","number":52,"text":"Câu 52: Khi qua điểm kiểm tra an ninh hàng không vào khu vực cách ly quốc tế, mỗi hành khách, thành viên tổ bay chỉ được phép mang tối đa bao nhiêu dung tích chất lỏng (bao gồm chất lỏng, chất đặc sánh, dung dịch xịt) theo người và hành lý xách tay?","options":[{"letter":"A","body":"Không quá 01 lít chất lỏng. Dung tích mỗi chai, lọ, bình chứa không được quá 100ml và phải được đóng kín hoàn toàn.","yellow":[[0,21],[22,27]]},{"letter":"B","body":"Không quá 300ml chất lỏng. Dung tích mỗi chai, lọ, bình chứa không được quá 100ml và phải được đóng kín hoàn toàn.","yellow":[]},{"letter":"C","body":"Không quá 400ml chất lỏng. Dung tích mỗi chai, lọ, bình chứa không được quá 100ml và phải được đóng kín hoàn toàn.","yellow":[]},{"letter":"D","body":"Không quá 500ml chất lỏng. Dung tích mỗi chai, lọ, bình chứa không được quá 100ml và phải được đóng kín hoàn toàn.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-53","number":53,"text":"Câu 53: Trường hợp nào sau đây được miễn kiểm tra soi chiếu tia X và kiểm tra trực quan?","options":[{"letter":"A","body":"Thi thể người vận chuyển bằng tàu bay được đặt trong hòm kẽm gắn kín. Quá trình đóng gói và niêm phong hòm kẽm phải được cơ quan y tế có thẩm quyền giám sát. Hòm kẽm phải còn nguyên niêm phong và có văn bản xác nhận của cơ quan y tế giám sát kèm theo giấy chứng tử.","yellow":[]},{"letter":"B","body":"Các sản phẩm làm từ máu, bộ phận nội tạng dùng cho việc cấy ghép, vắc-xin, các loại dược phẩm phải duy trì đóng gói kín. Bao bì phải có niêm phong, kèm theo văn bản xác nhận của cơ quan y tế có thẩm quyền.","yellow":[]},{"letter":"C","body":"Những hàng hóa nguy hiểm mà việc soi chiếu hoặc kiểm tra trực quan sẽ gây nguy hiểm cho tính mạng, sức khỏe của nhân viên kiểm soát an ninh hàng không như các vật liệu cho nghiên cứu hạt nhân, vật liệu phóng xạ. Bao bì phải có niêm phong, kèm theo văn bản xác nhận tình trạng đóng gói an toàn, văn bản đề nghị của cơ quan nhà nước có thẩm quyền.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-54","number":54,"text":"Câu 54: Trừ trường hợp khẩn nguy, việc kiểm tra trực quan đối với hành lý ký gửi của hành khách chỉ được thực hiện khi có sự chứng kiến của ai?","options":[{"letter":"A","body":"Chủ sở hữu hành lý đó hoặc người đại diện hợp pháp của họ hoặc đại diện hãng hàng không vận chuyển.","yellow":[[63,71],[72,98]]},{"letter":"B","body":"Đại diện Cảng vụ hàng không khu vực.","yellow":[]},{"letter":"C","body":"Nhân viên thủ tục.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-55","number":55,"text":"Câu 55: Hành khách, hành lý xách tay đã hoàn tất thủ tục kiểm tra an ninh hàng không phải được giám sát liên tục bằng biện pháp nào sau đây?","options":[{"letter":"A","body":"Sử dụng biệp pháp kiểm tra an ninh thích hợp.","yellow":[]},{"letter":"B","body":"Sử dụng ca-me-ra giám sát an ninh hoặc do nhân viên kiểm soát an ninh hàng không trực tiếp giám sát hoặc kết hợp cả hai biện pháp.","yellow":[[105,129]]},{"letter":"C","body":"Không cần giám sát vì đã được kiểm tra an ninh.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-56","number":56,"text":"Câu 56: Hành khách đi qua cổng từ hoặc thiết bị soi chiếu cơ thể, nếu cổng từ hoặc thiết bị soi chiếu cơ thể báo động hoặc hành khách có biểu hiện nghi vấn thì nhân viên kiểm soát an ninh hàng không phải thực hiện kiểm tra bằng biện pháp nào sau đây?","options":[{"letter":"A","body":"Sử dụng thiết bị phát hiện kim loại cầm tay để kiểm tra.","yellow":[]},{"letter":"B","body":"Kiểm tra trực quan hành khách.","yellow":[]},{"letter":"C","body":"Sử dụng kết hợp thiết bị phát hiện kim loại cầm tay và kiểm tra trực quan.","yellow":[[44,73]]},{"letter":"D","body":"Thực hiện ngay biện pháp lục soát an ninh hàng không.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-57","number":57,"text":"Câu 57: Quy định việc kiểm tra, giám sát an ninh hàng không khu vực cách ly phải được thực hiện như thế nào?","options":[{"letter":"A","body":"Phải được kiểm tra an ninh hàng không trước khi đưa vào khai thác hàng ngày và giám sát an ninh chặt chẽ, liên tục trong suốt thời gian khai thác.","yellow":[]},{"letter":"B","body":"Khi không hoạt động, tất cả các cửa vào, cửa ra của khu vực cách ly phải được khóa hoặc có nhân viên kiểm soát an ninh hàng không canh gác, bảo vệ.","yellow":[]},{"letter":"C","body":"Phải được kiểm tra an ninh hàng không trước khi đưa vào khai thác. Khi không hoạt động, tất cả các cửa vào, cửa ra của khu vực cách ly phải được khóa.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]}],"answer":3,"explanation":""},{"id":"p2-58","number":58,"text":"Câu 58: Giới hạn dung tích chất lỏng mua tại cửa hàng trong khu cách ly quốc tế, trên chuyến bay quốc tế với điều kiện phải đựng trong túi nhựa an ninh được dán kín quy định như thế nào?","options":[{"letter":"A","body":"Không giới hạn dung tích.","yellow":[[0,24]]},{"letter":"B","body":"Không quá 01 lít chất lỏng.","yellow":[]},{"letter":"C","body":"Không quá 03 lít chất lỏng.","yellow":[]},{"letter":"D","body":"Không quá 05 lít chất lỏng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-59","number":59,"text":"Câu 59: Cơ quan nào được phép quyết định đình chỉ chuyến bay, yêu cầu tàu bay hạ cánh trong trường hợp chuyến bay vi phạm các quy định về an ninh hàng không?","options":[{"letter":"A","body":"Cục Hàng không Việt Nam.","yellow":[]},{"letter":"B","body":"Cảng vụ hàng không.","yellow":[[0,18]]},{"letter":"C","body":"Hãng hàng không.","yellow":[]},{"letter":"D","body":"Người khai thác Cảng hàng không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-60","number":60,"text":"Câu 60: Giấy phép nhân viên kiểm soát an ninh hàng không bị Cục Hàng không Việt Nam đình chỉ hiệu lực trong thời gian tối đa 06 tháng đối với trường hợp nào sau đây?","options":[{"letter":"A","body":"Bị kỷ luật khiển trách; có sai phạm về chuyên môn nghiệp vụ nhưng chưa gây ra hậu quả mất an ninh, an toàn;","yellow":[]},{"letter":"B","body":"Thực hiện nhiệm vụ không đúng với nghiệp vụ chuyên môn được cấp phép, năng định.","yellow":[[34,68]]},{"letter":"C","body":"Bị kỷ luật khiển trách lần thứ 02 hoặc cảnh cáo.","yellow":[]},{"letter":"D","body":"Sai phạm về chuyên môn nghiệp vụ gây ra hậu quả mất an toàn, an ninh hàng không tại cảng hàng không, sân bay.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-61","number":61,"text":"Câu 61: Những đối tượng nào dưới đây được trang bị, sử dụng vũ khí quân dụng khi làm nhiệm vụ?","options":[{"letter":"A","body":"Nhân viên kiểm soát an ninh hàng không khi đối phó với hành vi can thiệp bất hợp pháp xảy ra tại cảng hàng không, sân bay, trên tàu bay.","yellow":[]},{"letter":"B","body":"Cán bộ cấp tổ, đội của lực lượng kiểm soát an ninh hàng không.","yellow":[]},{"letter":"C","body":"Nhân viên an ninh cơ động, nhân viên kiểm soát an ninh làm nhiệm vụ tuần tra, canh gác ban đêm.","yellow":[]},{"letter":"D","body":"Nhân viên kiểm soát an ninh hàng không khi làm nhiệm vụ trong thời gian thực hiện các biện pháp bảo đảm an ninh hàng không tăng cường cấp độ 1, cấp độ 2 và cấp độ 3.","yellow":[]},{"letter":"E","body":"Đáp án A, B, C và D đúng.","yellow":[]},{"letter":"F","body":"Đáp án A, C và D đúng","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-62","number":62,"text":"Câu 62: Cơ quan, đơn vị nào có thẩm quyền xử phạt hành vi vi phạm hành chính trong lĩnh vực an ninh hàng không xảy ra tại cảng hàng không, sân bay?","options":[{"letter":"A","body":"Cảng vụ hàng không.","yellow":[[0,18]]},{"letter":"B","body":"Cục Hàng không Việt Nam.","yellow":[]},{"letter":"C","body":"Công an cửa khẩu.","yellow":[]},{"letter":"D","body":"Công an địa phương.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-63","number":63,"text":"Câu 63: Tài liệu nào dưới đây thuộc danh mục tài liệu hạn chế trong lĩnh vực An ninh hàng không?","options":[{"letter":"A","body":"Các chương trình an ninh, quy chế an ninh hàng không được Cục Hàng không Việt Nam phê duyệt, chấp thuận. Khuyến cáo, thông báo, kiểm tra, thử nghiệm, điều tra, khảo sát, các đánh giá nguy cơ về an ninh hàng không và hồ sơ các vụ việc vi phạm về an ninh hàng không chưa được công bố công khai.","yellow":[]},{"letter":"B","body":"Các quy chế phối hợp, văn bản hiệp đồng về an ninh hàng không giữa các cơ quan, đơn vị ngành hàng không với các cơ quan đơn vị liên quan; Tài liệu về an ninh hàng không của ICAO hoặc do nước ngoài cung cấp được ICAO và phía nước ngoài xác định là tài liệu hạn chế.","yellow":[]},{"letter":"C","body":"Các văn bản, tài liệu về an ninh hàng không khác mà Cục trưởng Cục Hàng không Việt Nam xác định là tài liệu hạn chế.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p2-64","number":64,"text":"Câu 64: Việc tái kiểm tra an ninh hàng không đối với hành khách, hành lý xách tay đã kiểm tra an ninh hàng không nhưng ra khỏi khu vực hạn chế khi trở lại được thực hiện như thế nào?","options":[{"letter":"A","body":"Tất cả hành khách, hành lý xách tay phải được chuyển sang một khu vực khác, kiểm tra lại toàn bộ khu vực hạn chế liên quan.","yellow":[]},{"letter":"B","body":"Tái kiểm tra an ninh hàng không toàn bộ hành khách, hành lý xách tay trước khi cho lên tàu bay.","yellow":[]},{"letter":"C","body":"Trường hợp hành khách đã lên tàu bay, toàn bộ hành khách, hành lý xách tay và khoang hành khách của tàu bay phải được tái kiểm tra an ninh hàng không.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-65","number":65,"text":"Câu 65: Khi hành khách lên tàu bay, cơ quan, đơn vị nào chịu trách nhiệm tổ chức kiểm tra, đối chiếu giấy tờ về nhân thân, thẻ lên tàu bay của hành khách để đảm bảo đúng người, đúng chuyến bay?","options":[{"letter":"A","body":"Lực lượng kiểm soát an ninh hàng không tại cảng hàng không.","yellow":[]},{"letter":"B","body":"Hãng hàng không.","yellow":[[0,15]]},{"letter":"C","body":"Lực lượng kiểm soát an ninh hàng không của doanh nghiệp cung cấp dịch vụ không lưu.","yellow":[]},{"letter":"D","body":"Cảng vụ hàng không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-66","number":66,"text":"Câu 66: Trước khi cho tàu bay khởi hành, việc tổ chức đối chiếu tổng số hành khách đã được cấp thẻ lên tàu bay với tổng số hành khách thực có trên tàu bay là trách nhiệm của tổ chức, cá nhân nào?","options":[{"letter":"A","body":"Lực lượng kiểm soát an ninh hàng không tại cảng hàng không.","yellow":[]},{"letter":"B","body":"Lực lượng kiểm soát an ninh hàng không của doanh nghiệp cung cấp dịch vụ không lưu.","yellow":[]},{"letter":"C","body":"Người chỉ huy tàu bay.","yellow":[[0,21]]},{"letter":"D","body":"Cảng vụ hàng không.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-67","number":67,"text":"Câu 67: Khi phát hiện vũ khí, vật liệu nổ trong người hành khách, lực lượng kiểm soát an ninh hàng không phải xử lý như thế nào?","options":[{"letter":"A","body":"Nhanh chóng bằng biện pháp thích hợp khống chế, ngăn chặn để xử lý.","yellow":[[17,46]]},{"letter":"B","body":"Yêu cầu hành khách tự giao nộp vũ khí, vật liệu nổ.","yellow":[]},{"letter":"C","body":"Yêu cầu hành khách mang vũ khí, vật liệu nổ ra khỏi khu vực hạn chế của cảng hàng không.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-68","number":68,"text":"Câu 68: Phải tái kiểm tra an ninh hàng không khu vực hạn chế, người, phương tiện, đồ vật trong các trường hợp nào sau đây?","options":[{"letter":"A","body":"Hành khách, hành lý xách tay đã kiểm tra an ninh hàng không nhưng ra khỏi khu vực hạn chế khi trở lại phải tái kiểm tra an ninh hàng không.","yellow":[]},{"letter":"B","body":"Khu vực, người, phương tiện, đồ vật trong khu vực hạn chế có sự tiếp xúc, trộn lẫn với người, đồ vật chưa qua kiểm tra an ninh hàng không.","yellow":[]},{"letter":"C","body":"Khu vực, người, phương tiện, đồ vật trong khu vực hạn chế có sự tiếp xúc, trộn lẫn với người nghi ngờ mang theo vật phẩm nguy hiểm hoặc phương tiện, đồ vật nghi ngờ chứa vật phẩm nguy hiểm.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p2-69","number":69,"text":"Câu 69: Người bị áp giải và hành lý, vật dụng của họ phải được kiểm tra an ninh hàng không bằng biện pháp nào?","options":[{"letter":"A","body":"Miễn kiểm tra.","yellow":[]},{"letter":"B","body":"Kiểm tra trực quan.","yellow":[[0,18]]},{"letter":"C","body":"Kiểm tra như khách bình thường.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-70","number":70,"text":"Câu 70: Trách nhiệm thông báo cho người chỉ huy tàu bay vị trí ngồi của hành khách là bị can, phạm nhân, người bị trục xuất, dẫn độ thuộc về tổ chức, cá nhân nào?","options":[{"letter":"A","body":"An ninh hàng không.","yellow":[]},{"letter":"B","body":"Công an cửa khẩu.","yellow":[]},{"letter":"C","body":"Cảng vụ hàng không.","yellow":[]},{"letter":"D","body":"Đại diện hãng hàng không.","yellow":[[0,24]]}],"answer":3,"explanation":""},{"id":"p2-71","number":71,"text":"Câu 71: Điểm kiểm tra an ninh hàng không là gì?","options":[{"letter":"A","body":"Điểm kiểm tra an ninh hàng không là vị trí làm việc của nhân viên kiểm soát an ninh hàng không được thiết lập tại các cổng, cửa, lối đi giữa các khu vực hạn chế hoặc giữa khu vực hạn chế với khu vực khác nhằm kiểm tra an ninh hàng không người, phương tiện, đồ vật, duy trì an ninh trật tự khu vực điểm kiểm tra an ninh hàng không.","yellow":[[244,268],[269,280]]},{"letter":"B","body":"Điểm kiểm tra an ninh hàng không là vị trí làm việc của nhân viên kiểm soát an ninh hàng không được thiết lập tại các khu vực công cộng nhằm kiểm tra an ninh hàng không người, phương tiện, đồ vật khu vực điểm kiểm tra an ninh hàng không.","yellow":[]},{"letter":"C","body":"Điểm kiểm tra an ninh hàng không là vị trí làm việc của nhân viên kiểm soát an ninh hàng không được thiết lập tại các khu vực hạn chế nhằm duy trì an ninh trật tự khu vực điểm kiểm tra an ninh hàng không.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-72","number":72,"text":"Câu 72: Khu vực cách ly được quy định như thế nào?","options":[{"letter":"A","body":"Một phần của khu vực hạn chế, được xác định từ sau điểm kiểm tra an ninh hàng không đối với hành khách, hành lý xách tay của nhà ga đến cửa khởi hành.","yellow":[[104,131]]},{"letter":"B","body":"Khu vực được xác định từ điểm kiểm tra an ninh hàng không đối với hành khách đến cửa tàu bay.","yellow":[]},{"letter":"C","body":"Các khu vực hạn chế của cảng hàng không, sân bay.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-73","number":73,"text":"Câu 73: Tỷ lệ kiểm tra bổ sung ngẫu nhiên tối thiểu sau kiểm tra an ninh lần đầu đối với hành khách, hành lý xách tay là bao nhêu?","options":[{"letter":"A","body":"5%.","yellow":[]},{"letter":"B","body":"10%.","yellow":[]},{"letter":"C","body":"15%.","yellow":[]},{"letter":"D","body":"20%.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-74","number":74,"text":"Câu 74: Các trường hợp nào sau đây phải được niêm phong an ninh hàng không sau khi kiểm tra?","options":[{"letter":"A","body":"Thùng đựng hàng hóa, bưu gửi, thùng hoặc mâm đựng hàng hóa rời, hành lý thất lạc, hành lý không có người nhận, tủ, túi đựng suất ăn.","yellow":[]},{"letter":"B","body":"Thùng, túi đựng đồ vật phục vụ trên tàu bay, trừ đồ vật phục vụ cho việc bảo dưỡng, sửa chữa tàu bay.","yellow":[]},{"letter":"C","body":"Phương tiện tra nạp nhiên liệu cho tàu bay sau khi tiếp nhận nhiên liệu để nạp cho tàu bay phải niêm phong an ninh các cửa nạp, cửa xả; tàu bay không khai thác phải niêm phong an ninh các cửa của tàu bay.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p2-75","number":75,"text":"Câu 75: Việc mang theo trang thiết bị y tế là vật phẩm nguy hiểm theo người lên tàu bay để chăm sóc bệnh nhân và đối tượng cảnh vệ được quy định như thế nào?","options":[{"letter":"A","body":"Có đề nghị bằng văn bản, được sự đồng ý của đại diện hãng hàng không và người đứng đầu bộ phận kiểm soát ANHK Cảng hàng không, sân bay.","yellow":[[72,125]]},{"letter":"B","body":"Có đề nghị bằng văn bản, được sự đồng ý của đại diện hãng hàng không và Bộ tư lệnh cảnh vệ.","yellow":[]},{"letter":"C","body":"Có đề nghị bằng văn bản, được sự đồng ý của đại diện hãng hàng không và bộ phận y tế tại Cảng hàng không, sân bay.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-76","number":76,"text":"Câu 76: Cơ quan nào chịu trách nhiệm tổ chức giám sát trực tiếp việc thực hiện nhiệm vụ chuyên cơ, việc tuân thủ các tiêu chuẩn kỹ thuật, bảo đảm an ninh an toàn đối với chuyến bay chuyên cơ của các tổ chức, cá nhân tại cảng hàng không thuộc trách nhiệm quản lý?","options":[{"letter":"A","body":"Cảng vụ hàng không khu vực.","yellow":[[0,26]]},{"letter":"B","body":"Hãng hàng không.","yellow":[]},{"letter":"C","body":"Người khai thác cảng hàng không, sân bay.","yellow":[]},{"letter":"D","body":"Cục hàng không Việt Nam.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-77","number":77,"text":"Câu 77: Việc kiểm tra an ninh hàng không đối với hành khách tàn tật, thương binh, bệnh nhân sử dụng xe đẩy, cáng cứu thương, có gắn các thiết bị phụ trợ y tế trên người được thực hiện bằng các biện pháp nào?","options":[{"letter":"A","body":"Bằng trực quan hoặc các biện pháp thích hợp khác tại nơi phù hợp.","yellow":[[20,39],[40,64]]},{"letter":"B","body":"Chỉ được kiểm tra bằng trực quan","yellow":[]},{"letter":"C","body":"Bằng các biện pháp thích hợp tại nơi phù hợp","yellow":[]},{"letter":"D","body":"Cần kiểm tra như đối với hành khách thông thường khác","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-78","number":78,"text":"Câu 78: Trách nhiệm, quy trình xử lý đối với vụ việc vi phạm an ninh hàng không của lực lượng kiểm soát an ninh hàng không được quy định như thế nào?","options":[{"letter":"A","body":"Ngăn chặn hành vi vi phạm; tạm giữ đối tượng vi phạm; kiểm tra, lục soát, thu giữ tang vật, chứng cứ; đưa người, tang vật vi phạm về nơi quy định để giải quyết, xử lý vi phạm.","yellow":[]},{"letter":"B","body":"Thông báo ngay vụ việc cho Cảng vụ hàng không, cơ quan công an (nếu vụ việc có dấu hiệu hình sự) và các cơ quan, đơn vị liên quan tại cảng hàng không, sân bay; bảo vệ hiện trường nếu xét thấy cần thiết.","yellow":[]},{"letter":"C","body":"Lập hồ sơ ban đầu và bàn giao hồ sơ, bằng chứng, tang vật, người vi phạm cho cơ quan nhà nước có thẩm quyền theo yêu cầu của Cảng vụ hàng không.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p2-79","number":79,"text":"Câu 79: Khi thực hiện nhiệm vụ, trong phạm vi thẩm quyền cho phép, lực lượng kiểm soát an ninh hàng không có quyền hạn gì?","options":[{"letter":"A","body":"Tạm giữ người, kiểm tra, tạm giữ giấy tờ tùy thân đối với người có hành vi uy hiếp an ninh, an toàn hàng không.","yellow":[]},{"letter":"B","body":"Thu giữ vũ khí, chất nổ, chất cháy và những vật phẩm nguy hiểm khác đưa trái phép vào khu vực hạn chế.","yellow":[]},{"letter":"C","body":"Cưỡng chế đối với người cản trở hoặc cố tình chống đối.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-80","number":80,"text":"Câu 80: Hành lý ký gửi của hành khách xuất phát, nối chuyến phải được kiểm tra an ninh hàng không bằng máy soi tia X, nếu có nghi vấn phải được tiếp tục kiểm tra bằng biện pháp nào?","options":[{"letter":"A","body":"Kiểm tra bằng thiết bị phát hiện kim loại cầm tay.","yellow":[]},{"letter":"B","body":"Kiểm tra trực quan bằng tay.","yellow":[]},{"letter":"C","body":"Kiểm tra trực quan hoặc kiểm tra bằng dụng cụ, thiết bị phát hiện chất nổ hoặc các biện pháp thích hợp khác.","yellow":[[14,45]]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-81","number":81,"text":"Câu 81: Trường hợp hành khách đã được cấp thẻ lên tàu bay nhưng không có mặt để thực hiện chuyến bay, đơn vị nào có trách nhiệm đảm bảo tất cả hành lý của hành khách đó phải được đưa xuống tàu bay trước khi cho tàu bay khởi hành?","options":[{"letter":"A","body":"Hãng hàng không.","yellow":[[0,15]]},{"letter":"B","body":"An ninh hàng không.","yellow":[]},{"letter":"C","body":"Cảng vụ hàng không.","yellow":[]},{"letter":"D","body":"Trung tâm Khai thác ga.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-82","number":82,"text":"Câu 82: Suất ăn, đồ vật dự phòng, đồ vật phục vụ trên chuyến bay, nhiên liệu cho tàu bay và các đồ vật khác khi vào khu vực hạn chế, đưa lên tàu bay phải chịu sự kiểm tra, giám sát an ninh hàng không như thế nào?","options":[{"letter":"A","body":"Chịu sự kiểm tra an ninh hàng không thích hợp khi vào khu vực hạn chế, đưa lên tàu bay; chịu sự giám sát an ninh hàng không liên tục của lực lượng kiểm soát an ninh hàng không tại cảng hàng không, sân bay.","yellow":[[46,132]]},{"letter":"B","body":"Chịu sự kiểm tra an ninh hàng không thích hợp khi vào khu vực hạn chế, đưa lên tàu bay","yellow":[]},{"letter":"C","body":"Chịu sự giám sát an ninh hàng không liên tục của lực lượng kiểm soát an ninh hàng không tại cảng hàng không, sân bay","yellow":[]},{"letter":"D","body":"Chịu sự kiểm tra an ninh hàng không thích hợp khi vào khu vực hạn chế, đưa lên tàu bay; chịu sự giám sát an ninh hàng không liên tục của người khai thác tàu bay.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-83","number":83,"text":"Câu 83: Dữ liệu hình ảnh từ máy soi tia X, camera giám sát an ninh phải được lưu giữ tối thiểu bao nhiêu ngày?","options":[{"letter":"A","body":"15 ngày.","yellow":[]},{"letter":"B","body":"30 ngày.","yellow":[]},{"letter":"C","body":"45 ngày.","yellow":[[0,7]]},{"letter":"D","body":"90 ngày.","yellow":[]}],"answer":2,"explanation":""},{"id":"p2-84","number":84,"text":"Câu 84: Lực lượng kiểm soát an ninh hàng không do cơ quan nào chỉ đạo tổ chức?","options":[{"letter":"A","body":"Thủ tướng Chính phủ.","yellow":[]},{"letter":"B","body":"Bộ Giao thông vận tải.","yellow":[[0,21]]},{"letter":"C","body":"Cục hàng không Việt Nam.","yellow":[]},{"letter":"D","body":"Tổng công ty Cảng hàng không Việt Nam.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-85","number":85,"text":"Câu 85: Lực lượng nào có trách nhiệm phối hợp với các đơn vị thuộc Bộ tư lệnh cảnh vệ - Bộ Công an trong việc kiểm tra, giám sát an ninh hàng không đối với chuyến bay chuyên cơ theo quy định về bảo đảm chuyến bay chuyên cơ?","options":[{"letter":"A","body":"Lực lượng công an địa phương.","yellow":[]},{"letter":"B","body":"Lực lượng kiểm soát an ninh hàng không của người khai thác cảng hàng không, sân bay.","yellow":[[43,74]]},{"letter":"C","body":"Lực lượng giám sát của Cảng vụ hàng không khu vực.","yellow":[]},{"letter":"D","body":"Lực lượng an ninh hàng không của hãng hàng không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-86","number":86,"text":"Câu 86: Theo Nghị định số 92/2015/NĐ-CP, nhân viên kiểm soát an ninh hàng không khi thi hành nhiệm vụ, nếu bị thương, hy sinh được hưởng chế độ nào sau đây?","options":[{"letter":"A","body":"Được xem xét hỗ trợ tiền điều trị theo quy định của pháp luật.","yellow":[]},{"letter":"B","body":"Được xem xét công nhận hưởng chế độ như thương binh, liệt sĩ và các hình thức khen thưởng khác theo quy định của pháp luật.","yellow":[[23,51]]},{"letter":"C","body":"Được xem xét hỗ trợ tiền theo số năm đã công tác.","yellow":[]},{"letter":"D","body":"Không được hưởng chế độ.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-87","number":87,"text":"Câu 87: Việc miễn soi chiếu tia X và kiểm tra trực quan đối với thi thể người vận chuyển bằng tàu bay cần phải đáp ứng những điều kiện nào dưới đây?","options":[{"letter":"A","body":"Phải được đặt trong hòm kẽm gắn kín.","yellow":[]},{"letter":"B","body":"Quá trình đóng gói và niêm phong hòm kẽm phải được cơ quan y tế có thẩm quyền giám sát.","yellow":[]},{"letter":"C","body":"Hòm kẽm phải còn nguyên niêm phong và có văn bản xác nhận của cơ quan y tế giám sát kèm theo giấy chứng tử.","yellow":[]},{"letter":"D","body":"Đáp án A và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-88","number":88,"text":"Câu 88: Việc tiếp nhận, vận chuyển vũ khí, công cụ hỗ trợ được quy định như thế nào?","options":[{"letter":"A","body":"Người có súng phải tháo rời hộp tiếp đạn khỏi súng; tháo rời hoặc ngắt nguồn điện của công cụ hỗ trợ; bảo đảm chắc chắn vũ khí, công cụ hỗ trợ trong trạng thái an toàn.","yellow":[]},{"letter":"B","body":"Đạn phải được đóng gói và chất xếp theo đúng quy định về vận chuyển hàng nguy hiểm. Đại diện hãng hàng không ký xác nhận vào tờ khai theo mẫu quy định.","yellow":[]},{"letter":"C","body":"Nhân viên phục vụ mặt đất vận chuyển súng, đạn từ điểm làm thủ tục lên tàu bay phải có nhân viên an ninh hàng không giám sát, hộ tống.","yellow":[]},{"letter":"D","body":"Vũ khí, công cụ hỗ trợ phải để ở nơi hành khách không thể tiếp cận được trong suốt chuyến bay.","yellow":[]},{"letter":"E","body":"Đáp án A, B, C và D đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-89","number":89,"text":"Câu 89: Thế nào là hành khách không làm chủ được hành vi?","options":[{"letter":"A","body":"Hành khách không làm chủ được hành vi là hành khách trong tình trạng mất khả năng nhận thức hoặc mất khả năng điều khiển hành vi của mình do bị bệnh tâm thần hoặc do sử dụng rượu bia hoặc chất kích thích.","yellow":[[169,203]]},{"letter":"B","body":"Là hành khách mất khả năng làm chủ hành vi do bị bệnh tâm thần; hành khách sử dụng rượu bia hoặc các chất kích thích khác.","yellow":[]},{"letter":"C","body":"Hành khách là bị can, bị cáo.","yellow":[]},{"letter":"D","body":"Đáp án B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-90","number":90,"text":"Câu 90: Theo quy định về kiểm tra, giám sát an ninh hàng không đối với hành khách bị bệnh tâm thần, nguyên tắc nào dưới dây cần phải được tuân thủ?","options":[{"letter":"A","body":"Hành khách bị bệnh tâm thần phải có bác sĩ hoặc thân nhân đi kèm có khả năng kiềm chế được hành vi bất thường của hành khách. Trong trường hợp cần thiết, hành khách bị bệnh tâm thần cần phải được gây mê trước khi lên tàu bay, thời gian tác dụng của thuốc phải lâu hơn thời gian bay.","yellow":[]},{"letter":"B","body":"Hành khách bị bệnh tâm thần và hành lý, vật dụng của họ phải được kiểm tra trực quan; việc kiểm tra có thể được bố trí tại khu vực riêng.","yellow":[]},{"letter":"C","body":"Hành khách bị bệnh tâm thần không cần có thân nhân đi kèm, không cần kiểm tra trực quan.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]}],"answer":3,"explanation":""},{"id":"p2-91","number":91,"text":"Câu 91: Thẩm quyền xem xét quyết định áp dụng các biện pháp kiểm tra trực quan bắt buộc đối với người có hành vi vi phạm về an ninh, trật tự, kỷ luật trên tàu bay tại các cảng hàng không, sân bay?","options":[{"letter":"A","body":"Lực lượng an ninh hàng không.","yellow":[]},{"letter":"B","body":"Cục Hàng không Việt Nam.","yellow":[[0,23]]},{"letter":"C","body":"Cảng vụ hàng không khu vực.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-92","number":92,"text":"Câu 92: Theo quy định giấy tờ nhân thân của hành khách đi tàu bay, cơ quan, đơn vị nào sau đây có thẩm quyền xác nhận về nhân thân của hành khách?","options":[{"letter":"A","body":"Uỷ ban nhân dân phường, xã.","yellow":[]},{"letter":"B","body":"Công an phường, xã nơi thường trú hoặc tạm trú.","yellow":[[0,29],[30,46]]},{"letter":"C","body":"An ninh hàng không.","yellow":[]},{"letter":"D","body":"Cảng vụ hàng không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-93","number":93,"text":"Câu 93: Giấy xác nhận nhân thân do công an phường, xã nơi thường trú hoặc tạm trú xác nhận có các thông tin nào sau đây?","options":[{"letter":"A","body":"Cơ quan xác nhận, người xác nhận; ngày, tháng, năm xác nhận.","yellow":[]},{"letter":"B","body":"Họ và tên, ngày tháng năm sinh, giới tính, quê quán, nơi thường trú của người được xác nhận; Lý do xác nhận.","yellow":[]},{"letter":"C","body":"Có dán ảnh, đóng dấu giáp lai.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p2-94","number":94,"text":"Câu 94: Khi phát hiện vật phẩm nguy hiểm không có giấy phép theo quy định của pháp luật, lực lượng kiểm soát an ninh hàng không tại cảng hàng không, sân bay phải xử lý như thế nào?","options":[{"letter":"A","body":"Lập biên bản theo mẫu quy định.","yellow":[]},{"letter":"B","body":"Chuyển giao người, hồ sơ, vật phẩm nguy hiểm cho cơ quan chức năng có thẩm quyền.","yellow":[]},{"letter":"C","body":"Thông báo cho hãng hàng không để có biện pháp giải quyết thích hợp","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":4,"explanation":""},{"id":"p2-95","number":95,"text":"Câu 95: Kiểm tra trực quan là gì?","options":[{"letter":"A","body":"Là việc sử dụng các trang bị, thiết bị hỗ trợ để kiểm tra người, phương tiện, đồ vật khi đi qua điểm kiểm tra an ninh.","yellow":[]},{"letter":"B","body":"Là việc nhân viên kiểm soát an ninh hàng không trực tiếp sử máy soi tia X để kiểm đồ vật nhằm nhận biết và phát hiện vật phẩm nguy hiểm.","yellow":[]},{"letter":"C","body":"Là việc nhân viên kiểm soát an ninh sử dụng gương soi gầm khi kiểm tra các phương tiện ra, vào khu vực hạn chế.","yellow":[]},{"letter":"D","body":"Là việc nhân viên kiểm soát an ninh hàng không trực tiếp sử dụng tay, mắt và các giác quan khác để kiểm tra người, phương tiện, đồ vật nhằm nhận biết và phát hiện vật đáng ngờ, vật phẩm nguy hiểm.","yellow":[[115,144]]}],"answer":3,"explanation":""},{"id":"p2-96","number":96,"text":"Câu 96: Mục tiêu của chương trình đào tạo nghiệp vụ an ninh soi chiếu là gì?","options":[{"letter":"A","body":"Trang bị cho học viên kiến thức nghiệp vụ, kỹ năng và thái độ ứng xử trong kiểm tra, giám sát an ninh tại nhà ga, khu vực công cộng, sân bay, canh gác tại các khu vực hạn chế.","yellow":[]},{"letter":"B","body":"Trang bị cho học viên kiến thức nghiệp vụ, kỹ năng và thái độ ứng xử trong kiểm tra, soi chiếu an ninh, kiểm tra trực quan đối với hành khách, hành lý, hàng hóa, bưu gửi và các đồ vật đưa lên tàu bay.","yellow":[[104,141]]},{"letter":"C","body":"Trang bị cho học viên kiến thức nghiệp vụ, kỹ năng và thái độ ứng xử trong tuần tra, canh gác, hộ tống, kiểm soát đám đông, kiểm tra, lục soát tàu bay, phương tiện.","yellow":[]},{"letter":"D","body":"Trang bị cho học viên kiến thức nghiệp vụ, kỹ năng và thái độ ứng xử trong tuần tra, canh gác.","yellow":[]}],"answer":1,"explanation":""},{"id":"p2-97","number":97,"text":"Câu 97: Theo quy định, tại mỗi điểm kiểm tra an ninh hàng không phải được trang bị những loại thiết bị nào?","options":[{"letter":"A","body":"Máy soi tia X, cổng từ, thiết bị phát hiện kim loại cầm tay.","yellow":[]},{"letter":"B","body":"Buồng để tiến hành lục soát an ninh hàng không, các thiết bị, dụng cụ cần thiết khác.","yellow":[]},{"letter":"C","body":"Thiết bị phát hiện kim loại cầm tay, dụng cụ, thiết bị phát hiện chất nổ, thiết bị thông tin liên lạc.","yellow":[]},{"letter":"D","body":"Thiết bị soi chiếu cơ thể, buồng để tiến hành lục soát an ninh hàng không; có máy soi tia X, cổng từ, thiết bị phát hiện kim loại cầm tay, dụng cụ, thiết bị phát hiện chất nổ, thiết bị thông tin liên lạc, các thiết bị, dụng cụ cần thiết khác.","yellow":[[55,62],[63,91]]}],"answer":3,"explanation":""},{"id":"p2-98","number":98,"text":"Câu 98: Tỷ lệ kiểm tra trực quan ngẫu nhiên đối với hành khách, hành lý xách tay phải đáp ứng yêu cầu gì?","options":[{"letter":"A","body":"Phải được phân đều, liên tục trong thời gian hoạt động của điểm kiểm tra an ninh trong ngày.","yellow":[[20,54]]},{"letter":"B","body":"Chỉ cần kiểm tra đủ số lượng quy định.","yellow":[]},{"letter":"C","body":"Chỉ kiểm tra trong thời gian thấp điểm.","yellow":[]},{"letter":"D","body":"Đáp án A và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-99","number":99,"text":"Câu 99: Trường hợp bị kỷ luật khiển trách, có sai phạm về chuyên môn nghiệp vụ nhưng chưa gây ra hậu quả mất an ninh, an toàn sẽ bị đình chỉ hiệu lực giấy phép trong thời gian tối đa là bao lâu?","options":[{"letter":"A","body":"01 tháng.","yellow":[[0,8]]},{"letter":"B","body":"03 tháng.","yellow":[]},{"letter":"C","body":"06 tháng.","yellow":[]},{"letter":"D","body":"09 tháng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-100","number":100,"text":"Câu 100: Người bị thu hồi giấy phép nhân viên kiểm soát an ninh hàng không, khi trở lại làm việc phải đáp ứng yêu cầu nào?","options":[{"letter":"A","body":"Phải qua sát hạch cấp lại giấy phép, năng định nhân viên hàng không.","yellow":[[18,41],[42,67]]},{"letter":"B","body":"Phải đề nghị cấp lại giấy phép nhân viên kiểm soát an ninh hàng không.","yellow":[]},{"letter":"C","body":"Không được trở lại làm việc.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p2-101","number":101,"text":"Câu 101: Việc khai thác, quản lý, bảo trì thiết bị, phương tiện bảo đảm an ninh hàng không phải tuân thủ theo quy định nào sau đây?","options":[{"letter":"A","body":"Tuân thủ theo quy định của nhà sản xuất và đơn vị khai thác, sử dụng thiết bị, phương tiện.","yellow":[]},{"letter":"B","body":"Phải có sổ sách theo dõi các hỏng hóc của trì thiết bị, phương tiện.","yellow":[]},{"letter":"C","body":"Phải có sổ sách theo dõi việc sửa chữa, bảo trì thiết bị, phương tiện.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p2-102","number":102,"text":"Câu 102: Người, phương tiện, đồ vật đưa ra ngoài khu vực hạn chế phải được lực lượng kiểm soát an ninh hàng không kiểm tra khi có biểu hiện nghi ngờ hoặc ó thẩm quyền giám sát, kèm theo giấy chứng tử.","yellow":[[171,209]]},{"letter":"C","body":"Hòm kẽm được gắn kín, phải còn nguyên niêm phong và có văn bản xác nhận của cơ quan y tế giám sát. Quá trình đóng gói và niêm phong hòm kẽm phải được cơ quan y tế có thẩm quyền giám sát.","yellow":[]},{"letter":"D","body":"Quá trình đóng gói và niêm phong hòm kẽm phải được cơ quan y tế có thẩm quyền giám sát, kèm theo giấy chứng tử.","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-2","number":2,"text":"Câu 2: Cơ quan, đơn vị nào chịu trách nhiệm kiểm tra, xác định sự tuân thủ các quy định về vận chuyển hàng nguy hiểm bằng đường hàng không trước khi chấp nhận vận chuyển hàng nguy hiểm?","options":[{"letter":"A","body":"Lực lượng kiểm soát an ninh hàng không","yellow":[]},{"letter":"B","body":"Hãng hàng không","yellow":[[0,15]]},{"letter":"C","body":"Công ty dịch vụ hàng hóa","yellow":[]},{"letter":"D","body":"Cảng vụ hàng không","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-3","number":3,"text":"Câu 3: Quy trình đầy đủ khi kiểm tra trực quan đối với hàng hóa, bưu gửi?","options":[{"letter":"A","body":"Tiếp nhận thông tin hàng hóa, bưu gửi cần kiểm tra, quan sát, tiến hành kiểm tra.","yellow":[]},{"letter":"B","body":"Tiếp nhận thông tin hàng hóa, bưu gửi cần kiểm tra, quan sát, tiến hành kiểm tra, thông báo kết quả kiểm tra và biện pháp xử lý, báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội các tình huống phát sinh.","yellow":[[47,81],[82,87]]},{"letter":"C","body":"Thông báo kết quả kiểm tra và biện pháp xử lý. Báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội các tình huống phát sinh.","yellow":[]},{"letter":"D","body":"Quan sát, tiến hành kiểm tra, thông báo kết quả kiểm tra và biện pháp xử lý, báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội các tình huống phát sinh.","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-4","number":4,"text":"Câu 4: Hành khách sẽ bị từ chối vận chuyển khi nào?","options":[{"letter":"A","body":"Hành khách yêu cầu được kiểm tra riêng trong phòng kiểm
