<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#385752">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title data-id="th-modified">Ôn thi năng định ANSC</title>
<style>
:root{
  --pine:#385752;--pine-deep:#26403b;--sage:#a1b4a5;--mist:#dbd3d1;--blush:#f5b8b6;--rose:#a56266;
  --ink:#1f322e;--muted:#5f716b;--paper:#f7f3f1;--card:#fffdfc;--line:#e6dedc;
  --sage-soft:#e8eee9;--blush-soft:#fdf0ef;--rose-soft:#f6e6e6;--wine:#3d2022;
  --sans:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
::selection{background:var(--blush);color:var(--wine)}
body{margin:0;color:var(--ink);font:17px/1.55 var(--sans);background:linear-gradient(180deg,#eee7e5 0,var(--paper) 380px) var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.topbar button:focus-visible,.question-nav button:focus-visible{outline-color:var(--blush)}
#app{min-height:100vh}

/* Buttons */
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:600;transition:background .15s,color .15s;white-space:nowrap}
.btn-primary{background:var(--pine);color:#fff}.btn-primary:hover{background:var(--pine-deep)}
.btn-gold{background:var(--blush);color:var(--wine)}.btn-gold:hover{background:#f0a4a1}
.btn-quiet{background:transparent;color:var(--pine);box-shadow:inset 0 0 0 1.5px var(--sage)}.btn-quiet:hover{background:var(--sage-soft)}
.btn-danger{background:var(--rose);color:#fff}.btn-danger:hover{background:#8e4e52}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Home */
.home-wrap{max-width:1160px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 26px 64px}
.home-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:4px 0 22px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{width:54px;height:54px;border-radius:50% 50% 50% 14px;background:var(--pine);color:var(--blush);display:grid;place-items:center;flex:0 0 auto}
.brand-mark svg{width:28px;height:28px}
.brand-kicker{margin:0 0 2px;color:var(--rose);font-weight:600;font-size:14px}
.home-title{font:800 clamp(21px,2.7vw,28px)/1.2 var(--sans);letter-spacing:.015em;text-transform:uppercase;margin:0;color:var(--pine)}
.resume-card{margin:0 0 18px;padding:16px 22px;border-radius:18px;background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px}
.resume-card strong{display:block;font-weight:600}
.resume-card p{margin:2px 0 0;font-size:14px;color:#d3dfd9}
.hero{position:relative;overflow:hidden;border-radius:34px 34px 34px 10px;padding:40px min(38%,430px) 32px 42px;background:var(--pine);color:#fff;display:grid;gap:30px}
.hero>*{position:relative;z-index:1}
.hero-label{display:inline-flex;justify-self:start;padding:4px 14px;border-radius:99px;background:var(--blush);color:var(--wine);font-size:14px;font-weight:400}
.hero h2{font:700 clamp(26px,3.6vw,40px)/1.18 var(--sans);letter-spacing:-.01em;margin:16px 0 10px}
.hero p{margin:0;color:#dbe5e0;max-width:470px}
.hero-stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:start}
.stat-box{padding:0 26px;border-left:1px solid rgba(219,211,209,.32)}
.stat-box:first-child{padding-left:0;border-left:0}
.stat-number{display:block;font:700 clamp(27px,3vw,37px)/1.05 var(--sans);color:var(--blush)}
.stat-label{font-size:13px;color:#cfdad4}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0 38px}
.mode-card{border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:176px;background:var(--sage);color:var(--ink)}
.mode-card.exam{background:var(--rose);color:#fff}
.mode-left{display:flex;gap:16px;align-items:flex-start}
.mode-icon{width:48px;height:48px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);color:var(--pine-deep)}
.mode-card.exam .mode-icon{background:rgba(245,184,182,.3);color:var(--blush)}
.mode-icon svg{width:24px;height:24px}
.mode-card h3{margin:0 0 4px;font:700 25px/1.15 var(--sans)}
.mode-card p{margin:0;font-size:15px}
.mode-card>.btn{align-self:flex-start}
.section-heading{margin:6px 2px 16px}
.section-heading h2{margin:0;font:700 29px/1.15 var(--sans);color:var(--pine)}
.section-heading p{margin:3px 0 0;color:var(--muted);font-size:15px}
.section-list{display:grid;gap:14px}
.section-card{--tone:var(--sage);--tone-soft:var(--sage-soft);--on:var(--ink);display:grid;grid-template-columns:minmax(230px,300px) 1fr;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.section-card.gold{--tone:var(--blush);--tone-soft:var(--blush-soft);--on:var(--wine)}
.section-card.red{--tone:var(--rose);--tone-soft:var(--rose-soft);--on:#fff}
.section-top{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:20px;padding:22px;background:var(--tone);color:var(--on)}
.section-title-wrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-number{font:700 46px/1 var(--sans);opacity:.85}
.section-title{margin:0;font:700 19px/1.28 var(--sans)}
.section-total{font-size:14px;font-weight:600;white-space:nowrap}
.packages{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;padding:20px;align-content:start}
.package{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 10px 9px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;color:var(--ink);min-width:0;transition:background .15s,border-color .15s}
.package:hover{border-color:var(--tone);background:var(--tone-soft)}
.package strong{display:block;font-size:16px;font-weight:600}
.package small{display:block;color:var(--muted);font-size:13px}
.package-arrow{width:32px;height:32px;border-radius:50%;background:var(--tone);color:var(--on);display:grid;place-items:center;font-size:21px;line-height:1;flex:0 0 auto}

/* Session */
.session-page{min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:var(--pine);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 0;box-shadow:0 6px 20px rgba(38,64,59,.18)}
.topbar-main{display:flex;align-items:center;gap:16px;min-height:56px}
.topbar-title{min-width:190px;flex:1}
.topbar-title .eyebrow{margin:0 0 1px;font-size:13px;font-weight:600;color:var(--blush)}
.topbar-title h1{margin:0;font:700 20px/1.2 var(--sans)}
.topbar-progress{min-width:115px;text-align:center;font-size:14px;color:#d6e0da}
.topbar-progress strong{font-size:19px;color:#fff}
.timer{padding:7px 14px;border-radius:999px;background:var(--blush);color:var(--wine);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.timer.urgent{background:var(--rose);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.topbar-actions{display:flex;align-items:center;gap:8px}
.topbar-actions .btn{padding:8px 16px;font-size:15px}
.topbar .btn-quiet{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}.topbar .btn-quiet:hover{background:rgba(255,255,255,.12)}
.topbar .btn-danger{background:var(--blush);color:var(--wine)}.topbar .btn-danger:hover{background:#f0a4a1}
.progress-track{height:5px;background:rgba(255,255,255,.16);margin:9px -20px 0;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--blush);transition:width .2s}
.question-nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 24px));display:flex;flex-direction:row;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(56,87,82,.97);box-shadow:0 10px 30px rgba(38,64,59,.32);overflow-x:auto;scrollbar-width:none}
.question-nav::-webkit-scrollbar{display:none}
.nav-label{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--sage);padding:0 8px 0 6px;white-space:nowrap}
.nav-number{flex:0 0 auto;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#e7eee9;font-size:13px;font-weight:600;line-height:1}
.nav-number.answered{background:var(--sage);color:var(--ink)}
.nav-number.correct{background:var(--sage);color:var(--pine-deep)}
.nav-number.wrong{background:var(--rose);color:#fff}
.nav-number.current{background:var(--blush);color:var(--wine);box-shadow:0 0 0 2px var(--pine),0 0 0 4px var(--blush)}
.nav-number.correct.current{background:var(--sage);color:var(--pine-deep)}
.nav-number.wrong.current{background:var(--rose);color:#fff}
.question-main{max-width:860px;margin:0 auto;padding:24px 18px 120px}
.question-card{position:relative;overflow:hidden;scroll-margin-top:100px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px 22px 30px;margin:0 0 16px}
.question-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--mist)}
.question-card[data-state=picked]:before{background:var(--blush)}
.question-card[data-state=right]:before{background:var(--sage)}
.question-card[data-state=wrong]:before{background:var(--rose)}
.question-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.question-head .question-head{margin:0}
.question-num{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
.question-num .num-pill{min-width:36px;height:36px;padding:0 11px;border-radius:999px;background:var(--pine);color:#fff;display:grid;place-items:center;font:700 16px var(--sans)}
.question-meta{font-size:13px;color:var(--muted);text-align:right}
.question-text{font:600 18.5px/1.55 var(--sans);color:var(--ink);white-space:pre-line;margin:0 0 16px}
.options{display:grid;gap:9px}
.answer-option{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);line-height:1.45;font-size:16.5px;transition:border-color .15s,background .15s;white-space:pre-line}
.answer-option:hover:not(:disabled){border-color:var(--sage);background:var(--sage-soft)}
.answer-option .letter,.review-option .letter{width:30px;height:30px;flex:0 0 auto;border-radius:50%;background:var(--paper);color:var(--pine);display:grid;place-items:center;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--mist)}
.answer-option .option-copy{flex:1;min-width:0}
.answer-option.selected{border-color:var(--blush);background:var(--blush-soft)}
.answer-option.selected .letter{background:var(--blush);color:var(--wine);box-shadow:none}
.answer-option.correct,.review-option.correct{border-color:var(--pine);background:var(--sage-soft);color:var(--pine-deep)}
.answer-option.correct .letter,.review-option.correct .letter{background:var(--pine);color:#fff;box-shadow:none}
.answer-option.wrong,.review-option.wrong{border-color:var(--rose);background:var(--rose-soft);color:#7a3c40}
.answer-option.wrong .letter,.review-option.wrong .letter{background:var(--rose);color:#fff;box-shadow:none}
.answer-option:disabled{cursor:default}
.instant-feedback{margin-top:14px}
.feedback-banner{border-radius:14px;padding:10px 16px;font:700 20px var(--sans);margin:10px 0 8px;animation:popIn .22s ease-out}
.feedback-banner:before{content:"✓";margin-right:10px}
.feedback-banner.bad:before{content:"✕"}
.feedback-banner.good{background:var(--sage);color:var(--ink)}
.feedback-banner.bad{background:var(--rose);color:#fff}
@keyframes popIn{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
.correct-line{font-size:16.5px;padding:4px 2px 0;color:var(--pine-deep)}
.correct-line strong{color:var(--pine)}
.question-status{font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--paper);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.question-status.done{background:var(--sage);color:var(--ink);box-shadow:none}
.question-status.bad{background:var(--rose);color:#fff;box-shadow:none}
.session-end{margin:26px 0 0;padding:30px 24px;border-radius:26px 26px 26px 8px;background:var(--pine);color:#fff;text-align:center}
.session-end h2{font:700 28px/1.15 var(--sans);margin:0 0 6px}
.session-end p{margin:3px 0 16px;color:#d6e0da}
.session-end .btn{background:var(--blush);color:var(--wine)}

/* Results & review */
.result-wrap{max-width:900px;margin:0 auto;padding:34px 18px 60px}
.result-hero{padding:34px 28px;border-radius:32px 32px 32px 8px;color:#fff;text-align:center;background:var(--pine)}
.result-hero .small-cap{font-size:14px;font-weight:600;color:var(--blush)}
.score-ring{--p:0;position:relative;width:200px;height:200px;margin:16px auto 14px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blush) calc(var(--p)*1%),rgba(255,255,255,.14) 0)}
.score-ring:before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--pine)}
.score{position:relative;font:700 40px/1 var(--sans)}
.score-label{font-size:18px;color:#e3ebe7}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.result-stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.result-stat strong{display:block;font:700 30px/1.1 var(--sans);color:var(--pine)}
.result-stat span{font-size:14px;color:var(--muted)}
.result-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.result-message{text-align:center;color:var(--muted);margin:8px 0 0}
.review-option{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;white-space:pre-line}
.mark{background:rgba(245,184,182,.8);color:inherit;padding:0 2px;border-radius:3px}
.review-note{margin:12px 0 2px;padding:12px 14px;background:var(--paper);border-left:4px solid var(--blush);border-radius:4px 12px 12px 4px;font-size:15.5px}
.review-key{font-size:16px;margin-top:12px;color:var(--pine-deep)}
.review-key strong{color:var(--pine)}

<script id="bank-data" type="application/json">[{"id":"p1","title":"I. PHẦN 1: Lý thuyết ngành hàng không","questions":[{"id":"p1-1","number":1,"text":"Câu 1: Luật Hàng không dân dụng Việt Nam áp dụng đối với các đối tượng nào?","options":[{"letter":"A","body":"Tổ chức, cá nhân Việt Nam và tổ chức, cá nhân nước ngoài hoạt động hàng không dân dụng tại Việt Nam.","yellow":[]},{"letter":"B","body":"Tổ chức, cá nhân Việt Nam hoạt động hàng không dân dụng ở nước ngoài, nếu pháp luật nước ngoài không có quy định khác.","yellow":[]},{"letter":"C","body":"Tổ chức, cá nhân Việt Nam và tổ chức, cá nhân nước ngoài hoạt động hàng không dân dụng ở vùng thông báo bay do Việt Nam quản lý.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-2","number":2,"text":"Câu 2: Theo Luật Hàng không dân dụng Việt Nam thành phần tổ bay bao gồm những đối tượng nào?","options":[{"letter":"A","body":"Tổ lái và tiếp viên hàng không","yellow":[]},{"letter":"B","body":"Tổ lái và các nhân viên hàng không khác theo yêu cầu thực hiện chuyến bay","yellow":[]},{"letter":"C","body":"Tổ lái, tiếp viên hàng không và các nhân viên hàng không khác theo yêu cầu thực hiện chuyến bay","yellow":[[0,61]]},{"letter":"D","body":"Tiếp viên hàng không và các nhân viên hàng không khác theo yêu cầu thực hiện chuyến bay","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-3","number":3,"text":"Câu 3: Thẩm quyền quyết định tạm thời đóng Cảng hàng không, sân bay không quá hai mươi bốn giờ vì sự cố đột xuất, để bảo đảm an toàn hàng không, an ninh hàng không thuộc về cá nhân nào?","options":[{"letter":"A","body":"Bộ trưởng Bộ Công an.","yellow":[]},{"letter":"B","body":"Bộ trưởng Bộ Giao thông vận tải","yellow":[]},{"letter":"C","body":"Giám đốc Cảng vụ hàng không","yellow":[[0,27]]},{"letter":"D","body":"Giám đốc Cảng hàng không, sân bay","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-4","number":4,"text":"Câu 4: Theo quy định tại Luật Hàng không dân dụng Việt Nam, cơ quan nào là cơ quan thực hiện nhiệm vụ quản lý nhà nước về hàng không dân dụng tại cảng hàng không, sân bay?","options":[{"letter":"A","body":"Bộ Giao thông vận tải","yellow":[]},{"letter":"B","body":"Cục Hàng không Việt Nam","yellow":[]},{"letter":"C","body":"Cảng vụ hàng không","yellow":[[0,18]]},{"letter":"D","body":"Người khai thác cảng hàng không, sân bay","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-5","number":5,"text":"Câu 5: Ai có thẩm quyền ra quyết định tạm giữ tàu bay khi phát hiện tàu bay có hành vi vi phạm chủ quyền và an ninh quốc gia của Việt Nam?","options":[{"letter":"A","body":"Giám đốc Cảng vụ hàng không","yellow":[]},{"letter":"B","body":"Thanh tra hàng không","yellow":[]},{"letter":"C","body":"Lực lượng kiểm soát an ninh hàng không","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]}],"answer":3,"explanation":""},{"id":"p1-6","number":6,"text":"Câu 6: Nhóm nhân viên hàng không bao gồm những đối tượng nào?","options":[{"letter":"A","body":"Những người hoạt động liên quan trực tiếp đến khai thác tàu bay, có giấy phép, chứng chỉ chuyên môn phù hợp do Bộ Giao thông vận tải cấp hoặc công nhận","yellow":[]},{"letter":"B","body":"Những người hoạt động liên quan trực tiếp đến bảo đảm an toàn hàng không, an ninh hàng không, hoạt động bay.","yellow":[]},{"letter":"C","body":"Những người hoạt động liên quan đến bảo đảm an toàn hàng không, an ninh hàng không, vận chuyển hàng không, có giấy phép, chứng chỉ chuyên môn phù hợp.","yellow":[]},{"letter":"D","body":"Những người hoạt động liên quan trực tiếp đến bảo đảm an toàn hàng không, an ninh hàng không, khai thác tàu bay, vận chuyển hàng không, hoạt động bay, có giấy phép, chứng chỉ chuyên môn phù hợp do Bộ Giao thông vận tải cấp hoặc công nhận","yellow":[[113,149]]}],"answer":3,"explanation":""},{"id":"p1-7","number":7,"text":"Câu 7: Theo Luật Hàng không dân dụng Việt Nam, nhân viên hàng không khi thực hiện nhiệm vụ phải mang theo những gì?","options":[{"letter":"A","body":"Giấy phép, chứng chỉ chuyên môn phù hợp do Học viện Hàng không Việt Nam cấp hoặc công nhận.","yellow":[]},{"letter":"B","body":"Giấy phép, chứng chỉ chuyên môn phù hợp do Bộ Giao thông vận tải cấp hoặc công nhận.","yellow":[[43,60],[61,83]]},{"letter":"C","body":"Giấy phép, chứng chỉ chuyên môn phù hợp do các cơ sở đào tạo được Cục Hàng không Việt Nam phê duyệt, cấp hoặc công nhận.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-8","number":8,"text":"Câu 8: Trong thời gian tàu bay đang bay, ai là người có quyền cao nhất trong tàu bay, chịu trách nhiệm bảo đảm an toàn hàng không, an ninh hàng không cho tàu bay, người và tài sản trong tàu bay?","options":[{"letter":"A","body":"Giám đốc Cảng hàng không, sân bay","yellow":[]},{"letter":"B","body":"Người chỉ huy tàu bay","yellow":[[0,21]]},{"letter":"C","body":"Kiểm soát viên không lưu","yellow":[]},{"letter":"D","body":"Nhân viên an ninh trên không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-9","number":9,"text":"Câu 9: Theo Luật Hàng không dân dụng Việt Nam, khái niệm tàu bay được coi là đang bay được định nghĩa như thế nào?","options":[{"letter":"A","body":"Kể từ thời điểm mà cánh cửa ngoài đầu tiên được đóng lại, trong trường hợp hạ cánh bắt buộc, tàu bay được coi là đang bay cho đến khi cơ quan nhà nước có thẩm quyền đảm nhận trách nhiệm đối với tàu bay, người và tài sản trong tàu bay.","yellow":[]},{"letter":"B","body":"Kể từ thời điểm mà tất cả các cánh cửa ngoài được đóng lại sau khi hoàn thành xếp tải đến thời điểm mà bất kỳ cửa ngoài nào được mở ra để dỡ tải; trong trường hợp hạ cánh bắt buộc, tàu bay được coi là đang bay cho đến khi cơ quan nhà nước có thẩm quyền đảm nhận trách nhiệm đối với tàu bay, người và tài sản trong tàu bay.","yellow":[[129,179]]},{"letter":"C","body":"Kể từ thời điểm mà tất cả các cánh cửa ngoài được đóng lại sau khi hoàn thành xếp tải đến thời điểm mà cửa ngoài đầu tiên được mở ra để dỡ tải.","yellow":[]},{"letter":"D","body":"Kể từ thời điểm mà tàu bay rời khỏi mặt đất đến thời điểm mà bất kỳ cửa ngoài nào được mở ra để dỡ tải","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-10","number":10,"text":"Câu 10: Vận chuyển hàng không là gì?","options":[{"letter":"A","body":"Việc vận chuyển hành khách, hành lý bằng đường hàng không.","yellow":[]},{"letter":"B","body":"Việc vận chuyển hành khách, hành lý, hàng hóa, bưu gửi bằng đường hàng không.","yellow":[[28,54]]},{"letter":"C","body":"Việc vận chuyển hàng hóa, bưu gửi bằng đường hàng không.","yellow":[]},{"letter":"D","body":"Việc vận chuyển hành khách bằng đường hàng không.","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-11","number":11,"text":"Câu 11: Hãng hàng không Việt Nam, hãng hàng không nước ngoài hoạt động tại Việt Nam phải chịu sự kiểm tra, thanh tra của Cơ quan nào về việc thực hiện quy định về khai thác vận chuyển hàng không, bảo đảm an toàn hàng không, an ninh hàng không?","options":[{"letter":"A","body":"Bộ Công an","yellow":[]},{"letter":"B","body":"Bộ Giao thông vận tải","yellow":[[0,21]]},{"letter":"C","body":"Bộ Quốc phòng","yellow":[]},{"letter":"D","body":"Bộ Nội vụ","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-12","number":12,"text":"Câu 12: Trường hợp hàng hóa nào sau đây bị từ chối vận chuyển?","options":[{"letter":"A","body":"Hàng hóa được vận chuyển không đúng với loại hàng hóa đã thỏa thuận.","yellow":[]},{"letter":"B","body":"Người gửi hàng không tuân thủ điều kiện và hướng dẫn của người vận chuyển về bao bì, đóng gói, ký hiệu, mã hiệu hàng hóa.","yellow":[]},{"letter":"C","body":"Hàng hóa là động vật có trong danh mục Sách Đỏ Việt Nam","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]}],"answer":3,"explanation":""},{"id":"p1-13","number":13,"text":"Câu 13: Vé hành khách là gì?","options":[{"letter":"A","body":"Là chứng từ vận chuyển hành khách bằng đường hàng không.","yellow":[]},{"letter":"B","body":"Là bằng chứng của việc giao kết hợp đồng.","yellow":[]},{"letter":"C","body":"Đáp án A và B đúng.","yellow":[[0,18]]},{"letter":"D","body":"Là việc hãng hàng không xác nhận đã thực hiện việc vận chuyển đối với hành khách","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-14","number":14,"text":"Câu 14: Sự cố tàu bay là gì?","options":[{"letter":"A","body":"Là vụ việc liên quan đến khai thác tàu bay có khả năng làm ảnh hưởng đến an toàn bay và được coi là tai nạn tàu bay.","yellow":[]},{"letter":"B","body":"Là vụ viêc ảnh hưởng đến an toàn khai thác tàu bay và được coi là tai nạn tàu bay.","yellow":[]},{"letter":"C","body":"Là vụ việc liên quan đến việc khai thác tàu bay làm ảnh hưởng hoặc có khả năng làm ảnh hưởng đến an toàn khai thác bay nhưng chưa phải là tai nạn tàu bay.","yellow":[[125,153]]}],"answer":2,"explanation":""},{"id":"p1-15","number":15,"text":"Câu 15: Hoạt động hàng không chung phải đáp ứng các điều kiện nào sau đây?","options":[{"letter":"A","body":"Tàu bay, tổ bay phải đươc cấp giấy phép, chứng chỉ cần thiết theo quy định của Luật hàng không dân dụng Viêt Nam và phù hợp với loại hình hoạt động khai thác được thực hiện.","yellow":[]},{"letter":"B","body":"Bảo đảm các điều kiện về an toàn hàng không, an ninh hàng không, bảo vệ môi trường và các quy định khác của pháp luật có liên quan.","yellow":[]},{"letter":"C","body":"Tuân thủ các quy định của pháp luật.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]},{"letter":"E","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-16","number":16,"text":"Câu 16: Địa bàn hoạt động của lực lượng kiểm soát an ninh hàng không bao gồm các khu vực nào?","options":[{"letter":"A","body":"Cảng hàng không, sân bay, trên tàu bay.","yellow":[]},{"letter":"B","body":"Cơ sở cung cấp dịch vụ không lưu, cơ sở sản xuất, bảo dưỡng, sữa chữa tàu bay, thiết bị tàu bay.","yellow":[]},{"letter":"C","body":"Cơ sở cung cấp dịch vụ hàng không tại cảng hàng không, sân bay; cơ sở xử lý hàng hóa, bưu gửi để đưa lên tàu bay.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-17","number":17,"text":"Câu 17: Tàu bay chưa khởi hành bị đình chỉ thực hiện chuyến bay khi xảy ra trường hợp nào sau đây?","options":[{"letter":"A","body":"Xuất hiện tình huống cấp thiết phục vụ nhiệm vụ bảo vệ chủ quyền, an ninh quốc gia hoặc phát hiện tàu bay có dấu hiệu vi phạm các quy định về bảo đảm quốc phòng, an ninh.","yellow":[]},{"letter":"B","body":"Vi phạm các quy định về tiêu chuẩn đủ điều kiện bay, khai thác tàu bay, an toàn hàng không, an ninh hàng không, thủ tục chuyến bay, lập và thực hiện kế hoạch bay, thực hiện phép bay.","yellow":[]},{"letter":"C","body":"Phát hiện chuyến bay có dấu hiệu uy hiếp an toàn hàng không, an ninh hàng không.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-18","number":18,"text":"Câu 18: Luật phòng chống khủng bố số 28/2013/QH13 ngày 12/06/2013 có hiệu lực thi hành từ ngày, tháng, năm nào?","options":[{"letter":"A","body":"Ngày 10/01/2013","yellow":[]},{"letter":"B","body":"Ngày 01/10/2013","yellow":[[0,15]]},{"letter":"C","body":"Ngày 06/12/2013","yellow":[]},{"letter":"D","body":"Ngày 01/01/2014","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-19","number":19,"text":"Câu 19: Theo Luật phòng chống khủng bố, lực lượng nào sau đây được giao thực hiện nhiệm vụ chống khủng bố?","options":[{"letter":"A","body":"Lực lượng Hải quan","yellow":[]},{"letter":"B","body":"Lực lượng kiểm soát an ninh hàng không.","yellow":[]},{"letter":"C","body":"Lực lượng Công an nhân dân.","yellow":[[0,26]]},{"letter":"D","body":"Lực lượng Y tế","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-20","number":20,"text":"Câu 20: Theo Luật phòng chống khủng bố, nguyên tắc phòng, chống khủng bố là?","options":[{"letter":"A","body":"Hiệp đồng chặt chẽ với các nước.","yellow":[]},{"letter":"B","body":"Phòng ngừa là chính.","yellow":[[0,19]]},{"letter":"C","body":"Chủ động tấn công khủng bố.","yellow":[]},{"letter":"D","body":"Xây dựng kế hoạch cụ thể để chống khủng bố.","yellow":[]}],"answer":1,"explanation":""},{"id":"p1-21","number":21,"text":"Câu 21: Theo Luật phòng chống khủng bố, trách nhiệm phòng, chống khủng bố là của tổ chức, cá nhân nào?","options":[{"letter":"A","body":"Phòng, chống khủng bố là trách nhiệm của cơ quan, tổ chức và công dân.","yellow":[]},{"letter":"B","body":"Người đứng đầu cơ quan, tổ chức chịu trách nhiệm tổ chức thực hiện quy định của pháp luật về phòng, chống khủng bố trong phạm vi trách nhiệm, quyền hạn của mình.","yellow":[]},{"letter":"C","body":"Tổ chức quốc tế, tổ chức nước ngoài, người nước ngoài cư trú, hoạt động trên lãnh thổ Việt Nam có trách nhiệm tham gia phòng, chống khủng bố theo quy định của Luật này và các quy định khác của pháp luật có liên quan.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-22","number":22,"text":"Câu 22: Theo Luật phòng chống khủng bố, cơ quan nào là cơ quan thường trực của Ban chỉ đạo phòng, chống khủng bố quốc gia?","options":[{"letter":"A","body":"Bộ Ngoại giao.","yellow":[]},{"letter":"B","body":"Bộ Quốc phòng.","yellow":[]},{"letter":"C","body":"Bộ Công an.","yellow":[[0,10]]},{"letter":"D","body":"Bộ Giao thông vận tải.","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-23","number":23,"text":"Câu 23: Theo Luật phòng chống khủng bố, cơ quan nào là cơ quan thường trực của Ban chỉ đạo phòng, chống khủng bố cấp tỉnh?","options":[{"letter":"A","body":"Công an cấp tỉnh","yellow":[[0,16]]},{"letter":"B","body":"Bộ chỉ huy quân sự tỉnh, thành phố trực thuộc trung ương.","yellow":[]},{"letter":"C","body":"Lực lượng liên ngành.","yellow":[]},{"letter":"D","body":"Sở giao thông vận tải.","yellow":[]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-24","number":24,"text":"Câu 24: Nghị định số 92/2015/NĐ-CP của Thủ tướng Chính phủ quy định về vấn đề gì?","options":[{"letter":"A","body":"Quy định về đào tạo, bồi dưỡng nghiệp vụ, huấn luyện an ninh hàng không.","yellow":[]},{"letter":"B","body":"Quy định chi tiết Chương trình an ninh hàng không và kiểm soát chất lượng an ninh hàng không Việt Nam.","yellow":[]},{"letter":"C","body":"Quy định về an ninh hàng không.","yellow":[[0,30]]},{"letter":"D","body":"Quy định về xử phạt hành chính trong lĩnh vực hàng không dân dụng.","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-25","number":25,"text":"Câu 25: Nghị định số 92/2015/NĐ-CP do cơ quan, tổ chức nào ban hành?","options":[{"letter":"A","body":"Tổng công ty Cảng hàng không Việt Nam.","yellow":[]},{"letter":"B","body":"Cục Hàng không dân dụng Việt Nam.","yellow":[]},{"letter":"C","body":"Bộ Giao thông vận tải.","yellow":[]},{"letter":"D","body":"Chính phủ.","yellow":[[0,9]]}],"answer":3,"explanation":""},{"id":"p1-26","number":26,"text":"Câu 26: Phạm vi điều chỉnh của Nghị định 92/NĐ-CP ngày 13/10/2015 là gì?","options":[{"letter":"A","body":"Quy định chi tiết về quản lý, khai thác cảng hàng không, sân bay.","yellow":[]},{"letter":"B","body":"Quy định về hoạt động hàng không dân dụng, bao gồm các quy định về tàu bay, cảng hàng không, sân bay, nhân viên hàng không, hoạt động bay, vận chuyển hàng không, an ninh hàng không, trách nhiệm dân sự, hoạt động hàng không chung.","yellow":[]},{"letter":"C","body":"Quy định về các biện pháp kiểm soát an ninh hàng không; đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng; lực lượng kiểm soát an ninh hàng không; kết cấu hạ tầng, trang bị, thiết bị và phương tiện bảo đảm an ninh hàng không; kinh phí bảo đảm an ninh hàng không; trách nhiệm của tổ chức, cá nhân liên quan trong công tác bảo đảm an ninh hàng k }],"answer":4,"explanation":""},{"id":"p1-43","number":43,"text":"Câu 43: Một trong số các trách nhiệm của Bộ Quốc phòng liên quan đến hoạt động hàng không dân dụng là gì?","options":[{"letter":"A","body":"Xây dựng lực lượng an ninh trên không.","yellow":[]},{"letter":"B","body":"Tổ chức, vận hành hệ thống giám sát, quản lý, kiểm soát chất lượng an ninh hàng không","yellow":[]},{"letter":"C","body":"Chủ trì quản lý, bảo vệ vùng trời quốc gia; phòng, chống hành vi sử dụng tên lửa vác vai nhằm vào tàu bay dân dụng.","yellow":[[17,42]]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-44","number":44,"text":"Câu 44: Trách nhiệm của Ủy ban nhân dân các cấp nơi có cảng hàng không, sân bay, công trình, trang bị, thiết bị phục vụ hoạt động hàng không dân dụng là gì?","options":[{"letter":"A","body":"Phòng, chống tội phạm, giữ gìn trật tự công cộng và an toàn xã hội tại địa bàn; tiếp nhận, xử lý tội phạm và các vụ việc vi phạm về an ninh, trật tự, an toàn giao thông theo quy định pháp luật.","yellow":[]},{"letter":"B","body":"Phối hợp với cơ quan, đơn vị liên quan trong việc chống hành vi sử dụng tên lửa vác vai tấn công tàu bay dân dụng. Triển khai thực hiện Phương án khẩn nguy đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng trong phạm vi trách nhiệm.","yellow":[]},{"letter":"C","body":"Tuyên truyền, vận động nhân dân tuân thủ các quy định về bảo đảm an ninh, an toàn hàng không.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-45","number":45,"text":"Câu 45: Mục đích của việc đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng là gì?","options":[{"letter":"A","body":"Chủ động ngăn chặn và đối phó hiệu quả, hạn chế tới mức thấp nhất hậu quả, tác hại khi xảy ra hành vi can thiệp bất hợp pháp.","yellow":[]},{"letter":"B","body":"Ưu tiên đảm bảo an toàn cho tính mạng con người.","yellow":[]},{"letter":"C","body":"Ưu tiên đảm bảo an toàn cho tính mạng con tin và chỉ sử dụng biện pháp vũ trang cần thiết khi không còn giải pháp nào khác.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-46","number":46,"text":"Câu 46: Phương châm chỉ đạo, đối phó với hành vi can thiệp bất hợp pháp thực hiện theo nguyên tắc nào?","options":[{"letter":"A","body":"Phương án đối phó tại chỗ.","yellow":[]},{"letter":"B","body":"Lực lượng tại chỗ.","yellow":[]},{"letter":"C","body":"Trang thiết bị tại chỗ, hậu cần tại chỗ.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-47","number":47,"text":"Câu 47: Lực lượng kiểm soát ANHK do Bộ Giao thông vận tải chỉ đạo tổ chức để cung cấp dịch vụ bảo đảm ANHK tại đâu?","options":[{"letter":"A","body":"Tại Cảng hàng không, sân bay.","yellow":[]},{"letter":"B","body":"Tại cơ sở xử lý hàng hóa, bưu gửi.","yellow":[]},{"letter":"C","body":"Trên tàu bay thương mại.","yellow":[]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[[0,18]]}],"answer":3,"explanation":""},{"id":"p1-48","number":48,"text":"Câu 48: Cơ quan đơn vị nào có trách nhiệm chủ trì thực hiện các biện pháp bảo vệ an ninh quốc gia, phòng, chống khủng bố liên quan đến hoạt động hàng không dân dụng. Định kỳ và đột xuất trao đổi, cung cấp, đánh giá thông tin về tình hình an ninh chính trị, trật tự an toàn xã hội; âm mưu, phương thức, thủ đoạn hoạt động của bọn khủng bố, các tổ chức phản động và các loại tội phạm, âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng?","options":[{"letter":"A","body":"Bộ Quốc phòng.","yellow":[]},{"letter":"B","body":"Bộ Giao thông vận tải.","yellow":[]},{"letter":"C","body":"Bộ Công an.","yellow":[[0,10]]},{"letter":"D","body":"Bộ Ngoại giao.","yellow":[]}],"answer":2,"explanation":""},{"id":"p1-49","number":49,"text":"Câu 49: Bộ công an chỉ đạo các cơ quan, đơn vị công an liên quan phối hợp với Cục Hàng không Việt Nam, lực lượng kiểm soát An ninh hàng không trong các nội dung nào sau đây?","options":[{"letter":"A","body":"Việc thực hiện các biện pháp bảo đảm an ninh hàng không","yellow":[]},{"letter":"B","body":"Đánh giá rủi ro và mức độ nguy cơ uy hiếp an ninh hàng không, quản lý, giám sát hành khách bị từ chối nhập cảnh.","yellow":[]},{"letter":"C","body":"Bảo vệ an ninh nội bộ, hệ thống thông tin chuyên ngành hàng không.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]},{"letter":"E","body":"Đáp án B và C đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-50","number":50,"text":"Câu 50: Theo quy định tại Nghị định số 92/2015/NĐ-CP, việc sử dụng riêng lẻ hoặc kết hợp biện pháp soi chiếu, kiểm tra trực quan và các biện pháp khác để nhận biết, phát hiện, ngăn chặn các hành vi vi phạm hoặc có dấu hiệu vi phạm về an ninh hàng không được gọi là gì?","options":[{"letter":"A","body":"Kiểm tra an ninh hàng không","yellow":[[0,27]]},{"letter":"B","body":"Soi chiếu an ninh hàng không","yellow":[]},{"letter":"C","body":"Giám sát an ninh hàng không","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p1-51","number":51,"text":"Câu 51: Theo quy định tại Nghị định số 92/2015/NĐ-CP, người, phương tiện ra vào và hoạt động tại khu vực hạn chế phải thực hiện các biện pháp nào sau đây?","options":[{"letter":"A","body":"Kiểm tra an ninh hàng không","yellow":[]},{"letter":"B","body":"Soi chiếu an ninh hàng không","yellow":[]},{"letter":"C","body":"Giám sát an ninh hàng không liên tục","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]},{"letter":"E","body":"Đáp án A và B đúng.","yellow":[]}],"answer":3,"explanation":""},{"id":"p1-52","number":52,"text":"Câu 52: Theo quy định tại Nghị định số 92/2015/NĐ-CP, kiểm so
