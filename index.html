1]]},{"letter":"D","body":"Đáp án A và B đúng.","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-8","number":8,"text":"Câu 8: Việc kiểm tra an ninh đối với tổ bay và hành lý xách tay được thực hiện như thế nào?","options":[{"letter":"A","body":"Miễn kiểm tra an ninh","yellow":[]},{"letter":"B","body":"Theo quy trình kiểm tra an ninh soi chiếu đối với người, hành lý xách tay lên tàu bay.","yellow":[[57,85]]},{"letter":"C","body":"Bắt buộc kiểm tra trực quan","yellow":[]},{"letter":"D","body":"Chi kiểm tra bằng cổng từ","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-9","number":9,"text":"Câu 9: Việc kiểm tra an ninh hàng không đối với trang thiết bị y tế là vật phẩm nguy hiểm theo người lên tàu bay để chăm sóc bệnh nhân và đối tượng cảnh vệ được thực hiện như thế nào?","options":[{"letter":"A","body":"Có văn bản đề nghị và được sự đồng ý của đại diện hàng hàng không và người đứng đầu bộ phận kiểm soát an ninh hàng không tại Cảng hàng không quốc tế Tân Sơn Nhất và phải được kiểm tra bằng dụng cụ, thiết bị phát hiện chất nổ.","yellow":[[165,196]]},{"letter":"B","body":"Kiểm tra trực quan và dụng cụ, thiết bị phát hiện chất nổ","yellow":[]},{"letter":"C","body":"Không sử dụng cổng từ và thiết bị phát hiện kim loại cầm tay để kiểm tra hành khách.","yellow":[]},{"letter":"D","body":"Kiểm tra an ninh soi chiếu như đối với người, hành lý xách tay lên tàu bay.","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-10","number":10,"text":"Câu 10: Mỗi điểm kiểm tra an ninh hàng không phải có tối thiểu bao nhiêu bộ mẫu thử (Operational Test Pieces - OTP) của nhà cung cấp hoặc đơn vị vận hành khai thác để kiểm tra đối với cổng từ?","options":[{"letter":"A","body":"01 bộ","yellow":[[0,5]]},{"letter":"B","body":"02 bộ","yellow":[]},{"letter":"C","body":"03 bộ","yellow":[]},{"letter":"D","body":"04 bộ","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-11","number":11,"text":"Câu 11: Có bao nhiêu bước kiểm tra (Test) đối với máy soi tia X?","options":[{"letter":"A","body":"4 bước","yellow":[]},{"letter":"B","body":"5 bước","yellow":[]},{"letter":"C","body":"6 bước","yellow":[[0,6]]},{"letter":"D","body":"7 bước","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-12","number":12,"text":"Câu 12: Khi kiểm tra đối với cổng từ, mẫu thử (Operational Test Pieces - OTP) được đặt tại các vị trí nào dưới đây trên cơ thể?","options":[{"letter":"A","body":"Nách bên phải, hông bên phải, vòng eo ở giữa lưng, bên trong mắt cá chân bên phải.","yellow":[[15,49]]},{"letter":"B","body":"Nách bên phải, hông bên phải.","yellow":[]},{"letter":"C","body":"Vòng eo ở giữa lưng.","yellow":[]},{"letter":"D","body":"Bên trong mắt cá chân bên phải.","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-13","number":13,"text":"Câu 13: Việc kiểm tra đối với cổng từ sử dụng mẫu thử (Operational Test Pieces - OTP) đặt tại 04 vị trí trên cơ thể được thực hiện bao lâu một lần?","options":[{"letter":"A","body":"1 lần/ ngày","yellow":[]},{"letter":"B","body":"Mỗi tuần phải kiểm tra 01 lần","yellow":[[4,29]]},{"letter":"C","body":"2 tuần/ lần","yellow":[]},{"letter":"D","body":"1 tháng/ lần","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-14","number":14,"text":"Câu 14: Việc kiểm tra thiết bị phát hiện kim loại cầm tay được thực hiện bao nhiêu lần mỗi khi giao ca nhằm duy trì khả năng phát hiện ở mức tiêu chuẩn?","options":[{"letter":"A","body":"1 lần","yellow":[[0,5]]},{"letter":"B","body":"2 lần","yellow":[]},{"letter":"C","body":"3 lần","yellow":[]},{"letter":"D","body":"4 lần","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-15","number":15,"text":"Câu 15: Sổ kiểm tra thiết bị phát hiện kim loại cầm tay được lưu giữ bao lâu?","options":[{"letter":"A","body":"Tối thiểu 3 tháng","yellow":[]},{"letter":"B","body":"Tối thiểu 6 tháng","yellow":[]},{"letter":"C","body":"Tối thiểu 9 tháng","yellow":[]},{"letter":"D","body":"Tối thiểu 12 tháng","yellow":[[0,18]]}],"answer":3,"explanation":""},{"id":"p3-16","number":16,"text":"Câu 16: Quy trình kiểm tra thiết bị phát hiện kim loại cầm tay có bao nhiêu bước?","options":[{"letter":"A","body":"3 bước","yellow":[[0,6]]},{"letter":"B","body":"4 bước","yellow":[]},{"letter":"C","body":"5 bước","yellow":[]},{"letter":"D","body":"6 bước","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-17","number":17,"text":"Câu 17: Các vật phẩm nguy hiểm nào sau đây cấm mang vào khu vực hạn chế, khoang hành khách của tàu bay?","options":[{"letter":"A","body":"Chất nổ và các chất gây cháy, nổ và các vật có thành phần như: ngòi nổ, dây nổ và các thành phần cấu thành khác được sử dụng để gây sát thương hoặc đe doạ đến sự an toàn của tàu bay.","yellow":[[30,70]]},{"letter":"B","body":"Pháo hoa, pháo bông.","yellow":[]},{"letter":"C","body":"Vũ khí và công cụ hỗ trợ.","yellow":[]},{"letter":"D","body":"Các chất hoá học được phân loại trong danh mục Hàng hóa nguy hiểm","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-18","number":18,"text":"Câu 18: Các dụng cụ lao động nào sau đây có thể sử dụng để gây thương tích nghiêm trọng hoặc đe doạ đến an toàn của tàu bay cấm mang vào khu vực hạn chế, khoang hành khách của tàu bay?","options":[{"letter":"A","body":"Xà beng; cuốc, thuổng, xẻng, mai, liềm, tràng, đục, cuốc chim; Khoan và mũi khoan, bao gồm cả khoan bằng tay; Các loại dụng cụ có lưỡi sắc hoặc mũi nhọn và có khả năng sử dụng làm vũ khí như tuốc-nơ-vít","yellow":[]},{"letter":"B","body":"Xà beng; cuốc, thuổng, xẻng, mai, liềm, tràng, đục, cuốc chim; Khoan và mũi khoan, bao gồm cả khoan bằng tay; Các loại dụng cụ có lưỡi sắc hoặc mũi nhọn dài trên 06 cm và có khả năng sử dụng làm vũ khí như tuốc-nơ-vít","yellow":[[144,167]]},{"letter":"C","body":"Các loại dụng cụ có lưỡi sắc hoặc mũi nhọn dài trên 10cm; Các loại búa, cờ-lê, mỏ lết, kìm có chiều dài trên 10cm","yellow":[]},{"letter":"D","body":"Các loại dụng cụ có lưỡi sắc hoặc mũi nhọn dài trên 06cm; Các loại búa, cờ-lê, mỏ lết, kìm có chiều dài trên 06 cm","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-19","number":19,"text":"Câu 19: Các vật phẩm nguy hiểm nào sau đây cấm mang lên khoang hàng tàu bay?","options":[{"letter":"A","body":"Các loại kíp nổ; ngòi nổ, dây cháy chậm; Mìn, lựu đạn, thiết bị nổ quân dụng khác; Các loại pháo; Đạn khói, quả tạo khói; Các loại thuốc nổ, thuốc súng, chất nổ dẻo; Xăng, dầu, nhiên liệu nạp cho bật lửa, diêm không an toàn, ôxy lỏng.","yellow":[[17,44]]},{"letter":"B","body":"Các loại kíp nổ, ngòi nổ, pháo nổ; Mìn, lựu đạn; Xăng dầu; diêm không an toàn, ôxy lỏng.","yellow":[]},{"letter":"C","body":"Các loại kíp nổ, ngòi nổ, pháo nổ; Lựu đạn, đạn khói, thuốc súng, thuốc nổ; diêm không an toàn, ôxy lỏng.","yellow":[]},{"letter":"D","body":"Các loại pháo như pháo nổ, pháo hoa nổ, pháo bông; Lựu đạn, đạn khói, thuốc súng, thuốc nổ; diêm không an toàn, ôxy lỏng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-20","number":20,"text":"Câu 20: Hành khách khi làm thủ tục đi tàu bay trên các chuyến bay quốc tế phải xuất trình một trong những giấy tờ nào sau đây?","options":[{"letter":"A","body":"Hộ chiếu; Giấy thông hành.","yellow":[]},{"letter":"B","body":"Hộ chiếu; Giấy thông hành, giấy tờ có giá trị xuất, nhập cảnh theo quy định của pháp luật như thị thực rời, thẻ thường trú, thẻ tạm trú, thẻ căn cước công dân, trẻ em không có hộ chiếu riêng thì họ tên, ngày, tháng, năm sinh và ảnh của trẻ em được ghi và dán vào hộ chiếu của người đại diện theo pháp luật, bao gồm: cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi hoặc người giám hộ..","yellow":[[307,329]]},{"letter":"C","body":"Giấy tờ có giá trị xuất, nhập cảnh theo quy định của pháp luật như thị thực rời, thẻ thường trú, thẻ tạm trú, thẻ căn cước công dân","yellow":[]},{"letter":"D","body":"Thẻ căn cước công dân","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-21","number":21,"text":"Câu 21: Hành khách mang quốc tịch nước ngoài khi làm thủ tục đi tàu bay trên các chuyến bay quốc nội phải xuất trình một trong các loại giấy tờ nào sau đây?","options":[{"letter":"A","body":"Thẻ kiểm soát an ninh cảng hàng không, sân bay loại có giá trị sử dụng dài hạn","yellow":[]},{"letter":"B","body":"Thẻ kiểm soát an ninh cảng hàng không, sân bay loại có giá trị sử dụng ngắn hạn","yellow":[]},{"letter":"C","body":"Hộ chiếu nước ngoài hoặc giấy thông hành, thị thực rời, thẻ kiểm soát an ninh cảng hàng không, sân bay loại có giá trị sử dụng dài hạn.","yellow":[[42,69]]},{"letter":"D","body":"Bằng lái xe quốc tế","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-22","number":22,"text":"Câu 22: Hành khách mang quốc tịch Việt Nam chưa đủ 14 tuổi không có hộ chiếu riêng hoặc kèm hộ chiếu của cha mẹ khi làm thủ tục đi tàu bay trên các chuyến bay nội địa phải xuất trình một trong các loại giấy tờ nào sau đây?","options":[{"letter":"A","body":"Giấy khai sinh","yellow":[]},{"letter":"B","body":"Giấy khai sinh; trường hợp dưới 01 tháng tuổi chưa có giấy khai sinh thì phải có giấy chứng sinh, giấy xác nhận của tổ chức xã hội đối với trẻ em do tổ chức xã hội đang nuôi dưỡng (chỉ có giá trị sử dụng trong thời gian 06 tháng kể từ ngày xác nhận)","yellow":[[98,126]]},{"letter":"C","body":"Trường hợp dưới 01 tháng tuổi chưa có giấy khai sinh thì phải có giấy chứng sinh","yellow":[]},{"letter":"D","body":"Không cần xuất trình giấy tờ.","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-23","number":23,"text":"Câu 23: Trường hợp phát hiện hành khách sử dụng giấy tờ về nhân thân không đúng quy định, nhân viên kiểm soát an ninh thực hiện nhiệm vụ kiểm tra giấy tờ phải làm gì?","options":[{"letter":"A","body":"Tạm giữ giấy tờ và hành khách, báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội.","yellow":[[51,72]]},{"letter":"B","body":"Quan sát, đánh giá tính chất vụ việc.","yellow":[]},{"letter":"C","body":"Ra quyết định xử lý.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-24","number":24,"text":"Câu 24: Khi phát hiện vật phẩm nguy hiểm trong hành lý xách tay của hành khách, nhân viên giám sát màn hình máy soi phải làm gì?","options":[{"letter":"A","body":"Nhận định, dự đoán loại vật phẩm nguy hiểm, đánh giá mức độ nguy hiểm để có hướng xử lý phù hợp, phối hợp với nhân viên kiểm tra trực quan để kiểm tra. Ra quyết định xử lý, báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội các tình huống phát sinh.","yellow":[[11,42]]},{"letter":"B","body":"Phối hợp với nhân viên kiểm tra trực quan để kiểm tra. Ra quyết định xử lý.","yellow":[]},{"letter":"C","body":"Yêu cầu khách lấy vật phẩm nguy hiểm bỏ vào thùng chứa vật phẩm an ninh, báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội các tình huống phát sinh.","yellow":[]},{"letter":"D","body":"Yêu cầu khách lấy vật phẩm nguy hiểm bỏ vào thùng chứa vật phẩm an ninh","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-25","number":25,"text":"Câu 25: Khi phát hiện vật phẩm nguy hiểm trong hành lý xách tay của hành khách, kíp trưởng, cán bộ trực Ca/Tổ/Đội phải làm gì?","options":[{"letter":"A","body":"Nhận định, dự đoán loại vật phẩm nguy hiểm, đánh giá mức độ nguy hiểm để có hướng xử lý phù hợp.","yellow":[]},{"letter":"B","body":"Ra quyết định xử lý. Báo cáo cấp trên.","yellow":[]},{"letter":"C","body":"Quan sát, đánh giá tính chất vụ việc. Báo cáo cấp trên.","yellow":[]},{"letter":"D","body":"Quan sát, đánh giá tính chất vụ việc. Ra quyết định xử lý. Báo cáo cấp trên (nếu cần).","yellow":[[0,18],[38,51],[59,66]]}],"answer":3,"explanation":""},{"id":"p3-26","number":26,"text":"Câu 26: Miễn soi chiếu tia X và kiểm tra trực quan đối với các trường hợp nào sau đây?","options":[{"letter":"A","body":"Thi thể người vận chuyển bằng tàu bay được đặt trong hòm kẽm gắn kín. Quá trình đóng gói và niêm phong hòm kẽm phải được cơ quan y tế có thẩm quyền giám sát. Hòm kẽm phải còn nguyên niêm phong và có văn bản xác nhận của cơ quan y tế giám sát kèm theo giấy chứng tử.","yellow":[[158,186]]},{"letter":"B","body":"Động vật sống.","yellow":[]},{"letter":"C","body":"Hài cốt, tro cốt","yellow":[]},{"letter":"D","body":"Vật phẩm dễ bị hỏng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-27","number":27,"text":"Câu 27: Việc vận chuyển hàng nguy hiểm phải tuân thủ các quy định nào sau đây?","options":[{"letter":"A","body":"Hàng nguy hiểm phải được đóng gói đúng quy định và khai báo trước khi chấp nhận để vận chuyển.","yellow":[]},{"letter":"B","body":"Hàng nguy hiểm phải được dán nhãn đúng quy định và khai báo trước khi chấp nhận để vận chuyển.","yellow":[]},{"letter":"C","body":"Hàng nguy hiểm phải được khai báo trước khi chấp nhận để vận chuyển.","yellow":[]},{"letter":"D","body":"Hàng nguy hiểm phải được đóng gói, dán nhãn đúng quy định và khai báo trước khi chấp nhận để vận chuyển.","yellow":[[25,52]]}],"answer":3,"explanation":""},{"id":"p3-28","number":28,"text":"Câu 28: Việc mang theo trang thiết bị y tế là vật phẩm nguy hiểm theo người lên tàu bay để chăm sóc bệnh nhân và đối tượng cảnh vệ phải được đề nghị bằng văn bản và được sự đồng ý của cá nhân, đơn vị nào sau đây?","options":[{"letter":"A","body":"Đại diện hãng hàng không, người đứng đầu bộ phận kiểm soát an ninh hàng không tại Cảng hàng không quốc tế Tân Sơn Nhất","yellow":[[26,53]]},{"letter":"B","body":"Chi cục hải quan Tân Sơn Nhất","yellow":[]},{"letter":"C","body":"Cảng vụ hàng không miền Nam","yellow":[]},{"letter":"D","body":"Đại diện hãng hàng không","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-29","number":29,"text":"Câu 29: Các vật phẩm đặc biệt nào sau đây phải được kiểm tra bằng dụng cụ, thiết bị phát hiện chất nổ?","options":[{"letter":"A","body":"Thi thể người vận chuyển bằng tàu bay được đặt trong hòm kẽm gắn kín, các sản phẩm làm từ máu, bộ phận nội tạng dùng cho việc cấy ghép, vắc-xin, các loại dược phẩm phải duy trì đóng gói kín, hài cốt, tro cốt. Động vật sống, vật phẩm dễ bị hỏng, trang thiết bị y tế là vật phẩm nguy hiểm theo người lên tàu bay để chăm sóc bệnh nhân và đối tượng cảnh vệ.","yellow":[[169,207]]},{"letter":"B","body":"Thi thể người vận chuyển bằng tàu bay được đặt trong hòm kẽm gắn kín, các sản phẩm làm từ máu, hài cốt, tro cốt. Động vật sống, vật phẩm dễ bị hỏng, trang thiết bị y tế là vật phẩm nguy hiểm theo người lên tàu bay để chăm sóc bệnh nhân và đối tượng cảnh vệ.","yellow":[]},{"letter":"C","body":"Thi thể người vận chuyển bằng tàu bay được đặt trong hòm kẽm gắn kín, các sản phẩm làm từ máu, bộ phận nội tạng dùng cho việc cấy ghép, vắc-xin, các loại dược phẩm phải duy trì đóng gói kín, trang thiết bị y tế là vật phẩm nguy hiểm theo người lên tàu bay để chăm sóc bệnh nhân và đối tượng cảnh vệ.","yellow":[]},{"letter":"D","body":"Thi thể người vận chuyển bằng tàu bay được đặt trong hòm kẽm gắn kín, các sản phẩm làm từ máu, bộ phận nội tạng dùng cho việc cấy ghép, vắc-xin, các loại dược phẩm phải duy trì đóng gói kín, hài cốt, tro cốt. Động vật sống, vật phẩm dễ bị hỏng","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-30","number":30,"text":"Câu 30: Đối với cổng từ hoạt động liên tục (không tắt nguồn) thì phải được kiểm tra tối thiểu bao nhiêu lần trước khi sử dụng để kiểm tra hành khách của ca làm việc đầu tiên trong ngày?","options":[{"letter":"A","body":"Không cần kiểm tra","yellow":[]},{"letter":"B","body":"Ít nhất 01 lần mỗi ngày","yellow":[[0,23]]},{"letter":"C","body":"Ít nhất 02 lần mỗi ngày","yellow":[]},{"letter":"D","body":"Ít nhất 03 lần mỗi ngày","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-31","number":31,"text":"Câu 31: Cá nhân nào chịu trách nhiệm kiểm tra cổng từ khi đưa vào sử dụng lại sau một thời gian không sử dụng?","options":[{"letter":"A","body":"Đội trưởng","yellow":[]},{"letter":"B","body":"Đội phó","yellow":[]},{"letter":"C","body":"Kíp trưởng, Nhân viên kiểm soát an ninh hàng không","yellow":[[12,39]]},{"letter":"D","body":"Nhà sản xuất","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-32","number":32,"text":"Câu 32: Quy trình kiểm tra đối với thiết bị phát hiện kim loại cầm tay bao gồm mấy bước ?","options":[{"letter":"A","body":"01 bước","yellow":[]},{"letter":"B","body":"02 bước","yellow":[]},{"letter":"C","body":"03 bước","yellow":[[0,7]]},{"letter":"D","body":"04 bước","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-33","number":33,"text":"Câu 33: Sử dụng mẫu thử nào để kiểm tra thiết bị phát hiện kim loại cầm tay?","options":[{"letter":"A","body":"Đồng tiền bằng kim loại.","yellow":[]},{"letter":"B","body":"Đồng tiền bằng kim loại đặt trong hộp nhựa có độ sâu là 03 cen-ti-mét.","yellow":[[38,69]]},{"letter":"C","body":"Đồng tiền bằng kim loại đặt trong hộp kim loại có độ sâu là 03 cen-ti-mét.","yellow":[]},{"letter":"D","body":"Đồng tiền bằng kim loại đặt trong hộp kín có độ sâu là 05 cen-ti-mét.","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-34","number":34,"text":"Câu 34: Việc thực hiện kiểm tra an ninh soi chiếu đối với hàng hóa, bưu gửi xuất phát, hàng hóa bưu gửi quá cảnh, nối chuyến, kiểm tra an ninh ngoài khu vực cảng hàng không sân bay bao gồm những nội dung nào?","options":[{"letter":"A","body":"Quy trình kiểm tra như tại khu vực cảng hàng không","yellow":[]},{"letter":"B","body":"Kiểm tra như quy trình kiểm tra hàng hóa có nguy cơ cao","yellow":[]},{"letter":"C","body":"Kiểm tra giấy tờ liên quan của hàng hóa bưu gửi. Kiểm tra hàng hóa, bưu gửi bằng máy soi tia X/ kiểm tra bằng dụng cụ, thiết bị phát hiện chất nổ/ kiểm tra trực quan.Xử lý trường hợp không thực hiện đúng quy định, vi phạm an ninh hàng không.","yellow":[[214,240]]},{"letter":"D","body":"Kiểm tra như đối với kiểm tra hàng hóa có giá trị cao","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-35","number":35,"text":"Câu 35: Những trường hợp nào sau đây cần kiểm tra bằng dụng cụ, thiết bị phát hiện chất nổ (máy ngửi, thiết bị phát hiện vi vết chất nổ)?","options":[{"letter":"A","body":"Theo yêu cầu của hãng vận chuyển.","yellow":[]},{"letter":"B","body":"Theo yêu cầu của người gửi hàng.","yellow":[]},{"letter":"C","body":"Nghi vấn đối với đổ vật trong hàng hóa, bưu gửi, theo yêu cầu của cơ quan có thẩm quyền và các trường hợp khác.","yellow":[[40,68]]},{"letter":"D","body":"Theo yêu cầu của cơ quan có thẩm quyền.","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-36","number":36,"text":"Câu 36: Các trường hợp nào sau đây cần kiểm tra trực quan đối với hàng hóa, bưu gửi?","options":[{"letter":"A","body":"Khi có nghi vấn đối với hàng hóa, bưu gửi.","yellow":[]},{"letter":"B","body":"Khi có nghi vấn đối với hàng hóa bưu gửi. Hàng hóa quá khổ.Kiểm tra trực quan bổ sung ngẫu nhiên theo quy định","yellow":[[42,67]]},{"letter":"C","body":"Hình ảnh máy soi/cổng từ/thiết bị cầm tay phát cảnh báo.","yellow":[]},{"letter":"D","body":"Kiểm tra trực quan bổ sung ngẫu nhiên theo quy định","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-37","number":37,"text":"Câu 37: Những trường hợp phải lục soát Hàng hóa, bưu gửi?","options":[{"letter":"A","body":"Hàng hóa, bưu gửi có dấu hiệu hoặc có thông tin đe dọa liên quan đến an ninh, an toàn của chuyến bay.","yellow":[[48,76]]},{"letter":"B","body":"Hàng hóa của đại lý mới khai thác lần đầu.","yellow":[]},{"letter":"C","body":"Hàng hóa, bưu gửi đi trên chuyến bay quốc tế.","yellow":[]},{"letter":"D","body":"Hàng hóa, bưu gửi đi trên chuyến bay quốc nội","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-38","number":38,"text":"Câu 38: Trường hợp người gửi hàng hoặc (chủ) đại diện hợp pháp của hàng hóa, bưu gửi từ chối thực hiện thủ tục kiểm tra an ninh thì kíp trưởng, cán bộ trực Ca/ Tổ/ Đội sẽ xử lý như thế nào?","options":[{"letter":"A","body":"Không giải quyết cho đi","yellow":[]},{"letter":"B","body":"Quan sát, đánh giá tính chât vụ việc. Ra quyết đinh xử lý và báo cáo cấp trên (nếu cần)","yellow":[[10,36]]},{"letter":"C","body":"Báo với đại diện hãng","yellow":[]},{"letter":"D","body":"Bàn giao cho cơ quan chức năng","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-39","number":39,"text":"Câu 39: Nhân viên giám sát màn hình máy soi sẽ xử lý như thế nào trong trường hợp phát hiện vật phẩm nguy hiểm trong hàng hóa, bưu gửi?","options":[{"letter":"A","body":"Tự minh mở ra để kiểm tra","yellow":[]},{"letter":"B","body":"Báo với đại diện hãng","yellow":[]},{"letter":"C","body":"Nhận định, dự đoán loại vật phẩm nguy hiểm, đánh giá mức dộ nguy hiểm để có hướng xử lý phù hợp. Phối hợp với nhân viên kiểm tra trực quan để kiểm tra. Ra quyết định xử lý. Báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội các tình huống phát sinh.","yellow":[[0,18]]},{"letter":"D","body":"Yêu cầu khách hàng mang về","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-40","number":40,"text":"Câu 40: Trường hợp phát hiện vật phẩm nguy hiểm trong hàng hóa, bưu gửi thì kíp trưởng, cán bộ trực Ca/ Tổ/ Đội sẽ xử lý như thế nào?","options":[{"letter":"A","body":"Tự mình mở ra để kiểm tra","yellow":[]},{"letter":"B","body":"Báo cho đại diện hãng biết","yellow":[]},{"letter":"C","body":"Quan sát, đánh giá tính chất vụ việc. Ra quyết định xử lý. Báo cáo cấp trên (nếu cần)","yellow":[[0,8],[38,51],[59,66]]},{"letter":"D","body":"Báo cho các bộ phận liên quan biết","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-41","number":41,"text":"Câu 41: Trường hợp hàng hóa, bưu gửi giữ lại theo yêu cầu của cơ quan chức năng có thẩm quyền thì kíp trưởng, cán bộ trực Ca/ Tổ/ Đội sẽ xử lý như thế nào?","options":[{"letter":"A","body":"Thực hiện theo yêu cầu của cơ quan chức năng","yellow":[]},{"letter":"B","body":"Báo cho nhà vận chuyển biết","yellow":[]},{"letter":"C","body":"Quan sát, đánh giá tính chất vụ việc. Ra quyết định xử lý. Báo cáo cấp trên (nếu cần)","yellow":[[10,36]]},{"letter":"D","body":"Cùng phối hợp vớ cá bộ phận liên quan","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-42","number":42,"text":"Câu 42: Nhiệm vụ của Kíp trưởng?","options":[{"letter":"A","body":"Chỉ đạo, điều hành và giám sát toàn bộ công việc tại điểm kiểm tra an ninh hàng không.","yellow":[[53,62],[63,85]]},{"letter":"B","body":"Dán tem niêm phong","yellow":[]},{"letter":"C","body":"Áp tải hàng hóa","yellow":[]},{"letter":"D","body":"Kiểm tra trực quan","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-43","number":43,"text":"Câu 43: Kiểm tra an ninh phương tiện vận chuyển suất ăn gồm các bước nào sau đây?","options":[{"letter":"A","body":"Kiểm tra bằng máy soi","yellow":[]},{"letter":"B","body":"Dùng gương soi gầm để kiểm tra phương tiện","yellow":[]},{"letter":"C","body":"Tiếp nhận thông tin kiểm tra. Quan sát, kiểm tra trực quan/ kiểm tra bằng dụng cụ, thiết bị phát hiện chất nổ đối với phương tiện vận chuyển suất ăn.","yellow":[[30,58]]},{"letter":"D","body":"Sử dụng máy máy ngửi chất nổ để kiểm tra phường tiện","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-44","number":44,"text":"Câu 44: Nhiệm vụ của nhân viên kiểm tra soi chiếu Tia X?","options":[{"letter":"A","body":"Giám sát màn hình máy soi tia X","yellow":[]},{"letter":"B","body":"Thông báo và phối hợp với nhân viên kiểm tra trực quan trong trường hợp hành lý cần kiểm tra.","yellow":[]},{"letter":"C","body":"Ra quyết định xử lý, báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội các tình huống phát sinh.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-45","number":45,"text":"Câu 45: Nhiệm vụ của nhân viên kiểm tra bằng cổng từ, thiết bị phát hiện kim loại cầm tay kết hợp trực quan?","options":[{"letter":"A","body":"Khi hành khách bước qua cổng từ, theo dõi tín hiệu báo động của cổng từ; quan sát biểu hiện, trang phục của hành khách","yellow":[]},{"letter":"B","body":"Tiến hành kiểm tra người bằng thiết bị phát hiện kim loại cầm tay và kiểm tra trực quan theo tín hiệu báo động của cổng từ hoặc có nghi vấn.","yellow":[]},{"letter":"C","body":"Kết thúc kiểm tra, ra quyết định xử lý. Báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội các tình huống phát sinh.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-46","number":46,"text":"Câu 46: Nhiệm vụ của nhân viên kiểm tra bằng thiết bị soi chiếu cơ thể?","options":[{"letter":"A","body":"Khi hành khách bước vào khoang soi của thiết bị, theo dõi tín hiệu báo động của thiết bị, quan sát biểu hiện, trang phục của hành khách","yellow":[]},{"letter":"B","body":"Tiến hành kiểm tra người hành khách theo cảnh báo của thiết bị hoặc có nghi vấn","yellow":[]},{"letter":"C","body":"Kết thúc kiểm tra, ra quyết định xử lý. Báo cáo kíp trưởng, cán bộ trực Ca/Tổ/Đội các tình huống phát sinh.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-47","number":47,"text":"Câu 47: Những trường hợp kiểm tra ngẫu nhiên?","options":[{"letter":"A","body":"Kiểm tra trưc quan ngẫu nhiên đối vớ hành khách đã qua kiểm tra an ninh mà lại đi ra ngoài","yellow":[]},{"letter":"B","body":"Kiểm tra ngẫu nhiên sau kiểm tra an ninh lần đầu đối với hành khách, hành lý xách tay (10%)","yellow":[[24,40],[41,67]]},{"letter":"C","body":"Kiểm tra ngẫu nhiên sau kiểm tra an ninh lần đầu đối với hành lý ký gửi (10%)","yellow":[]},{"letter":"D","body":"Kiểm tra ngẫu nhiên sau kiểm tra an ninh lần đầu đối với hàng hóa bưu gửi (10%)","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-48","number":48,"text":"Câu 48: Những trường hợp kiểm tra trực quan người?","options":[{"letter":"A","body":"Hành vi nghi vấn đối với hành khách, hành lý xách tay và đồ vật mang theo.","yellow":[]},{"letter":"B","body":"Hình ảnh máy soi/cổng từ/thiết bị cầm tay phát cảnh báo.","yellow":[]},{"letter":"C","body":"Kiểm tra trực quan bổ sung ngẫu nhiên,","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-49","number":49,"text":"Câu 49: Việc kiểm tra an ninh đối với hành khách, tổ bay hoạt động hàng không chung tại điểm kiểm tra soi chiếu hành khách, hành lý xách tay bao gồm các nội dung nào sau đây?","options":[{"letter":"A","body":"Kiểm tra giấy tờ nhân thân/vé/thẻ đi tàu bay của hành khách","yellow":[]},{"letter":"B","body":"Kiểm tra danh sách, thẻ nhận dạng, trang phục tổ bay","yellow":[]},{"letter":"C","body":"Kiểm tra soi chiếu người, hành lý xách tay","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-50","number":50,"text":"Câu 50: Mục đích kiểm tra hành lý ký gửi tại các điểm kiểm tra an ninh soi chiếu hành lý ký gửi là gì?","options":[{"letter":"A","body":"Đảm bảo hành lý ký gửi vào khu vực hạn chế đúng đối tượng, đúng quy định.","yellow":[]},{"letter":"B","body":"Phát hiện, ngăn chặn việc mang vật phẩm nguy hiểm vào khu vực hạn chế, lên tàu bay trái quy định","yellow":[]},{"letter":"C","body":"Phối hợp phát hiện, ngăn chặn hành vi vi phạm pháp luật khác","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-51","number":51,"text":"Câu 51: Việc kiểm tra, xác định túi ngoại giao, túi lãnh sự được nhân viên kiểm soát an ninh hàng không thực hiện như thế nào?","options":[{"letter":"A","body":"Kiểm tra hộ chiếu, giấy ủy quyền mang túi ngoại giao, túi lãnh sự, văn bản của cơ quan đại diện ngoại giao, cơ quan đại diện lãnh sự xác nhận số kiện của túi ngoại giao, túi lãnh sự.","yellow":[]},{"letter":"B","body":"Kiểm tra niêm phong, những dấu hiệu nhận biết bên ngoài của túi ngoại giao, túi lãnh sự theo quy định của pháp luật về ngoại giao và lãnh sự.","yellow":[]},{"letter":"C","body":"Trong trường hợp có cơ sở để khẳng định túi ngoại giao, túi lãnh sự có chứa vật phẩm nguy hiểm không được phép vận chuyển trên tàu bay theo quy định thì túi ngoại giao, túi lãnh sự đó bị từ chối chuyên chở","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-52","number":52,"text":"Câu 52: Việc soi chiếu tia X túi ngoại giao, túi lãnh sự phải được ghi nhận bằng biên bản có sự xác nhận của cá nhân, đơn vị nào sau đây?","options":[{"letter":"A","body":"Hãng hàng không, giao thông viên ngoại giao hoặc giao thông viên lãnh sự.","yellow":[]},{"letter":"B","body":"Nhân viên kiểm soát an ninh hàng không và Cảng vụ hàng không.","yellow":[]},{"letter":"C","body":"Hãng hàng không, nhân viên kiểm soát an ninh hàng không và Cảng vụ hàng không","yellow":[]},{"letter":"D","body":"Hãng hàng không, giao thông viên ngoại giao hoặc giao thông viên lãnh sự, nhân viên kiểm soát an ninh hàng không và Cảng vụ hàng không","yellow":[[0,4],[17,43],[49,72],[74,93],[94,112],[116,123]]}],"answer":3,"explanation":""},{"id":"p3-53","number":53,"text":"Câu 53: Lực lượng kiểm soát an ninh hàng không phối hợp với cá nhân, đơn vị nào để bàn giao hành khách bị từ chối nhập cảnh cho Đại diện hãng hàng không khi có yêu cầu?","options":[{"letter":"A","body":"Công an cửa khẩu","yellow":[[0,16]]},{"letter":"B","body":"Cảng vụ hàng không","yellow":[]},{"letter":"C","body":"Nhân viên phục vụ mặt đất","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-54","number":54,"text":"Câu 54: Mục đích, yêu cầu của việc kiểm tra hàng hoá, đồ vật mang vào bán, sử dụng trong khu vực hạn chế?","options":[{"letter":"A","body":"Đảm bảo hàng hóa, đồ vật mang vào bán, sử dụng trong khu vực hạn chế đúng đối tượng, đúng quy định.","yellow":[]},{"letter":"B","body":"Phát hiện, ngăn chặn việc mang vật phẩm nguy hiểm vào khu vực hạn chế, lên tàu bay trái quy định.","yellow":[]},{"letter":"C","body":"Phối hợp phát hiện, ngăn chặn hành vi vi phạm pháp luật khác.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-55","number":55,"text":"Câu 55: Mục đích, yêu cầu của việc kiểm tra an ninh đối với hàng hoá, bưu gửi lên tàu bay là gì?","options":[{"letter":"A","body":"Đảm bảo hàng hóa, bưu gửi đưa lên tàu bay đúng đối tượng, đúng quy định.","yellow":[]},{"letter":"B","body":"Đảm bảo hàng hóa, bưu gửi đưa lên tàu bay đúng đối tượng, đúng quy định. Phát hiện, ngăn chặn việc mang vật phẩm nguy hiểm vào khu vực hạn chế, lên tàu bay trái quy định.","yellow":[[144,169]]},{"letter":"C","body":"Kiểm tra, xác định sự tuân thủ các quy định về vận chuyển hàng nguy hiểm bằng đường hàng không trước khi chấp nhận vận chuyển hàng nguy hiểm","yellow":[]},{"letter":"D","body":"Xác định hàng hóa, bưu gửi thuộc danh mục hàng nguy hiểm","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-56","number":56,"text":"Câu 56: Trách nhiệm của Cảng HKQT Tân Sơn Nhất đối với hàng hóa, bưu gửi kiểm tra an ninh hàng không tại Cảng HKQT Tân Sơn Nhất là gì?","options":[{"letter":"A","body":"Kiểm tra, giám sát an ninh hàng không đối với hàng hóa, bưu gửi theo quy định.","yellow":[]},{"letter":"B","body":"Bảo đảm an ninh hàng không đối với tàu bay chuyên chở hàng hóa, bưu gửi theo quy định.","yellow":[]},{"letter":"C","body":"Xử lý các vi phạm và tình huống phát sinh trong quá trình kiểm tra, giám sát an ninh hàng không hàng hóa, bưu gửi theo quy định.","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-57","number":57,"text":"Câu 57: Cơ quan, đơn vị nào có trách nhiệm trong việc xác định hàng hoá, bưu gửi thuộc danh mục hàng nguy hiểm?","options":[{"letter":"A","body":"Lực lượng kiểm soát an ninh hàng không","yellow":[]},{"letter":"B","body":"Cảng vụ hàng không","yellow":[]},{"letter":"C","body":"Hãng hàng không","yellow":[[0,15]]},{"letter":"D","body":"Cục Hàng không Việt Nam","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-58","number":58,"text":"Câu 58: Hàng hóa, bưu gửi quá cảnh, nối chuyến, trung chuyển không phải kiểm tra an ninh trong các trường hợp nào sau đây?","options":[{"letter":"A","body":"Khi có tờ khai an ninh chứng minh việc kiểm tra an ninh hàng không đã được thực hiện 100% đối với hàng hóa, bưu gửi tại điểm xuất phát.","yellow":[]},{"letter":"B","body":"Hàng hóa, bưu gửi quá cảnh, trung chuyển không rời khỏi tàu bay, sân đỗ tàu bay hoặc không rời khỏi khu vực hạn chế và có sự giám sát an ninh hàng không thích hợp liên lục","yellow":[]},{"letter":"C","body":"Hàng hóa, bưu gửi quá cảnh, trung chuyển được vận chuyển từ sân đỗ tàu bay vào khu vực lưu giữ hàng hóa qua khu vực công cộng không phải khu vực hạn chế và ngược lại được niêm phong và có biện pháp giám sát an ninh thích hợp liên tục trong quá trình vận chuyển để ngăn ngừa việc đưa trái phép vật phẩm nguy hiểm vào hàng hóa, bưu gửi","yellow":[]},{"letter":"D","body":"Đáp án A, B và C đúng.","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-59","number":59,"text":"Câu 59: Quy trinh kiểm tra cổng từ hàng ngày trước khi đưa vào sữ dụng gồm có mấy bước ?","options":[{"letter":"A","body":"02 bước","yellow":[]},{"letter":"B","body":"03 bước","yellow":[]},{"letter":"C","body":"04 bước","yellow":[[0,7]]},{"letter":"D","body":"05 bước","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-60","number":60,"text":"Câu 60: Hàng hóa, bưu gửi có rủi ro an ninh hàng không ở mức cao là gì?","options":[{"letter":"A","body":"Là hàng hóa, bưu gửi xuất phát từ các nước có tình hình chính trị không ổn định theo khuyến cáo của cơ quan quản lý nhà nước.","yellow":[]},{"letter":"B","body":"Là hàng hóa, bưu gửi xuất phát từ các nước có tình hình chính trị, trật tự xã hội không ổn định theo khuyến cáo của cơ quan quản lý nhà nước.","yellow":[[46,74]]},{"letter":"C","body":"Là hàng hóa, bưu gửi xuất phát từ các nước có tình hình trật tự xã hội không ổn định theo khuyến cáo của cơ quan quản lý nhà nước.","yellow":[]},{"letter":"D","body":"Là hàng hóa, bưu gửi xuất phát từ các nước có tình hình an ninh không ổn định theo khuyến cáo của cơ quan quản lý nhà nước.","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-61","number":61,"text":"Câu 61: Cần áp dụng các biện pháp tăng cường kiểm tra an ninh hàng không nào đối với hàng hóa, bưu gửi có rủi ro an ninh hàng không ở mức cao?","options":[{"letter":"A","body":"Tăng cường kiểm tra trực quan ngẫu nhiên","yellow":[]},{"letter":"B","body":"Kiêm tra như hàng hóa thông thường","yellow":[]},{"letter":"C","body":"Sử dụng bộ phát hiện vi vết chất nổ, máy ngửi thuốc nổ. Tăng cường kiểm tra trực quan","yellow":[[37,66]]},{"letter":"D","body":"Tiến hành kiểm tra nhu đối với kiểm tra hàng hóa quá khổ","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-62","number":62,"text":"Câu 62: Cơ quan, đơn vị nào chịu trách nhiệm cung cấp thông tin về nguồn gốc hàng hóa, bưu gửi có rủi ro an ninh hàng không ở mức cao cho lực lượng kiểm soát an ninh hàng không của Cảng hàng không quốc tế Tân Sơn Nhất?","options":[{"letter":"A","body":"Hãng hàng không","yellow":[]},{"letter":"B","body":"Người gửi hàng","yellow":[]},{"letter":"C","body":"Hãng hàng không. Cơ sở cung cấp dịch vụ hàng hóa","yellow":[[17,39]]},{"letter":"D","body":"Lực lượng hải quan","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-63","number":63,"text":"Câu 63: Ai là người chịu trách nhiệm kiểm tra, đối chiếu số lượng, chủng loại đồ phục vu cho việc bảo dưỡng, sữa chũa tàu bay khi đưa lên, đưa xuống tàu bay và ghi bằng văn bản, xuất trình cho nhân viên kiểm soát an ninh hàng không khí vào và ra khỏi khu vực hạn chế ?","options":[{"letter":"A","body":"Người khai thác cảng","yellow":[]},{"letter":"B","body":"Hãng hàng không","yellow":[]},{"letter":"C","body":"Người khai thác, bảo dưỡng, sửa chữa tàu bay","yellow":[[17,44]]},{"letter":"D","body":"Đơn vị phục vụ mặt đất","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-64","number":64,"text":"Câu 64: “Kiểm tra trực quan” là gì?","options":[{"letter":"A","body":"Là việc nhân viên kiểm soát an ninh hàng không trực tiếp sử dụng tay để kiểm tra người, phương tiện, đồ vật nhằm nhận biết vật đáng ngờ.","yellow":[]},{"letter":"B","body":"Là việc nhân viên kiểm soát an ninh hàng không trực tiếp sử dụng mắt để kiểm tra người, phương tiện, đồ vật nhằm phát hiện vật phẩm nguy hiểm.","yellow":[]},{"letter":"C","body":"Là việc nhân viên kiểm soát an ninh hàng không trực tiếp sử dụng tay, mắt nhằm nhận biết và phát hiện vật đáng ngờ, vật phẩm nguy hiểm.","yellow":[]},{"letter":"D","body":"Là việc nhân viên kiểm soát an ninh hàng không trực tiếp sử dụng tay, mắt và các giác quan khác để kiểm tra người, phương tiện, đồ vật nhằm nhận biết và phát hiện vật đáng ngờ, vật phẩm nguy hiểm.","yellow":[[128,157]]}],"answer":3,"explanation":""},{"id":"p3-65","number":65,"text":"Câu 65: Manual search on passenger in body-check rooms must ensure?","options":[{"letter":"A","body":"Manual check by the security sceener with same gender","yellow":[]},{"letter":"B","body":"The witness of the third person with same gender","yellow":[]},{"letter":"C","body":"Making record","yellow":[]},{"letter":"D","body":"All above are correct","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-66","number":66,"text":"Câu 66: How does the screening staff handle when detecting dangerous items in passenger's luggage?","options":[{"letter":"A","body":"Identify and predict the type of dangerous items, assess the level of danger for appropriate handling","yellow":[]},{"letter":"B","body":"Coordinate with visual check staff for security check. Make a decision to handle","yellow":[]},{"letter":"C","body":"Report to supervisor, team leader arising situations","yellow":[]},{"letter":"D","body":"All above are correct","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-67","number":67,"text":"Câu 67: How often is Tan Son Nhat International Airport responsible for coordinating with relevant agencies, units and enterprises to organize internal drill?","options":[{"letter":"A","body":"Every year","yellow":[]},{"letter":"B","body":"At least every 02 years","yellow":[[0,23]]},{"letter":"C","body":"At least every 03 years","yellow":[]},{"letter":"D","body":"At least every 05 years","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-68","number":68,"text":"Câu 68: What are responsibilities of the chief of the shift at passenger, hand luggage security checkpoints?","options":[{"letter":"A","body":"Handling violations when employees report","yellow":[]},{"letter":"B","body":"Rotating tasks of staff during each shift","yellow":[]},{"letter":"C","body":"Directing, operating and supervising the whole work at aviation security checkpoints","yellow":[[11,51]]},{"letter":"D","body":"All above are correct","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-69","number":69,"text":"Câu 69: How do Supervisers/ team leaders handle when detecting dangerous items in passenger's luggage?","options":[{"letter":"A","body":"Identifying, classifying potential dangerous items, assessing the level of danger for propper handling","yellow":[]},{"letter":"B","body":"Making decision. Superior reporting","yellow":[]},{"letter":"C","body":"Observe, assess the nature of the case. Superior reporting","yellow":[]},{"letter":"D","body":"Observe, assess the nature of the case. Make decision. Superior reporting (if necessary).","yellow":[[9,53]]}],"answer":3,"explanation":""},{"id":"p3-70","number":70,"text":"Câu 70: How is the screening of high-risk goods (goods originating from countries with unstable political and social order according to the recommendations of state management agencies) conducted?","options":[{"letter":"A","body":"In addition to the process applied to normal goods, for high-risk goods, measures of using explosive detection devices and increasing visual inspection are also applied.","yellow":[[52,84]]},{"letter":"B","body":"Like ordinary goods","yellow":[]},{"letter":"C","body":"Exemption from screening check","yellow":[]},{"letter":"D","body":"All above are correct","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-71","number":71,"text":"Câu 71: What are high-risk goods?","options":[{"letter":"A","body":"Goods originating from countries with unstable political and social situation according to the recommendations of state management agencies.","yellow":[[91,139]]},{"letter":"B","body":"Goods from Europe","yellow":[]},{"letter":"C","body":"Goods from the Americas","yellow":[]},{"letter":"D","body":"Goods from the South East Asia","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-72","number":72,"text":"Câu 72: What are purposes and requirements of the security check of goods and postal items carried on board?","options":[{"letter":"A","body":"Ensure that the goods and postal items are loaded onto the aircraft to the right subjects and according to regulations.","yellow":[]},{"letter":"B","body":"Detect, prevent bringing dangerous items into restricted areas, illegally boarding aircraft","yellow":[]},{"letter":"C","body":"Cooperate in detecting and preventing other illegal acts","yellow":[]},{"letter":"D","body":"All above are correct","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-73","number":73,"text":"Câu 73: What are responsibilities of Tan Son Nhat International Airport for the security check of goods and postal items carried on board?","options":[{"letter":"A","body":"Check and supervise aviation security for goods and postal items as prescribed","yellow":[]},{"letter":"B","body":"Ensuring aviation security for aircraft carrying cargo and postal items as prescribed","yellow":[]},{"letter":"C","body":"Handle violations and situations arising in the course of aviation security inspection and supervision of goods and postal items according to regulations.","yellow":[]},{"letter":"D","body":"All above are correct","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-74","number":74,"text":"Câu 74: What is the security check and supervision of crew members?","options":[{"letter":"A","body":"Exemption from security check and supervision","yellow":[]},{"letter":"B","body":"As passengers and luggage","yellow":[[0,25]]},{"letter":"C","body":"Manual check is compulsory","yellow":[]},{"letter":"D","body":"Checking by walk-through metal detector","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-75","number":75,"text":"Câu 75: Cargo and postal items in transit must be screening checked and monitored for aviation security like departing goods and postal items, except for the following cases:","options":[{"letter":"A","body":"Cargo and postal items in transit or transshipment have a security declaration proving that the aviation security check has been carried out 100% of the goods and postal items at the point of departure","yellow":[]},{"letter":"B","body":"Cargo and postal items in transit or transshipment do not leave the aircraft, aircraft apron or do not leave restricted areas and are subject to continuous appropriate aviation security supervision","yellow":[]},{"letter":"C","body":"Cargo and postal items in transit or transshipment are transported from the aircraft apron to the cargo storage area through a public area that is not a restricted area and vice versa, which is sealed and has measures for security supervision, continuous appropriate security during transport to prevent the unauthorized introduction of dangerous items into the goods or items","yellow":[]},{"letter":"D","body":"All above are correct","yellow":[[0,21]]}],"answer":3,"explanation":""},{"id":"p3-76","number":76,"text":"Câu 76: Who is responsible for providing information about the origin of goods and postal items with high aviation security risks to the aviation security control force of Tan Son Nhat International Airport?","options":[{"letter":"A","body":"Airlines and goods service provider","yellow":[[0,35]]},{"letter":"B","body":"Southern Airports Authority","yellow":[]},{"letter":"C","body":"Cargo companies","yellow":[]},{"letter":"D","body":"Customs","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-77","number":77,"text":"Câu 77: Which unit is responsible for checking and determining compliance with the regulations on transporting dangerous goods by air before accepting the transportation of dangerous goods?","options":[{"letter":"A","body":"Aviation Security Center","yellow":[]},{"letter":"B","body":"Airlines","yellow":[]},{"letter":"C","body":"Cargo companies","yellow":[]},{"letter":"D","body":"Southern Airports Authority","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-78","number":78,"text":"Câu 78: How does the screening staff handle when detecting dangerous items in goods and postal items?","options":[{"letter":"A","body":"Identify and predict the ter":"B","body":"Tan Son Nhat Security Center","yellow":[]},{"letter":"C","body":"Airlines","yellow":[]},{"letter":"D","body":"Southern Airports Authority","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-92","number":92,"text":"Câu 92: What does catering supplies include?","options":[{"letter":"A","body":"Food, beverages, other dry stores used on board an aircraft; Any property carried on an aircraft.","yellow":[]},{"letter":"B","body":"Associated equipment used on board an aircraft; Any property carried on an aircraft.","yellow":[]},{"letter":"C","body":"Food, beverages, other dry stores used on board an aircraft; Associated equipment used on board an aircraft.","yellow":[[51,107]]},{"letter":"D","body":"Any property carried on an aircraft.","yellow":[]}],"answer":2,"explanation":""},{"id":"p3-93","number":93,"text":"Câu 93: What is cargo and mail departing on an aircraft other than that on which it arrived?","options":[{"letter":"A","body":"Transfer cargo and mail.","yellow":[[0,23]]},{"letter":"B","body":"Transfer passengers and baggage.","yellow":[]},{"letter":"C","body":"Transit cargo and mail.","yellow":[]},{"letter":"D","body":"Transit passenger and baggage.","yellow":[]}],"answer":0,"explanation":""},{"id":"p3-94","number":94,"text":"Câu 94: What is baggage that arrives at an airport and is not picked up or claimed by a passenger or crew?","options":[{"letter":"A","body":"Unaccompanied baggage","yellow":[]},{"letter":"B","body":"Unclaimed baggage","yellow":[[0,17]]},{"letter":"C","body":"Unidentified baggage","yellow":[]},{"letter":"D","body":"Hold baggage","yellow":[]}],"answer":1,"explanation":""},{"id":"p3-95","number":95,"text":"Câu 95: What are passengers departing from an airport on the same flight as that on which they arrived?","options":[{"letter":"A","body":"Transit passengers.","yellow":[[0,18]]},{"letter":"B","body":"Transfer passengers.","yellow":[]},{"letter":"C","body":"Hold passengers.","yellow":[]},{"letter":"D","body":"All above are wr <script>

const ICON={plane:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>',book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2z"/><path d="M12 6.5v13"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>'};
let packagesBySection = [];

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function formatTime(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const m=Math.floor(s/60), r=s%60;
  return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}
function randomItem(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(array){
  const a=array.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function sample(array,count){return shuffle(array).slice(0,count);}
function apportion(total,items){
  if(!items.length) return [];
  const sum=items.reduce((n,x)=>n+x.weight,0);
  if(!sum) return items.map(()=>0);
  const raw=items.map((x,i)=>({i,exact:total*x.weight/sum}));
  const out=raw.map(x=>Math.floor(x.exact));
  let left=total-out.reduce((a,b)=>a+b,0);
  raw.sort((a,b)=>((b.exact-Math.floor(b.exact))-(a.exact-Math.floor(a.exact))) || a.i-b.i);
  for(let k=0;k<left;k++) out[raw[k].i]++;
  return out;
}
const CUSTOM_RANGES = {
  p2: [[1,35],[36,70],[71,107],[108,130],[131,166]]
};
function buildPackages(){
  packagesBySection = BANK.map((section,si)=>{
    const ranges=CUSTOM_RANGES[section.id];
    if(ranges){
      return ranges.map(([from,to],i)=>{
        const qs=section.questions.filter(q=>q.number>=from && q.number<=to);
        return {id:`${section.id}-g${i+1}`,sectionIndex:si,index:i+1,total:ranges.length,title:`Nhóm ${si+1}${String.fromCharCode(65+i)}`,from,to,questions:qs};
      });
    }
    const n=section.questions.length;
    let count=1;
    if(n>40) count = n<100 ? 3 : Math.ceil(n/40);
    const base=Math.floor(n/count), rem=n%count;
    let cursor=0;
    const packs=[];
    for(let i=0;i<count;i++){
      const size=base+(i<rem?1:0);
      const qs=section.questions.slice(cursor,cursor+size);
      packs.push({id:`${section.id}-g${i+1}`,sectionIndex:si,index:i+1,total:count,title:`Nhóm ${si+1}${String.fromCharCode(65+i)}`,from:qs[0].number,to:qs[qs.length-1].number,questions:qs});
      cursor+=size;
    }
    return packs;
  });
}
function allQuestions(){return BANK.flatMap(s=>s.questions);}
function getQuestionById(id){for(const s of BANK){const q=s.questions.find(x=>x.id===id);if(q)return q;}return null;}
function getPackageById(id){for(const group of packagesBySection){const p=group.find(x=>x.id===id);if(p)return p;}return null;}
function loadSaved(){
  try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function saveSession(){
  if(!activeSession)return;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(activeSession));}catch(e){/* Private browsing or blocked storage: current tab still works. */}
}
function clearSaved(){try{localStorage.removeItem(STORAGE_KEY);}catch(e){}}
function restoreQuestions(session){return (session.questionIds||[]).map(getQuestionById).filter(Boolean);}
/* ===== Tìm kiếm câu hỏi: chỉ tìm trong nội dung câu hỏi, khớp cụm từ, bỏ qua hoa/thường, dấu, khoảng trắng và ký tự đặc biệt ===== */
const SEARCH_LIMIT=50;
let searchIndex=null,searchEl=null;
function foldText(text){
  let s='';const map=[];
  for(let i=0;i<text.length;i++){
    const f=text[i].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^\p{L}\p{N}]+/gu,'');
    for(let k=0;k<f.length;k++){s+=f[k];map.push(i);}
  }
  return {s,map};
}
function buildSearchIndex(){
  searchIndex=allQuestions().map(q=>{const text=q.text.replace(/^Câu\s+\d+\s*:\s*/i,'');return {q,text,f:foldText(text)};});
}
function runSearch(raw){
  const key=foldText(raw).s;
  if(!key)return null;
  if(!searchIndex)buildSearchIndex();
  return {key,hits:searchIndex.filter(it=>it.f.s.indexOf(key)>=0)};
}
function highlightHits(it,key){
  const {s,map}=it.f;let out='',pos=0,from=0;
  for(;;){
    const at=s.indexOf(key,from);if(at<0)break;
    const a=map[at],b=map[at+key.length-1]+1;
    if(a>=pos){out+=escapeHTML(it.text.slice(pos,a))+`<mark class="sx-hit">${escapeHTML(it.text.slice(a,b))}</mark>`;pos=b;}
    from=at+key.length;
  }
  return out+escapeHTML(it.text.slice(pos));
}
function renderSearch(raw){
  const info=searchEl.querySelector('.sx-info'),list=searchEl.querySelector('.sx-list');
  const r=runSearch(raw);
  if(!r){info.textContent='Nhập cụm từ có trong câu hỏi để tìm. Chỉ tìm trong nội dung câu hỏi, không tìm trong đáp án.';list.innerHTML='';return;}
  const total=r.hits.length;
  if(!total){info.textContent='Không có câu hỏi nào chứa cụm từ này.';list.innerHTML='';return;}
  info.textContent=total>SEARCH_LIMIT?`Có ${total} câu hỏi khớp · hiển thị ${SEARCH_LIMIT} câu đầu, hãy nhập thêm từ để thu hẹp kết quả.`:`Có ${total} câu hỏi khớp.`;
  list.innerHTML=r.hits.slice(0,SEARCH_LIMIT).map(it=>{
    const q=it.q,ans=q.options[q.answer];
    return `<article class="question-card"><div class="question-head"><div class="question-num"><span class="num-pill">${q.number}</span><span>Câu hỏi</span></div><div class="question-meta">${escapeHTML(sourceMeta(q))}</div></div><p class="question-text">${highlightHits(it,r.key)}</p>${ans?`<div class="review-key">Đáp án đúng: <strong>${escapeHTML(ans.letter)}.</strong> ${renderHighlighted(ans.body,ans.yellow)}</div>`:''}</article>`;
  }).join('');
}
function ensureSearchUI(){
  if(searchEl)return;
  searchEl=document.createElement('div');
  searchEl.className='sx-overlay';searchEl.hidden=true;
  searchEl.innerHTML=`<div class="sx-panel" role="dialog" aria-modal="true" aria-label="Tìm kiếm câu hỏi"><div class="sx-bar"><label class="sx-field">${ICON.search}<input type="search" id="sxInput" placeholder="Nhập cụm từ trong câu hỏi…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></label><button type="button" class="btn btn-quiet" id="sxClose">Đóng</button></div><p class="sx-info" aria-live="polite"></p><div class="sx-list"></div></div>`;
  document.body.appendChild(searchEl);
  const input=searchEl.querySelector('#sxInput');
  input.addEventListener('input',()=>renderSearch(input.value));
  searchEl.querySelector('#sxClose').addEventListener('click',closeSearch);
  searchEl.addEventListener('pointerdown',e=>{if(e.target===searchEl)closeSearch();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!searchEl.hidden)closeSearch();});
}
function openSearch(){
  ensureSearchUI();
  searchEl.hidden=false;document.body.style.overflow='hidden';
  const input=searchEl.querySelector('#sxInput');renderSearch(input.value);input.focus();input.select();
}
function closeSearch(){if(!searchEl)return;searchEl.hidden=true;document.body.style.overflow='';}

  const resultBtn=document.getElementById('resumeResult');
  if(resultBtn)resultBtn.addEventListener('click',()=>{const s=loadSaved();if(s&&s.phase==='completed'){activeSession=s;renderResult();}});
}
function startLearning(packageId){
  const pack=getPackageById(packageId);if(!pack)return;
  const section=BANK[pack.sectionIndex];
  activeSession={phase:'inprogress',mode:'learn',sessionTitle:`${section.title.replace(/^(?:I|II|III)\.\s*/,'')} · ${pack.title}`,packageId:pack.id,questionIds:pack.questions.map(q=>q.id),answers:pack.questions.map(()=>null),responses:pack.questions.map(()=>null),startedAt:Date.now(),deadline:null,submitted:false};
  renderSession();
}
function startRandomExam(){
  const sectionQuotas=apportion(EXAM_COUNT,BANK.map(s=>({weight:s.questions.length})));
  const chosen=[];
  BANK.forEach((section,si)=>{
    const packGroup=packagesBySection[si];
    const packQuotas=apportion(sectionQuotas[si],packGroup.map(p=>({weight:p.questions.length})));
    packGroup.forEach((pack,pi)=>{
      if(packQuotas[pi]>0) chosen.push(...sample(pack.questions,packQuotas[pi]));
    });
  });
  if(chosen.length<EXAM_COUNT){alert(`Ngân hàng hiện chỉ có ${chosen.length} câu đủ điều kiện, chưa đủ ${EXAM_COUNT} câu để tạo đề.`);return;}
  const shuffled=shuffle(chosen).slice(0,EXAM_COUNT);
  const now=Date.now();
  activeSession={phase:'inprogress',mode:'exam',sessionTitle:'Thi ngẫu nhiên',questionIds:shuffled.map(q=>q.id),answers:shuffled.map(()=>null),responses:shuffled.map(()=>null),startedAt:now,deadline:now+EXAM_MINUTES*60*1000,submitted:false};
  renderSession();
}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}}
function getSessionQuestions(){return restoreQuestions(activeSession);}
function makeTopbar(title,detail,answered,total,mode){
  const timer=mode==='exam'?`<div class="timer" id="timer">20:00</div>`:'';
  const submit=mode==='exam'?`<button class="btn btn-danger" id="submitExam">Nộp bài</button>`:'';
  return `<header class="topbar"><div class="topbar-main"><div class="topbar-title"><p class="eyebrow">${escapeHTML(title)}</p><h1>${escapeHTML(detail)}</h1></div>${mode==='exam'?timer:''}<div class="topbar-progress">Đã trả lời <strong id="answeredCount">${answered}</strong>/${total}${mode==='learn'?'<span class="tp-score"><span class="tp-ok">Đúng <strong id="correctCount">0</strong></span><span class="tp-bad">Sai <strong id="wrongCount">0</strong></span></span>':''}</div><div class="topbar-actions"><button class="btn btn-quiet" id="homeBtn">Trang chủ</button>${submit}</div></div><div class="progress-track"><div class="progress-fill" id="progressFill" style="width:${total?answered/total*100:0}%"></div></div></header>`;
}
function sourceMeta(q){
  const si=Number(q.id.slice(1,q.id.indexOf('-')))-1;
  return `${BANK[si].title.replace(/^(?:I|II|III)\.\s*/,'')} · Câu ${q.number}`;
}
// Trạng thái ô số câu: học từng phần / xem lại đáp án -> đúng (xanh lá) hoặc sai (đỏ); đang thi -> chỉ "đã trả lời" để không lộ đáp án.
function navState(q,answer,mode){
  if(answer===null||answer===undefined)return '';
  if(mode==='learn'||mode==='review')return answer===q.answer?'correct':'wrong';
  return 'answered';
}
function navLabel(i,state){return `Đến câu ${i+1}`+(state==='correct'?' (đã làm đúng)':state==='wrong'?' (đã làm sai)':'');}
function renderNav(questions,answers,mode){
  return `<aside class="question-nav" id="questionNav"><div class="nav-label">Câu hỏi</div>${questions.map((q,i)=>{const st=navState(q,answers[i],mode);return `<button class="nav-number ${st}" data-jump="${i}" id="nav-${i}" aria-label="${navLabel(i,st)}">${i+1}</button>`;}).join('')}</aside>`;
}
function renderQuestionCard(q,i,mode,answer){
  const displayNo=mode==='learn'?q.number:i+1;
  const meta=mode==='learn'?`Câu ${q.number} trong tài liệu`:`${escapeHTML(sourceMeta(q))}`;
  const opts=q.options.map((o,oi)=>`<button type="button" class="answer-option" data-option="${oi}" aria-pressed="false"><span class="letter">${escapeHTML(o.letter)}</span><span class="option-copy">${escapeHTML(o.body)}</span></button>`).join('');
  const status=answer===null?'Chưa trả lời':'Đã trả lời';
  return `<article class="question-card" id="question-${i}" data-q-index="${i}"><div class="question-head"><div class="question-num"><span class="num-pill">${displayNo}</span><span>Câu hỏi</span></div><div class="question-meta">${meta}</div></div><p class="question-text">${escapeHTML(q.text.replace(/^Câu\s+\d+\s*:\s*/i,''))}</p><div class="options">${opts}</div><div class="instant-feedback" id="feedback-${i}"></div></article>`;
}
function renderSession(){
  stopTimer();
  const questions=getSessionQuestions();
  if(!questions.length){renderHome();return;}
  const mode=activeSession.mode;
  const answered=(activeSession.answers||[]).filter(x=>x!==null && x!==undefined).length;
  let title=mode==='exam'?'Thi ngẫu nhiên':'Học từng phần';
  let detail=mode==='exam'?`${questions.length} câu hỏi · Thời gian ${EXAM_MINUTES} phút`:activeSession.sessionTitle;
  app.innerHTML=`<div class="session-page">${makeTopbar(title,detail,answered,questions.length,mode)}${renderNav(questions,activeSession.answers,mode)}<main class="question-main" id="questionMain">${questions.map((q,i)=>renderQuestionCard(q,i,mode,activeSession.answers[i])).join('')}${mode==='learn'?`<div class="session-end" id="learnEnd" hidden><h2>Hoàn thành chuyên đề!</h2><p id="learnEndText"></p><button class="btn" id="learnHome">Trở về trang chủ</button></div>`:''}</main></div>`;
  window.scrollTo({top:0,left:0,behavior:'instant'});
  document.getElementById('homeBtn').addEventListener('click',renderHome);
  if(mode==='exam')document.getElementById('submitExam').addEventListener('click',()=>submitExam(false));
  document.getElementById('questionMain').addEventListener('click',e=>{
    const btn=e.target.closest('[data-option]');if(!btn)return;
    const card=btn.closest('[data-q-index]');const i=Number(card.dataset.qIndex);const oi=Number(btn.dataset.option);
    if(!activeSession || activeSession.phase!=='inprogress')return;
    // Chốt đáp án (chế độ học từng phần): đã chọn rồi thì không cho đổi, giống index.html. Chế độ thi vẫn được đổi trước khi nộp bài.
    if(mode==='learn' && activeSession.answers[i]!==null && activeSession.answers[i]!==undefined)return;
    activeSession.answers[i]=oi;
    if(mode==='learn'){
      const q=questions[i];
      activeSession.responses[i]={phrase:randomItem(oi===q.answer?POSITIVE:NEGATIVE)};
    }
    updateQuestionCard(i,questions[i]);updateProgress();
    if(mode==='learn')updateLearnCompletion(questions);
  });
  document.getElementById('questionNav').addEventListener('click',e=>{
    const btn=e.target.closest('[data-jump]');if(!btn)return;
    jumpTo(Number(btn.dataset.jump));
  });
  window.removeEventListener('scroll',onScrollUpdate);
  window.addEventListener('scroll',onScrollUpdate,{passive:true});
  updateAllCards(questions);
  updateProgress();
  if(mode==='exam'){
    updateTimer();timerHandle=setInterval(updateTimer,500);
  }
  if(mode==='learn'){
    updateLearnCompletion(questions);
    const done=document.getElementById('learnHome');if(done)done.addEventListener('click',renderHome);
  }
  updateCurrentQuestion();
}
function updateQuestionCard(i,q){
  const card=document.getElementById(`question-${i}`);if(!card)return;
  const selected=activeSession.answers[i];
  const mode=activeSession.mode;
  const btns=card.querySelectorAll('.answer-option');
  card.dataset.state=selected===null?'':(mode==='learn'?(selected===q.answer?'right':'wrong'):'picked');
  btns.forEach((btn,oi)=>{
    btn.classList.remove('selected','correct','wrong');
    btn.setAttribute('aria-pressed',selected===oi?'true':'false');
    if(mode==='exam'){
      if(selected===oi)btn.classList.add('selected');
    }else if(selected!==null){
      if(oi===q.answer)btn.classList.add('correct');
      if(oi===selected && selected!==q.answer)btn.classList.add('wrong');
    }
  });
  const feedback=card.querySelector('.instant-feedback');
  if(mode==='learn' && selected!==null){
    const correct=selected===q.answer;
    const phrase=activeSession.responses[i]?.phrase||randomItem(correct?POSITIVE:NEGATIVE);
    const correctOpt=q.options[q.answer];
    feedback.innerHTML=`<div class="feedback-banner ${correct?'good':'bad'}">${escapeHTML(phrase)}</div><div class="correct-line"><strong>Đáp án đúng là: ${escapeHTML(correctOpt.letter)}.</strong> ${renderHighlighted(correctOpt.body,correctOpt.yellow)}</div>`;
  }else if(feedback){feedback.innerHTML='';}
  const nav=document.getElementById(`nav-${i}`);
  if(nav){
    const st=navState(q,selected,mode);
    nav.classList.remove('answered','correct','wrong');
    if(st)nav.classList.add(st);
    nav.setAttribute('aria-label',navLabel(i,st));
  }
}
function updateAllCards(questions){questions.forEach((q,i)=>updateQuestionCard(i,q));}
function updateProgress(){
  if(!activeSession)return;
  const total=activeSession.questionIds.length;
  const answered=activeSession.answers.filter(x=>x!==null && x!==undefined).length;
  const el=document.getElementById('answeredCount');if(el)el.textContent=answered;
  const fill=document.getElementById('progressFill');if(fill)fill.style.width=`${total?answered/total*100:0}%`;
  if(activeSession.mode==='learn'){
    let ok=0,bad=0;
    getSessionQuestions().forEach((q,i)=>{const a=activeSession.answers[i];if(a===null||a===undefined)return;if(a===q.answer)ok++;else bad++;});
    const c=document.getElementById('correctCount'),w=document.getElementById('wrongCount');
    if(c)c.textContent=ok;if(w)w.textContent=bad;
  }
  if(activeSession.mode==='exam'&&activeSession.phase==='inprogress')document.querySelectorAll('.nav-number').forEach((el,i)=>el.classList.toggle('answered',activeSession.answers[i]!==null&&activeSession.answers[i]!==undefined));
}
function updateLearnCompletion(questions){
  const end=document.getElementById('learnEnd');if(!end)return;
  const answered=activeSession.answers.filter(x=>x!==null).length;
  const total=questions.length;
  if(answered===total){
    const correct=questions.reduce((n,q,i)=>n+(activeSession.answers[i]===q.answer?1:0),0);
    const text=document.getElementById('learnEndText');
    if(text)text.textContent=`Bạn đã trả lời ${total}/${total} câu, đúng ${correct} câu (${(correct/total*100).toFixed(1)}%).`;
    end.hidden=false;
  }else end.hidden=true;
}
function jumpTo(i){
  const card=document.getElementById(`question-${i}`);if(card)card.scrollIntoView({behavior:'smooth',block:'start'});
}
function onScrollUpdate(){if(scrollFrame)return;scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;updateCurrentQuestion();});}
function updateCurrentQuestion(){
  const cards=Array.from(document.querySelectorAll('.question-card'));
  if(!cards.length)return;
  let found=cards.find(x=>x.getBoundingClientRect().bottom>125);
  if(!found)found=cards[cards.length-1];
  const i=Number(found.dataset.qIndex);
  document.querySelectorAll('.nav-number.current').forEach(x=>x.classList.remove('current'));
  const nav=document.getElementById(`nav-${i}`);if(nav){nav.classList.add('current');const p=nav.parentElement;if(nav.offsetLeft<p.scrollLeft+8 || nav.offsetLeft+nav.offsetWidth>p.scrollLeft+p.clientWidth-8)p.scrollTo({left:nav.offsetLeft-p.clientWidth/2+nav.offsetWidth/2,behavior:'smooth'});}
}
function updateTimer(){
  if(!activeSession || activeSession.mode!=='exam' || activeSession.phase!=='inprogress')return;
  const left=activeSession.deadline-Date.now();
  const el=document.getElementById('timer');
  if(el){el.textContent=formatTime(left);el.classList.toggle('urgent',left<=60*1000);}
  if(left<=0){submitExam(true);}
}
function calculateResult(){
  const questions=getSessionQuestions();
  const total=questions.length;
  const correct=questions.reduce((n,q,i)=>n+(activeSession.answers[i]===q.answer?1:0),0);
  const elapsed=Math.max(0,Math.min(Date.now()-(activeSession.startedAt||Date.now()),EXAM_MINUTES*60*1000));
  return {total,correct,wrong:total-correct,score:total?correct/total*100:0,elapsedMs:elapsed,elapsedText:formatTime(elapsed)};
}
function submitExam(auto){
  if(!activeSession || activeSession.mode!=='exam' || activeSession.phase!=='inprogress' || activeSession.submitted)return;
  const missing=activeSession.answers.findIndex(x=>x===null || x===undefined);
  if(missing!==-1 && !auto){
    const count=activeSession.answers.filter(x=>x===null || x===undefined).length;
    alert(`Còn ${count} câu chưa trả lời. Hãy hoàn thành các câu còn thiếu trước khi nộp bài.`);
    jumpTo(missing);return;
  }
  if(!auto && !confirm('Bạn chắc chắn muốn nộp bài và xem kết quả chứ?'))return;
  // Chọn sẵn câu cảm thán ngẫu nhiên cho từng câu thi để hiển thị ổn định khi xem lại.
  const submittedQuestions=getSessionQuestions();
  activeSession.responses=activeSession.responses||submittedQuestions.map(()=>null);
  submittedQuestions.forEach((q,i)=>{
    if(!activeSession.responses[i] || !activeSession.responses[i].phrase){
      const isCorrect=activeSession.answers[i]===q.answer;
      activeSession.responses[i]={phrase:randomItem(isCorrect?POSITIVE:NEGATIVE)};
    }
  });
  activeSession.submitted=true;
  activeSession.phase='completed';
  activeSession.result=calculateResult();
  activeSession.autoSubmitted=!!auto;
  saveSession();stopTimer();window.removeEventListener('scroll',onScrollUpdate);
  renderResult();
}
function renderResult(){
  stopTimer();window.removeEventListener('scroll',onScrollUpdate);
  const r=activeSession.result||calculateResult();
  const title=activeSession.sessionTitle||'Thi ngẫu nhiên';
  app.innerHTML=`<div class="result-wrap"><section class="result-hero"><div class="small-cap">Kết quả bài thi</div><div class="score-ring" style="--p:${r.score.toFixed(1)}"><div class="score">${r.score.toFixed(1)}<span style="font-size:.43em">/100</span></div></div><div class="score-label">${r.correct===r.total?'Hoàn thành xuất sắc!':r.correct>=r.total*.7?'Bạn đã hoàn thành bài thi.':'Hãy tiếp tục ôn luyện để cải thiện kết quả.'}</div><p style="margin:10px 0 0;color:rgba(255,255,255,.88)">${escapeHTML(title)}</p></section>
    <div class="result-grid"><div class="result-stat"><strong>${r.total}</strong><span>Tổng số câu</span></div><div class="result-stat"><strong style="color:var(--pine)">${r.correct}</strong><span>Số câu đúng</span></div><div class="result-stat"><strong style="color:var(--rose)">${r.wrong}</strong><span>Số câu sai</span></div><div class="result-stat"><strong>${r.total?(r.correct/r.total*100).toFixed(1):'0'}%</strong><span>Tỷ lệ chính xác</span></div></div>
    <p class="result-message">Thời gian hoàn thành: <strong>${escapeHTML(r.elapsedText)}</strong>${activeSession.autoSubmitted?' · Bài thi đã tự động nộp khi hết giờ.':''}</p>
    <div class="result-actions"><button class="btn btn-primary" id="reviewAnswers">Xem lại đáp án</button><button class="btn btn-quiet" id="redoExam">Làm lại bài</button><button class="btn btn-quiet" id="resultHome">Trang chủ</button><button class="btn btn-gold" id="newExam">Thi đề mới</button></div>
  </div>`;
  window.scrollTo({top:0,left:0,behavior:'instant'});
  document.getElementById('reviewAnswers').addEventListener('click',renderReview);
  document.getElementById('redoExam').addEventListener('click',redoExam);
  document.getElementById('resultHome').addEventListener('click',renderHome);
  document.getElementById('newExam').addEventListener('click',startRandomExam);
}
function redoExam(){
  if(!activeSession)return;
  const now=Date.now();
  activeSession.phase='inprogress';activeSession.submitted=false;activeSession.answers=activeSession.questionIds.map(()=>null);activeSession.responses=activeSession.questionIds.map(()=>null);activeSession.startedAt=now;activeSession.deadline=now+EXAM_MINUTES*60*1000;delete activeSession.result;delete activeSession.autoSubmitted;
  renderSession();
}
function renderHighlighted(body,ranges){
  if(!ranges || !ranges.length)return escapeHTML(body);
  const spans=ranges.map(([a,b])=>[Math.max(0,Math.min(body.length,a)),Math.max(0,Math.min(body.length,b))]).filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]);
  let merged=[];
  for(const [a,b] of spans){if(merged.length && a<=merged[merged.length-1][1])merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],b);else merged.push([a,b]);}
  let out='',pos=0;
  for(const [a,b] of merged){out+=escapeHTML(body.slice(pos,a))+`<mark class="mark">${escapeHTML(body.slice(a,b))}</mark>`;pos=b;}
  return out+escapeHTML(body.slice(pos));
}
function renderReview(){
  if(!activeSession || activeSession.mode!=='exam')return;
  stopTimer();
  const questions=getSessionQuestions();
  const r=activeSession.result||calculateResult();
  const cards=questions.map((q,i)=>{
    const chosen=activeSession.answers[i];
    const correct=(chosen===q.answer);
    const status=correct?'Đúng':chosen===null?'Chưa trả lời':'Sai';
    const opts=q.options.map((o,oi)=>{
      const isCorrect=oi===q.answer;
      const isWrongChoice=chosen===oi && !correct;
      const cls=isCorrect?'correct':isWrongChoice?'wrong':'';
      const text=renderHighlighted(o.body,o.yellow);
      return `<div class="review-option ${cls}"><span class="letter">${escapeHTML(o.letter)}</span><span>${text}${chosen===oi?' <strong>(Bạn chọn)</strong>':''}</span></div>`;
    }).join('');
    const key=q.options[q.answer];
    const phrase=activeSession.responses?.[i]?.phrase||randomItem(correct?POSITIVE:NEGATIVE);
    return `<article class="question-card" id="question-${i}" data-q-index="${i}" data-state="${correct?'right':chosen===null?'':'wrong'}"><div class="question-head"><div class="question-num"><span class="num-pill">${i+1}</span><span>Câu hỏi</span></div><div class="question-head"><span class="question-meta">${escapeHTML(sourceMeta(q))}</span><span class="question-status ${correct?'done':chosen===null?'':'bad'}">${status}</span></div></div><p class="question-text">${escapeHTML(q.text.replace(/^Câu\s+\d+\s*:\s*/i,''))}</p><div class="feedback-banner ${correct?'good':'bad'}">${escapeHTML(phrase)}</div><div class="options">${opts}</div><div class="review-key">Đáp án đúng: <strong>${escapeHTML(key.letter)}.</strong> ${renderHighlighted(key.body,key.yellow)}</div>${q.explanation?`<div class="review-note"><strong>Giải thích đáp án</strong><br>${escapeHTML(q.explanation)}</div>`:''}</article>`;
  }).join('');
  app.innerHTML=`<div class="session-page">${makeTopbar('Xem lại đáp án',`${r.correct}/${r.total} câu đúng · ${r.score.toFixed(1)} điểm`,r.total,r.total,'review').replace(/<div class="topbar-actions">[\s\S]*?<\/div>/,'<div class="topbar-actions"><button class="btn btn-quiet" id="reviewHome">Trang chủ</button></div>')}${renderNav(questions,activeSession.answers,'review')}<main class="question-main" id="questionMain">${cards}</main></div>`;
  window.scrollTo({top:0,left:0,behavior:'instant'});
  document.getElementById('reviewHome').addEventListener('click',renderHome);
  document.getElementById('questionNav').addEventListener('click',e=>{const btn=e.target.closest('[data-jump]');if(btn)jumpTo(Number(btn.dataset.jump));});
  window.removeEventListener('scroll',onScrollUpdate);window.addEventListener('scroll',onScrollUpdate,{passive:true});updateCurrentQuestion();
}

buildPackages();
renderHome();
</script>
